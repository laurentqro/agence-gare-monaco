  homepage:
    hero_title: "Fastigheter i Monaco sedan 1942"
    hero_subtitle: "Medlem i Chambre Immobilière Monégasque"
    about_title: "Om oss"
    about_text: "Idealiskt belägen i hjärtat av det livliga Condamine-kvarteret, vid foten av den majestätiska klippan där Furstens palats tronar, är vår fastighetsbyrå, ledd av Pierre Maré och hans son Adrien Maré, ett oberoende familjeföretag. Med rik erfarenhet och ett dynamiskt tillvägagångssätt har vi byggt förtroendefulla relationer med våra kunder, från generation till generation.\n\nVi erbjuder personlig förvaltning av era fastigheter, med noggrant underhåll och strikt uppföljning, för att garantera optimal hyresavkastning och kontinuerlig värdeökning av ert kapital över tid.\n\nOavsett om ni söker en fastighet att köpa eller hyra, för ett personligt eller professionellt projekt, står vårt team till ert förfogande för att stödja er i varje steg.\n\nVi tar hand om alla administrativa formaliteter som krävs för er etablering eller era hyresgästers: upprättande av hyreskontrakt, registrering hos skattemyndigheter, in- och utflyttningsbesiktningar samt tecknande av el-, vatten- och försäkringsavtal.\n\nVår expertis gör det även möjligt för oss att samarbeta med monegaskiska notarier och advokater för uppskattning och värdering av fastigheter. Dessutom erbjuder vi, i samarbete med den ansedda firman Tania Inredningsarkitektur, projekt för omgestaltning och renovering av lägenheter.\n\nVårt verksamhetsområde sträcker sig till Furstendömet Monaco och den angränsande franska regionen, tack vare vårt partnerskap med en lokal korrespondent."
    team_title: "Vårt Team"
    team:
      pierre_role: "Delägare"
      adrien_role: "Direktör / Förhandlare"
      josiane_role: "Sekretariat / Förvaltning"
