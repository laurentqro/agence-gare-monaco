  gestion:
    title: "Fastighetsförvaltning i Monaco"
    intro: "Som fastighetsägare kan det vara svårt att hantera sin egendom med tanke på olika personliga eller professionella åtaganden och den stress det kan medföra i vardagen. Agence de la Gare erbjuder er en komplett fastighetsförvaltning för alla era fastigheter, för att underlätta dialogen med era hyresgäster. Som fastighetsexperter ställer vi ett team av yrkesverksamma till ert förfogande som säkerställer förvaltningen av hela er hyresfastighetsportfölj."
    missions_title: "Vilka är vår byrås uppdrag?"
    missions_text: "Agence de la Gare utför en mängd uppdrag som sträcker sig från publicering av hyresannonsen till öppning av vatten- och elmätare, inklusive undertecknande av hyresavtalet."
    publication_title: "Hur publicerar vi er fastighet och väljer kandidater?"
    publication_text_1: "Vi publicerar er fastighet på alla våra kommunikationskanaler, med målet att hyra ut den så snart som möjligt. Därefter följer valet av hyresgäst."
    publication_text_2: "Vår roll är att utvärdera kandidaternas ekonomiska kapacitet. För att göra detta ber vi dem att tillhandahålla:"
    publication_item_1: "deras senaste lönebesked"
    publication_item_2: "deras anställningsavtal"
    publication_item_3: "bankintyg"
    publication_text_3: "En utredning hos de tidigare hyresvärdar som de sökande angett kan också genomföras med målet att besvara dessa två väsentliga frågor:"
    publication_question_1: "Är han en god betalare?"
    publication_question_2: "Är han av god karaktär?"
    publication_text_4: "Vårt särskilt krävande urval lämnar aldrig rum för tvivel. Hyresmarknaden har fördelen av en stark efterfrågan, vilket gör att vi kan vara särskilt selektiva. Ingen hyresgäst flyttar in i en lägenhet vi förvaltar utan starka garantier för betalningsförmåga."
    contract_title: "Hur utformar vi hyresavtalet och installerar hyresgästen?"
    contract_text_1: "Byrån tar hand om att upprätta hyresavtalet åt er. Detsamma gäller för genomförande av in- och utflyttningsbesiktning. Vi kan även, på er begäran, låta besiktningarna utföras av en kronofogde."
    contract_text_2: "Som förvaltare av era fastigheter hanterar vi alla administrativa förfaranden, inklusive registrering av er fastighet eller andra lagstadgade skyldigheter. Vår fastighetsbyrå kan till exempel vara den privilegierade kontakten med Skattemyndigheten."
    contract_text_3: "I permanent kontakt med hyresgästen tar våra team hand om öppning av vatten- och elmätare. Vi säkerställer också att hyresgästen har utfört obligatoriska kontroller, som till exempel pannkontroll."
    contract_text_4: "Vi kontrollerar att lägenheten är försäkrad, inte bara av er som ägare, utan även av hyresgästen. Vår byrå kan ordna tecknandet av dessa försäkringar vid behov."
    life_title: "Hur följer vi fastighetens hela livscykel?"
    life_text_1: "Utöver att fullgöra alla formaliteter kopplade till ägande av en hyresfastighet i Monaco deltar vi mer generellt i alla aktiviteter som rör byggnadens liv."
    life_text_2: "En av våra teammedlemmar kommer att närvara vid alla föreningsstämmor, en sammanfattning bifogas er akt så att ni när som helst kan ha en överblick över situationen för er fastighet. På samma sätt följer de eventuella underhålls- och renoveringsarbeten som utförs i er lägenhet eller i byggnaden."
    life_text_3: "Det är också denne som hanterar alla skador. De ser till att försäkringsbolagen informeras och kontaktar kompetenta företag för att återställa er fastighet så snabbt som möjligt."
    funds_title: "Hur förvaltar vi era medel?"
    funds_text_1: "Agence de la Gare ansvarar som förvaltare för inkassering av hyror. Vi säkerställer att medlen betalas av hyresgästen utan uteblivna eller försenade betalningar. Oavsett om det gäller fondavropsanrop, utskick av hyreskvitton eller rättvis reglering av avgifter, övervakar förvaltaren alla ekonomiska rörelser som rör er fastighet."
    funds_text_2: "Agence de la Gare har i flera decennier förvaltat flera fastighetsportföljer i Monaco. Vi har ett expertteam och all nödvändig kunskap för att förvalta era fastigheter effektivt och omsorgsfullt."
    cta_title: "Vill du dra nytta av vår fastighetsförvaltning?"
    cta_text: "Kontakta oss för att prata med vår specialiserade hyresförvaltningsavdelning och lära dig mer om våra tjänster."

  vendre:
    title: "Hur säljer du din fastighet i Monaco?"
    intro: "Vårt expertteam vägleder dig genom varje steg i försäljningen av din fastighet i Monaco. Från värdering till undertecknande av notariellt köpebrev ställer vi vår expertis till din tjänst för att säkerställa en framgångsrik transaktion."
    estimate_title: "Hur mycket är din fastighet i Monaco värd?"
    estimate_text: "En bra värdering är nyckeln till en framgångsrik försäljning. Våra experter analyserar fastighetsmarknaden i Monaco, jämför nyligen sålda liknande fastigheter och tar hänsyn till de unika egenskaperna hos din fastighet för att erbjuda dig en rättvis och realistisk uppskattning. Detta steg är avgörande för att attrahera seriösa köpare och sälja under de bästa förhållandena."
    admin_title: "Vilka dokument behövs för att sälja i Monaco?"
    admin_text: "Vi tar hand om allt för att förenkla ditt liv. Vårt team samlar in alla dokument som krävs för att sälja din fastighet."
    admin_docs_intro: "Vi samlar in följande dokument från dig:"
    admin_doc_1: "Ägandebevis"
    admin_doc_2: "Senaste protokoll från stämman"
    admin_doc_3: "Obligatoriska tekniska diagnoser"
    admin_doc_4: "Redovisning av föreningsavgifter"
    admin_doc_5: "Fastighetsskatt"
    admin_doc_6: "Planritningar"
    admin_doc_7: "Ytintyg (Carrez-lagen)"
    admin_doc_8: "Senaste avgiftskvitton"
    admin_mandate_intro: "När din dokumentation är komplett kan vi upprätta försäljningsmandatet som formaliserar vårt samarbete."
    mandate_title: "Allt du behöver veta om försäljningsmandatet"
    mandate_intro: "Försäljningsmandatet kan ta tre olika former. Var och en erbjuder specifika fördelar beroende på din situation och dina mål."
    mandate_simple_title: "Det enkla mandatet"
    mandate_simple_text_1: "Det enkla mandatet låter dig anförtro försäljningen av din fastighet till flera byråer samtidigt. Du behåller också möjligheten att sälja på egen hand."
    mandate_simple_text_2: "Denna formel erbjuder stor flexibilitet men kan resultera i mindre engagemang från varje byrå, eftersom fastigheten erbjuds av flera mellanhänder."
    mandate_simple_text_3: "Det enkla mandatet är lämpligt om du vill maximera synligheten för din fastighet hos olika nätverk av potentiella köpare."
    mandate_exclusive_title: "Det exklusiva mandatet"
    mandate_exclusive_text_1: "Det exklusiva mandatet anförtror försäljningen av din fastighet till en enda byrå under en bestämd period. Denna exklusivitet gör det möjligt för oss att använda alla våra resurser för att sälja din fastighet under de bästa förhållandena."
    mandate_exclusive_text_2: "Med ett exklusivt mandat investerar vi mer i marknadsföringen av din fastighet: professionell fotografering, virtuella visningar, riktad spridning till vårt nätverk av kvalificerade köpare."
    mandate_exclusive_text_3: "Denna formel rekommenderas för prestigefastigheter eller när diskretion önskas."
    mandate_coexclusive_title: "Det samexklusiva mandatet"
    mandate_coexclusive_text_1: "Det samexklusiva mandatet är en kompromiss mellan det enkla och det exklusiva mandatet. Du anförtror försäljningen till ett begränsat antal byråer (vanligtvis två eller tre) som arbetar tillsammans."
    mandate_coexclusive_text_2: "Denna formel gör det möjligt att dra nytta av god marknadstäckning samtidigt som ett högt engagemang från de mandaterade byråerna upprätthålls."
    mandate_choice: "När det gäller att välja typ av mandat ger vårt team dig råd baserat på din fastighets karaktär, den aktuella marknaden och dina prioriteringar. Vi vägleder dig i att fatta det bästa beslutet."
    selling_title: "Hur säljer vi din fastighet?"
    selling_text_1: "När mandatet är undertecknat implementerar vi vår marknadsföringsstrategi. Din fastighet sprids via alla våra kanaler: webbplats, fastighetsportaler, sociala medier och vårt nätverk av kvalificerade köpare."
    selling_text_2: "När en potentiell köpare visar intresse organiserar vi visningar och förhandlar på dina vägnar för att uppnå bästa pris. Varje bud presenteras för dig med vår analys och våra rekommendationer."
    selling_text_3: "När budet accepteras följer vi båda parter till undertecknandet av förhandsavtalet inför notarien. Detta dokument binder köpare och säljare och fastställer villkoren för transaktionen."
    selling_text_4: "Undertecknandet av det notariella köpebrevet hos notarien slutför försäljningen. Vi stannar vid din sida till detta sista steg för att säkerställa att allt går perfekt."
    funds_title: "När och hur betalas medlen ut?"
    funds_text_1: "Efter undertecknandet av det notariella köpebrevet genomför notarien utbetalningen av medel. Försäljningspriset, efter avdrag för avgifter och eventuella låneåterbetalningar, betalas ut till dig inom dagar efter undertecknandet."
    funds_text_2: "Vårt team förblir tillgängligt efter försäljningen för att svara på alla dina frågor och stödja dig i dina framtida projekt."
    cta_title: "Planerar du att sälja?"
    cta_text: "Vill du anförtro oss försäljningen av din fastighet? Fyll i formuläret nedan så kontaktar en av våra fastighetsmäklare dig så snart som möjligt."

