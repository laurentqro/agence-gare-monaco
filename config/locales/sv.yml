  gestion:
    title: "Fastighetsförvaltning i Monaco"
    intro: "Som fastighetsägare kan det vara svårt att hantera sin egendom med tanke på olika personliga eller professionella åtaganden och den stress det kan medföra i vardagen. Agence de la Gare erbjuder er en komplett fastighetsförvaltning för alla era fastigheter, för att underlätta dialogen med era hyresgäster. Som fastighetsexperter ställer vi ett team av yrkesverksamma till ert förfogande som säkerställer förvaltningen av hela er hyresfastighetsportfölj."
    missions_title: "Vilka är vår byrås uppdrag?"
    missions_text: "Agence de la Gare utför en mängd uppdrag som sträcker sig från publicering av hyresannonsen till öppning av vatten- och elmätare, inklusive undertecknande av hyresavtalet."
    publication_title: "Hur publicerar vi er fastighet och väljer kandidater?"
    publication_text_1: "Vi publicerar er fastighet på alla våra kommunikationskanaler, med målet att hyra ut den så snart som möjligt. Därefter följer valet av hyresgäst."
    publication_text_2: "Vår roll är att utvärdera kandidaternas ekonomiska kapacitet. För att göra detta ber vi dem att tillhandahålla:"
    publication_item_1: "deras senaste lönebesked"
    publication_item_2: "deras anställningsavtal"
    publication_item_3: "bankintyg"
    publication_text_3: "En utredning hos de tidigare hyresvärdar som de sökande angett kan också genomföras med målet att besvara dessa två väsentliga frågor:"
    publication_question_1: "Är han en god betalare?"
    publication_question_2: "Är han av god karaktär?"
    publication_text_4: "Vårt särskilt krävande urval lämnar aldrig rum för tvivel. Hyresmarknaden har fördelen av en stark efterfrågan, vilket gör att vi kan vara särskilt selektiva. Ingen hyresgäst flyttar in i en lägenhet vi förvaltar utan starka garantier för betalningsförmåga."
    contract_title: "Hur utformar vi hyresavtalet och installerar hyresgästen?"
    contract_text_1: "Byrån tar hand om att upprätta hyresavtalet åt er. Detsamma gäller för genomförande av in- och utflyttningsbesiktning. Vi kan även, på er begäran, låta besiktningarna utföras av en kronofogde."
    contract_text_2: "Som förvaltare av era fastigheter hanterar vi alla administrativa förfaranden, inklusive registrering av er fastighet eller andra lagstadgade skyldigheter. Vår fastighetsbyrå kan till exempel vara den privilegierade kontakten med Skattemyndigheten."
    contract_text_3: "I permanent kontakt med hyresgästen tar våra team hand om öppning av vatten- och elmätare. Vi säkerställer också att hyresgästen har utfört obligatoriska kontroller, som till exempel pannkontroll."
    contract_text_4: "Vi kontrollerar att lägenheten är försäkrad, inte bara av er som ägare, utan även av hyresgästen. Vår byrå kan ordna tecknandet av dessa försäkringar vid behov."
    life_title: "Hur följer vi fastighetens hela livscykel?"
    life_text_1: "Utöver att fullgöra alla formaliteter kopplade till ägande av en hyresfastighet i Monaco deltar vi mer generellt i alla aktiviteter som rör byggnadens liv."
    life_text_2: "En av våra teammedlemmar kommer att närvara vid alla föreningsstämmor, en sammanfattning bifogas er akt så att ni när som helst kan ha en överblick över situationen för er fastighet. På samma sätt följer de eventuella underhålls- och renoveringsarbeten som utförs i er lägenhet eller i byggnaden."
    life_text_3: "Det är också denne som hanterar alla skador. De ser till att försäkringsbolagen informeras och kontaktar kompetenta företag för att återställa er fastighet så snabbt som möjligt."
    funds_title: "Hur förvaltar vi era medel?"
    funds_text_1: "Agence de la Gare ansvarar som förvaltare för inkassering av hyror. Vi säkerställer att medlen betalas av hyresgästen utan uteblivna eller försenade betalningar. Oavsett om det gäller fondavropsanrop, utskick av hyreskvitton eller rättvis reglering av avgifter, övervakar förvaltaren alla ekonomiska rörelser som rör er fastighet."
    funds_text_2: "Agence de la Gare har i flera decennier förvaltat flera fastighetsportföljer i Monaco. Vi har ett expertteam och all nödvändig kunskap för att förvalta era fastigheter effektivt och omsorgsfullt."
    cta_title: "Vill du dra nytta av vår fastighetsförvaltning?"
    cta_text: "Kontakta oss för att prata med vår specialiserade hyresförvaltningsavdelning och lära dig mer om våra tjänster."

  vendre:
    title: "Hur säljer du din fastighet i Monaco?"
    intro: "Vårt expertteam vägleder dig genom alla nödvändiga steg för att förverkliga ditt försäljningsprojekt i Monaco."
    estimate_title: "Värdera din fastighet"
    estimate_text: "En bra värdering av din fastighet gör det möjligt att slutföra en snabb försäljning, eftersom fastighetens verkliga värde lockar rätt köpare. För att bedöma din fastighets verkliga värde kommer en av vår byrås förhandlare att besöka fastigheten för att samla in så mycket information som möjligt för att uppskatta rätt pris. Här är de metoder som vi stödjer oss på för att värdera din fastighet."
    admin_title: "Vi sköter hela den administrativa delen av försäljningen"
    admin_text: "Vi tar hand om allt för att din upplevelse ska bli så behaglig som möjligt."
    admin_docs_intro: "Vi samlar in samtliga dokument som krävs för försäljningen av din fastighet från dig, det vill säga:"
    admin_doc_1: "ditt ägandebevis för fastigheten som ska säljas,"
    admin_doc_2: "en kopia av dina identitetshandlingar (giltigt pass och identitetskort och/eller uppehållstillstånd)"
    admin_doc_3: "en kopia av ett bostadsintyg"
    admin_doc_4: "de tre senaste protokollen från bostadsrättsföreningens stämma,"
    admin_doc_5: "föreningens stadgar,"
    admin_doc_6: "samtliga juridiska dokument som rör ditt bolag, om du genomför försäljningen i egenskap av juridisk person,"
    admin_doc_7: "underlaget för hyresförvaltning om fastigheten du säljer omfattas av ett hyresavtal,"
    admin_doc_8: "slutbesiktningsunderlaget för arbeten inom ramen för byggprojekt som kräver bygglov."
    admin_mandate_intro: "När ditt underlag är komplett kommer vårt team att föreslå att ett försäljningsuppdrag ingås. Det är ett avtal som anger försäljningspriset, vår ersättning, dess löptid samt villkoren. Det är ett bilateralt avtal som ömsesidigt binder oss."
    mandate_title: "Allt du behöver veta om försäljningsuppdraget"
    mandate_intro: "Försäljningsuppdraget kan ta tre former. Det kan vara enkelt, exklusivt eller samexklusivt:"
    mandate_simple_title: "Det enkla försäljningsuppdraget"
    mandate_simple_text_1: "Denna typ av uppdrag gör det möjligt för dig att anförtro försäljningen av din fastighet till flera fastighetsbyråer (juridiskt mer korrekt kallade uppdragstagare). Det ger dig också möjligheten att sälja din fastighet på egen hand. Den uppdragstagare som har lyckats sätta dig i kontakt med en köpare och leda förhandlingarna är den enda som ersätts för sin tjänst."
    mandate_simple_text_2: "Denna typ av uppdrag ger dig stor handlingsfrihet, men har dock negativa aspekter. Den stora konkurrensen mellan aktörerna minskar i motsvarande grad deras chans att bli ersatta. Detta tenderar ofta att begränsa våra konkurrenters engagemang. Dessutom är det vanligt att se samma fastighet annonseras med olika uppgifter såsom försäljningspris, yta… vilket är ett allvarligt handikapp i förhandlingarna med potentiella köpare."
    mandate_simple_text_3: "Det är alltså ett intressant uppdrag för dig om du vill behålla kontrollen över försäljningen av din fastighet, men som dock kan vara särskilt kontraproduktivt."
    mandate_exclusive_title: "Det exklusiva uppdraget"
    mandate_exclusive_text_1: "Det exklusiva försäljningsuppdraget anförtror försäljningen av fastigheten till en enda fastighetsbyrå. Kommunikationen om fastigheten är här mycket mer konsekvent. Dessutom kommer fastighetsbyrån, medveten om att den är ensam i loppet om att sälja fastigheten, att lägga ned alla nödvändiga ekonomiska och mänskliga resurser för att maximera försäljningen inom bästa möjliga tid och villkor."
    mandate_exclusive_text_2: "Strategierna för försäljningen av fastigheten kommer att beslutas av ett och samma team, vilket gör att köparna ser ett konsekvent erbjudande. Känslan av tillförlitlighet är avgörande i den senare förhandlingsfasen. Förtroendet mellan parterna under förhandlingarna är nämligen den huvudsakliga ingrediensen för en lyckad försäljning."
    mandate_exclusive_text_3: "Eftersom detta uppdrag är exklusivt måste du välja din uppdragstagare med omsorg. Du förlorar nämligen friheten att sälja din fastighet på egen hand eller att låta flera byråer konkurrera. Genom att arbeta med vår byrå får du dock en enda kontaktperson som centraliserar alla förfrågningar från potentiella köpare eller andra byråer och har full kontroll över din fastighet och den information som lämnas ut."
    mandate_coexclusive_title: "Det samexklusiva uppdraget"
    mandate_coexclusive_text_1: "Det samexklusiva uppdraget kan vara den hybrida lösningen i de fall då varken villkoren för det enkla uppdraget eller de för det exklusiva uppdraget tillfredsställer dig. Detta uppdrag vilar på samma principer som de som styr det exklusiva uppdrag som vi just har presenterat. Det gör det dock möjligt för dig att anförtro försäljningen av din fastighet till två fastighetsbyråer."
    mandate_coexclusive_text_2: "Det har exakt samma fördelar, vilka är en större tillgång till ekonomiska och mänskliga resurser från byråernas sida och en bättre harmoniserad kommunikationsstrategi än i det enkla uppdraget."
    mandate_choice: "När det gäller att välja mellan dessa olika typer av uppdrag, särskilt om du tvekar mellan ett exklusivt eller samexklusivt uppdrag, är det bäst att ta kontakt med den byrå du föredrar. På så sätt kan den vägleda dig till en uppdragstagare med vilken ett samarbete kan genomföras så att en synergi uppstår. Du mångdubblar därmed krafterna för att uppnå bättre resultat."
    selling_title: "Hur säljer vi din fastighet?"
    selling_text_1: "Våra team tar fram ett säljargument som åtföljer det visuella innehållet (HD-videor och HD-foton i 360°) på alla de kanaler som vi behärskar (webbplats, sociala medier, pressöversikter osv). När en köpare är intresserad låter vi vederbörande besöka fastigheten tillsammans med en av våra förhandlare."
    selling_text_2: "Efter denna process, om kunden är intresserad av fastigheten, upprättar vi ett köpeerbjudande som återger köparens villkor, åtföljt av en check på ett belopp motsvarande 10% av det föreslagna beloppet, ställd till notarien, för att bevisa köparens goda vilja att förvärva fastigheten. Observera att vi har ständig kontakt med säljaren och köparen under hela försäljningsprocessen. I de fall det finns enighet om priset och saken bokar vi tid hos en notarie i furstendömet för undertecknandet av det preliminära köpeavtalet. Checken löses in som handpenning att avräknas på fastighetens försäljningspris."
    selling_text_3: "Som vi har understrukit i vår köpguide för att bosätta sig i Monaco är undertecknandet av ett preliminärt köpeavtal inte obligatoriskt, men kan vara nödvändigt, särskilt inom ramen för den monegaskiska statens förköpsrätt. Denna rätt gäller alla byggnader uppförda före 1947."
    selling_text_4: "Slutligen, efter att alla uppskjutande villkor har uppfyllts inom de fastställda tidsfristerna, är det dags att åter träffas hos notarien för undertecknandet av det slutliga köpebrevet, det datum då förvärvaren i sin helhet ska betala beloppet som motsvarar priset för nämnda fastighet, efter avdrag för handpenningen, samt notariearvodet på ett belopp av 6% och byråprovisionen på ett belopp av 3% exklusive skatt på fastighetens pris, enligt den monegaskiska fastighetskammarens taxa. I de fall ett av de uppskjutande villkoren inte uppfylls återbetalas handpenningschecken till förvärvaren och försäljningen anses annullerad."
    funds_title: "Utbetalningen av medlen"
    funds_text_1: "När dokumenten är undertecknade inför notarien betalas medlen ut till dig av notariekontoret inom 15 dagar, efter avdrag för säljarens byråarvode, fastställt enligt den monegaskiska fastighetskammarens taxa till 5% exklusive skatt på försäljningspriset."
    funds_text_2: "Vi hoppas att du nu vet mer om vår process för att sälja en fastighet i Monaco. För all information om köp, försäljning, uthyrning, förvaltning och värdering av dina fastigheter i Monaco väntar vårt team på dig med glädje och står till ditt förfogande."
    cta_title: "Planerar du att sälja?"
    cta_text: "Vill du anförtro oss försäljningen av din fastighet? Fyll i formuläret nedan så kontaktar en av våra fastighetsmäklare dig så snart som möjligt."

