  homepage:
    hero_title: "Fastigheter i Monaco sedan 1942"
    hero_subtitle: "Medlem i Chambre Immobilière Monégasque"
    about_title: "Agence Immobilière de la Gare"
    about_history: "Agence Immobilière de la Gare grundades 1942 och är ett oberoende familjeföretag samt medlem i Chambre Immobilière Monégasque. Idealiskt belägen i hjärtat av det livliga Condamine-kvarteret, vid foten av den majestätiska klippan där Furstens palats tronar, leds vår byrå av Pierre Maré och hans son Adrien Maré. Med rik erfarenhet och ett dynamiskt tillvägagångssätt har vi byggt förtroendefulla relationer med våra kunder, från generation till generation."
    about_services: "Vi erbjuder omfattande fastighetsförsäljning, uthyrning och förvaltning i Monaco. Vi erbjuder personlig förvaltning av era fastigheter, med noggrant underhåll och strikt uppföljning, för att garantera optimal hyresavkastning. Vi tar hand om alla administrativa formaliteter: upprättande av hyreskontrakt, skatteregistrering, in- och utflyttningsbesiktningar samt el-, vatten- och försäkringsavtal."
    about_expertise: "Vår expertis gör det möjligt att samarbeta med monegaskiska notarier och advokater för uppskattning och värdering av fastigheter. I samarbete med firman Tania Inredningsarkitektur erbjuder vi projekt för omgestaltning av lägenheter. Vårt verksamhetsområde sträcker sig till Furstendömet Monaco och den angränsande franska regionen. Kontakta oss på (+377) 93 30 22 36 eller info@agencegaremonaco.com."
    team_title: "Vårt Team"
    team:
      email_member: "Mejla %{name}"
      pierre_role: "Delägare"
      adrien_role: "Direktör / Förhandlare"
      josiane_role: "Sekretariat / Förvaltning"
      pierre_bio: "Pierre Maré är medchef för Agence Immobilière de la Gare i Monaco. Med flera decenniers erfarenhet av monegaskisk fastighetsverksamhet leder han familjebyrån som grundades 1942. Hans djupa kunskap om Furstendömets fastighetsmarknad och långvariga relationer med lokala notarier och advokater gör honom till en betrodd rådgivare för fastighetstransaktioner i Monaco."
      adrien_bio: "Adrien Maré är direktör och förhandlare på Agence Immobilière de la Gare. Som representant för den nya generationen av detta familjeföretag grundat 1942, tillför han ett dynamiskt och modernt synsätt på monegaskisk fastighetsverksamhet. Specialiserad på försäljning och förhandling vägleder Adrien sina kunder genom varje steg i deras fastighetsprojekt i Monaco."
      josiane_bio: "Josiane Alesi är ansvarig för sekretariat och fastighetsförvaltning på Agence Immobilière de la Gare. Med ingående kunskap om monegaskiska administrativa förfaranden hanterar hon den dagliga förvaltningen av hyresfastigheter, hyresavtal, besiktningar och hyresgästrelationer."
    featured_articles_title: "Artiklar"
    articles_view_all: "Se alla artiklar"
    read_more: "Läs mer"
    contact_title: "Kontakta oss"
    carousel_title: "Monaco"
    card_buy: "Köpa"
    card_rent: "Hyra"
    card_offmarket: "Off-market"
    card_sell: "Sälja"
    card_management: "Förvaltning"
    videos_title: "Videor"
    videos_view_channel: "Se alla våra videor"
    faq_title: "Vanliga frågor"
    faqs:
      - question: "Vad är Agence Immobilière de la Gare?"
        answer: "Agence Immobilière de la Gare är en oberoende familjebyrå grundad 1942 i Monaco, medlem i Chambre Immobilière Monégasque. Belägen på 3, Rue Langlé i Condamine-kvarteret, leds den av Pierre Maré och hans son Adrien Maré."
      - question: "Vilka tjänster erbjuder ni?"
        answer: "Vi erbjuder kompletta tjänster inom fastighetsförsäljning, uthyrning och förvaltning i Monaco och på Franska Rivieran. Vi tillhandahåller även fastighetsvärderingar, hyresavtal, skatteregistrering och besiktningar."
      - question: "I vilka stadsdelar i Monaco verkar ni?"
        answer: "Vi verkar i alla stadsdelar i Monaco: Monte-Carlo, Condamine, Fontvieille, Larvotto, Moneghetti, Saint-Roman och Monaco-Ville. Vårt område sträcker sig även till den angränsande franska regionen."
      - question: "Hur kontaktar jag byrån?"
        answer: "Du kan nå oss per telefon på (+377) 93 30 22 36, via e-post på info@agencegaremonaco.com eller besöka oss på 3, Rue Langlé, MC 98000 Monaco. Vi har öppet måndag till fredag 9:00-18:00."
      - question: "Vad är en off-market-fastighet?"
        answer: "En off-market-fastighet säljs konfidentiellt, utan att listas på offentliga fastighetsportaler. Agence Immobilière de la Gare har en exklusiv portfölj av off-market-fastigheter i Monaco, tillgängliga på begäran."
      - question: "Erbjuder ni fastighetsförvaltning?"
        answer: "Ja, sedan 1942 erbjuder vi en komplett fastighetsförvaltning i Monaco. Vi hanterar hyresgästsökning, hyresavtal, besiktningar, hyresinkassering och alla administrativa formaliteter."

