  gestion:
    title: "Gestione locativa a Monaco"
    intro: "Quando si è proprietari di un immobile, può essere difficile gestirlo considerando i diversi impegni personali o professionali e lo stress che questo può generare quotidianamente. L'Agence de la Gare mette a vostra disposizione un servizio di gestione immobiliare per tutti i vostri beni, al fine di facilitare il dialogo con i vostri inquilini. In qualità di esperti immobiliari, mettiamo al vostro servizio un team di professionisti che assicurerà la gestione dell'intero vostro patrimonio immobiliare in affitto."
    missions_title: "Quali sono le missioni della nostra agenzia?"
    missions_text: "L'Agence de la Gare svolge una moltitudine di missioni che vanno dalla pubblicazione dell'annuncio di locazione all'apertura dei contatori di acqua ed elettricità, passando per la firma del contratto di locazione."
    publication_title: "Come pubblichiamo il vostro immobile e selezioniamo i candidati?"
    publication_text_1: "Pubblichiamo il vostro immobile su tutti i nostri canali di comunicazione, con l'obiettivo di metterlo in affitto il prima possibile. Segue poi la scelta dell'inquilino."
    publication_text_2: "Il nostro ruolo è valutare le capacità finanziarie dei candidati. Per farlo, chiediamo loro di fornire:"
    publication_item_1: "le ultime buste paga"
    publication_item_2: "il contratto di lavoro"
    publication_item_3: "attestazione bancaria"
    publication_text_3: "Un'indagine presso i precedenti locatori dichiarati dagli interessati può essere effettuata con l'obiettivo di rispondere a queste due domande essenziali:"
    publication_question_1: "È un buon pagatore?"
    publication_question_2: "È di buona moralità?"
    publication_text_4: "La nostra selezione, particolarmente esigente, non lascia mai spazio al dubbio. Il mercato degli affitti ha il vantaggio di una forte domanda, il che ci permette di essere particolarmente selettivi. Nessun inquilino si installa in un appartamento che gestiamo senza forti garanzie di solvibilità."
    contract_title: "Come redigiamo il contratto di locazione e installiamo l'inquilino?"
    contract_text_1: "L'agenzia si occupa di redigere il contratto di locazione per voi. Lo stesso vale per la realizzazione dello stato dei luoghi di ingresso e di uscita dell'inquilino. Possiamo anche, su vostra richiesta, far realizzare gli stati dei luoghi da un ufficiale giudiziario."
    contract_text_2: "In qualità di gestore dei vostri beni, ci occupiamo di tutte le pratiche amministrative, inclusa la registrazione del vostro immobile o qualsiasi altro obbligo legale. Ad esempio, la nostra agenzia immobiliare può essere l'interlocutore privilegiato dei Servizi Fiscali."
    contract_text_3: "In contatto permanente con l'inquilino, i nostri team si occupano dell'apertura dei contatori di acqua ed elettricità. Ci assicuriamo inoltre che l'inquilino abbia effettuato i controlli obbligatori, come il controllo della caldaia, ad esempio."
    contract_text_4: "Verifichiamo che l'appartamento sia assicurato, non solo da voi in qualità di proprietario, ma anche dall'inquilino. La nostra agenzia può occuparsi della sottoscrizione di queste assicurazioni, se necessario."
    life_title: "Come seguiamo tutta la vita del vostro immobile?"
    life_text_1: "Oltre all'espletamento di tutte le formalità relative al possesso di un immobile in affitto a Monaco, partecipiamo più in generale a tutte le attività che riguardano la vita dell'edificio."
    life_text_2: "Uno dei membri del nostro team sarà presente a tutte le assemblee generali del condominio, una nota di sintesi sarà allegata al vostro fascicolo in modo che possiate avere, in qualsiasi momento, una visione d'insieme della situazione del vostro immobile. Allo stesso modo, seguirà gli eventuali lavori di manutenzione e di rimessa in stato che saranno effettuati nel vostro appartamento o nell'edificio."
    life_text_3: "Sarà inoltre lui a gestire qualsiasi sinistro. Si occuperà di informare le assicurazioni e contatterà le società competenti per rimettere in stato il vostro immobile il più rapidamente possibile."
    funds_title: "Come gestiamo i vostri fondi?"
    funds_text_1: "L'Agence de la Gare, in qualità di gestore, si occupa dell'incasso degli affitti. Ci assicuriamo che i fondi siano versati dall'inquilino, senza mancanze né ritardi di pagamento. Che si tratti di richieste di fondi, dell'invio delle quietanze di affitto o della giusta regolarizzazione delle spese, il gestore segue l'insieme dei movimenti finanziari relativi al vostro immobile."
    funds_text_2: "L'Agence de la Gare assicura da diversi decenni la gestione di diversi patrimoni immobiliari a Monaco. Abbiamo un team esperto e tutte le competenze necessarie per gestire con cura e efficacia i vostri beni immobiliari."
    cta_title: "Desiderate usufruire del nostro servizio di gestione immobiliare?"
    cta_text: "Contattateci per parlare con il nostro dipartimento specializzato nella gestione locativa e scoprire di più sui nostri servizi."

  vendre:
    title: "Come vendere il proprio immobile a Monaco?"
    intro: "Il nostro team di esperti vi accompagna in tutte le fasi necessarie alla realizzazione del vostro progetto di vendita a Monaco."
    estimate_title: "Stimate il valore del vostro immobile"
    estimate_text: "Una buona stima del vostro immobile permetterà di concludere una vendita rapida poiché il valore reale del vostro bene attirerà i giusti acquirenti. Per valutare il valore reale del vostro immobile, uno dei negoziatori della nostra agenzia verrà a visitare il vostro bene al fine di raccogliere il maggior numero di elementi che consentano di stimare il giusto prezzo. Ecco i metodi su cui ci basiamo per stimare il vostro immobile."
    admin_title: "Gestiamo tutta la parte amministrativa della vendita"
    admin_text: "Ci occupiamo di tutto affinché la vostra esperienza sia la più piacevole possibile."
    admin_docs_intro: "Raccogliamo da voi l'insieme dei documenti necessari per la vendita del vostro immobile, ovvero:"
    admin_doc_1: "il vostro attestato di proprietà del bene da vendere,"
    admin_doc_2: "una copia dei vostri documenti d'identità (passaporto e carta d'identità e/o di soggiorno in corso di validità)"
    admin_doc_3: "una copia di un giustificativo di domicilio"
    admin_doc_4: "gli ultimi tre verbali dell'assemblea generale di condominio,"
    admin_doc_5: "il regolamento di condominio,"
    admin_doc_6: "l'insieme dei documenti giuridici relativi alla vostra società, se realizzate la vendita in qualità di persona giuridica,"
    admin_doc_7: "il fascicolo di gestione locativa se il bene che vendete è oggetto di un contratto di locazione,"
    admin_doc_8: "il fascicolo di collaudo dei lavori nell'ambito di cantieri soggetti a permesso."
    admin_mandate_intro: "Una volta completato il vostro fascicolo, il nostro team vi proporrà la stipula di un mandato di vendita. Si tratta di un contratto che indica il prezzo di vendita, il nostro compenso, la sua durata nonché le sue condizioni. È un contratto bilaterale che ci impegna reciprocamente."
    mandate_title: "Tutto quello che c'è da sapere sul mandato di vendita"
    mandate_intro: "Il mandato di vendita può assumere tre forme. Può essere semplice, esclusivo o co-esclusivo:"
    mandate_simple_title: "Il mandato di vendita semplice"
    mandate_simple_text_1: "Questo tipo di mandato vi permette di affidare la vendita del vostro immobile a più agenzie immobiliari (più giuridicamente chiamate mandatari). Vi lascia inoltre la possibilità di vendere il vostro immobile da soli. Il mandatario che sarà riuscito a mettervi in contatto con un acquirente e a condurre le negoziazioni sarà l'unico a essere remunerato per il suo servizio."
    mandate_simple_text_2: "Questo tipo di mandato vi lascia una grande libertà d'azione, ma presenta tuttavia degli aspetti negativi. La forte concorrenza tra i prestatori riduce di conseguenza la loro possibilità di essere remunerati. Ciò tende spesso a limitare il coinvolgimento dei nostri concorrenti. Inoltre, è frequente vedere lo stesso immobile pubblicizzato con informazioni differenti come il prezzo di vendita, la superficie… il che rappresenta un serio handicap nelle negoziazioni con i potenziali acquirenti."
    mandate_simple_text_3: "È dunque un mandato interessante per voi se desiderate mantenere il controllo sulla vendita del vostro immobile, ma che può tuttavia rivelarsi particolarmente controproducente."
    mandate_exclusive_title: "Il mandato esclusivo"
    mandate_exclusive_text_1: "Il mandato di vendita esclusivo affida la vendita del bene a una sola agenzia immobiliare. La comunicazione fatta sull'immobile è qui molto più coerente. Inoltre, l'agenzia immobiliare, sapendosi l'unica in gara per vendere il bene, vi impiegherà tutte le risorse finanziarie e umane necessarie al fine di massimizzare la vendita nei migliori tempi e condizioni."
    mandate_exclusive_text_2: "Le strategie relative alla vendita del bene saranno decise da un'unica e medesima squadra, il che permetterà agli acquirenti di vedere un'offerta coerente. Il senso di affidabilità è determinante nella fase successiva delle negoziazioni. Infatti, la fiducia tra le parti durante le negoziazioni è l'ingrediente principale di una vendita riuscita."
    mandate_exclusive_text_3: "Essendo questo mandato esclusivo, dovrete scegliere il vostro mandatario con diligenza. Infatti, perderete la libertà di vendere il vostro immobile da soli o di mettere in concorrenza più agenzie. Tuttavia, lavorando con la nostra agenzia, beneficerete di un unico interlocutore per centralizzare tutte le richieste di potenziali acquirenti o di altre agenzie e padroneggiare perfettamente il vostro immobile e le informazioni divulgate."
    mandate_coexclusive_title: "Il mandato co-esclusivo"
    mandate_coexclusive_text_1: "Il mandato co-esclusivo può essere la soluzione ibrida nel caso in cui né le condizioni del mandato semplice, né quelle del mandato esclusivo vi soddisfino. Questo mandato si basa sugli stessi principi che regolano il mandato esclusivo che abbiamo appena presentato. Tuttavia, vi permette di affidare la vendita del vostro immobile a due agenzie immobiliari."
    mandate_coexclusive_text_2: "Presenta esattamente gli stessi vantaggi, ovvero una maggiore messa a disposizione di risorse finanziarie e umane da parte delle agenzie e una strategia di comunicazione meglio armonizzata rispetto al mandato semplice."
    mandate_choice: "Quando si tratta di scegliere tra questi diversi tipi di mandati, in particolare se siete indecisi tra un mandato esclusivo o co-esclusivo, è preferibile prendere contatto con l'agenzia che preferite. In questo modo, essa potrà orientarvi verso un mandatario con il quale sia possibile realizzare un lavoro congiunto affinché si crei una sinergia. Moltiplicate così le forze per arrivare a risultati migliori."
    selling_title: "Come vendiamo il vostro immobile?"
    selling_text_1: "I nostri team realizzano un'argomentazione di vendita che accompagnerà i contenuti visivi (video HD e foto HD a 360°) su tutte le reti che padroneggiamo (sito internet, social network, rassegne stampa ecc.). Una volta che un acquirente è interessato, gli facciamo visitare il bene in compagnia di uno dei nostri negoziatori."
    selling_text_2: "A seguito di questo processo, se il cliente è interessato al bene, redigiamo una proposta d'acquisto che riprende le sue condizioni, accompagnata da un assegno di un importo pari al 10% della somma proposta, intestato al notaio, per provare la sua buona volontà di acquistare il bene. Da notare che siamo in comunicazione costante con il venditore e l'acquirente per tutta la durata del processo di vendita. Nel caso in cui vi sia accordo sul prezzo e sul bene, fissiamo un appuntamento presso un Notaio del principato per la firma del compromesso di vendita. L'assegno viene incassato a titolo di acconto da imputare al prezzo di vendita del bene."
    selling_text_3: "Come abbiamo sottolineato nella nostra guida all'acquisto per stabilirsi a Monaco, la firma di un compromesso di vendita non è obbligatoria, ma può essere necessaria, in particolare nell'ambito del diritto di prelazione dello Stato monegasco. Questo diritto si applica a tutti gli immobili costruiti prima del 1947."
    selling_text_4: "Infine, dopo che tutte le condizioni sospensive sono state soddisfatte nei termini stabiliti, sarà allora il momento di ritrovarci nuovamente dal Notaio per la firma dell'atto autentico, data alla quale l'acquirente dovrà versare nella sua integralità l'importo corrispondente al prezzo di detto bene, dedotto l'acconto, nonché le spese notarili pari al 6% e la commissione di agenzia pari al 3% al netto delle imposte sul prezzo del bene, secondo il tariffario della camera immobiliare monegasca. Nel caso in cui una delle condizioni sospensive non sia soddisfatta, l'assegno di acconto sarà rimborsato all'acquirente e la vendita sarà considerata annullata."
    funds_title: "Il versamento dei fondi"
    funds_text_1: "Una volta firmati i documenti davanti al notaio, i fondi vi saranno versati dallo studio notarile entro 15 giorni, dedotti gli onorari di agenzia a carico del venditore, fissati secondo il tariffario della camera immobiliare monegasca al 5% al netto delle imposte sul prezzo di vendita."
    funds_text_2: "Speriamo che ora conosciate meglio il nostro processo di vendita di un immobile a Monaco. Per qualsiasi informazione sull'acquisto, la vendita, la locazione, la gestione e la stima dei vostri immobili a Monaco, il nostro team vi attende con piacere ed è a vostra disposizione."
    cta_title: "Un progetto di vendita?"
    cta_text: "Desiderate affidarci la vendita del vostro immobile? Compilate il modulo qui sotto e uno dei nostri consulenti in transazioni immobiliari vi ricontatterà al più presto."

