  homepage:
    hero_title: "Immobiliare a Monaco dal 1942"
    hero_subtitle: "Membro della Chambre Immobilière Monégasque"
    about_title: "Agence Immobilière de la Gare"
    about_history: "Fondata nel 1942, l'Agence Immobilière de la Gare è un'impresa familiare indipendente, membro della Chambre Immobilière Monégasque. Situata nel cuore del vivace quartiere della Condamine, ai piedi della maestosa Rocca dove sorge il Palazzo dei Principi, la nostra agenzia è diretta da Pierre Maré e suo figlio Adrien Maré. Forti di una ricca esperienza e di un approccio dinamico, abbiamo saputo costruire rapporti di fiducia con i nostri clienti, di generazione in generazione."
    about_services: "Proponiamo servizi completi di vendita, locazione e gestione immobiliare a Monaco. Offriamo una gestione personalizzata dei vostri beni, con manutenzione accurata e monitoraggio rigoroso, per garantire un rendimento locativo ottimale. Ci occupiamo di tutte le pratiche amministrative: redazione di contratti, registrazione fiscale, inventari di ingresso e uscita e sottoscrizione di contratti di elettricità, acqua e assicurazione."
    about_expertise: "La nostra competenza ci permette di collaborare con notai e avvocati monegaschi per la stima e la valutazione di beni immobiliari. In collaborazione con lo studio Tania Architettura d'interni, proponiamo progetti di ristrutturazione di appartamenti. Il nostro ambito di intervento si estende al Principato di Monaco e alla regione francese limitrofa. Contattateci al (+377) 93 30 22 36 o a info@agencegaremonaco.com."
    team_title: "Il Nostro Team"
    team:
      email_member: "Invia un'email a %{name}"
      pierre_role: "Co-Direttore"
      adrien_role: "Direttore / Negoziatore"
      josiane_role: "Segretariato / Gestione"
      pierre_bio: "Pierre Maré è co-direttore dell'Agence Immobilière de la Gare a Monaco. Con diversi decenni di esperienza nel settore immobiliare monegasco, dirige l'agenzia familiare fondata nel 1942. La sua profonda conoscenza del mercato immobiliare del Principato e i rapporti consolidati con notai e avvocati locali lo rendono un consulente di fiducia per le transazioni immobiliari a Monaco."
      adrien_bio: "Adrien Maré è direttore e negoziatore dell'Agence Immobilière de la Gare. Rappresentante della nuova generazione di questa impresa familiare fondata nel 1942, porta un approccio dinamico e moderno all'immobiliare monegasco. Specializzato nella vendita e nella negoziazione, Adrien accompagna i suoi clienti in ogni fase dei loro progetti immobiliari a Monaco."
      josiane_bio: "Josiane Alesi è responsabile del segretariato e della gestione locativa presso l'Agence Immobilière de la Gare. Con una conoscenza approfondita delle procedure amministrative monegasche, gestisce quotidianamente gli immobili in affitto, la redazione dei contratti, gli inventari e i rapporti con gli inquilini."
    featured_articles_title: "Articoli"
    articles_view_all: "Vedi tutti gli articoli"
    read_more: "Leggi di più"
    contact_title: "Contattateci"
    carousel_title: "Monaco"
