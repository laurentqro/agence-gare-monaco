    about_title: "Chi siamo"
    about_text: "Situata nel cuore del vivace quartiere della Condamine, ai piedi della maestosa Rocca dove sorge il Palazzo dei Principi, la nostra agenzia immobiliare, diretta da Pierre Maré e suo figlio Adrien Maré, è un'impresa familiare indipendente. Forti di una ricca esperienza e di un approccio dinamico, abbiamo saputo costruire rapporti di fiducia con i nostri clienti, di generazione in generazione.\n\nOffriamo una gestione personalizzata dei vostri beni immobiliari, assicurando una manutenzione accurata e un monitoraggio rigoroso, per garantire un rendimento locativo ottimale e una valorizzazione continua del vostro patrimonio nel tempo.\n\nChe siate alla ricerca di un immobile da acquistare o da affittare, per un progetto personale o professionale, il nostro team è a vostra disposizione per accompagnarvi in ogni fase del vostro percorso.\n\nCi occupiamo di tutte le pratiche amministrative indispensabili per il vostro insediamento o quello dei vostri inquilini: redazione di contratti di locazione, registrazione presso i servizi fiscali, inventari di ingresso e di uscita, sottoscrizione di contratti di elettricità, acqua e assicurazione.\n\nLa nostra competenza ci permette inoltre di collaborare con notai e avvocati monegaschi per la stima e la valutazione di beni immobiliari. Inoltre, in collaborazione con il rinomato studio Tania Architettura d'interni, proponiamo progetti di ristrutturazione e riorganizzazione di appartamenti.\n\nIl nostro ambito di intervento si estende al Principato di Monaco e alla regione francese limitrofa, grazie alla nostra collaborazione con un corrispondente locale."
