  gestion:
    title: "Gestione locativa a Monaco"
    intro: "Quando si è proprietari di un immobile, può essere difficile gestirlo considerando i diversi impegni personali o professionali e lo stress che questo può generare quotidianamente. L'Agence de la Gare mette a vostra disposizione un servizio di gestione immobiliare per tutti i vostri beni, al fine di facilitare il dialogo con i vostri inquilini. In qualità di esperti immobiliari, mettiamo al vostro servizio un team di professionisti che assicurerà la gestione dell'intero vostro patrimonio immobiliare in affitto."
    missions_title: "Quali sono le missioni della nostra agenzia?"
    missions_text: "L'Agence de la Gare svolge una moltitudine di missioni che vanno dalla pubblicazione dell'annuncio di locazione all'apertura dei contatori di acqua ed elettricità, passando per la firma del contratto di locazione."
    publication_title: "Come pubblichiamo il vostro immobile e selezioniamo i candidati?"
    publication_text_1: "Pubblichiamo il vostro immobile su tutti i nostri canali di comunicazione, con l'obiettivo di metterlo in affitto il prima possibile. Segue poi la scelta dell'inquilino."
    publication_text_2: "Il nostro ruolo è valutare le capacità finanziarie dei candidati. Per farlo, chiediamo loro di fornire:"
    publication_item_1: "le ultime buste paga"
    publication_item_2: "il contratto di lavoro"
    publication_item_3: "attestazione bancaria"
    publication_text_3: "Un'indagine presso i precedenti locatori dichiarati dagli interessati può essere effettuata con l'obiettivo di rispondere a queste due domande essenziali:"
    publication_question_1: "È un buon pagatore?"
    publication_question_2: "È di buona moralità?"
    publication_text_4: "La nostra selezione, particolarmente esigente, non lascia mai spazio al dubbio. Il mercato degli affitti ha il vantaggio di una forte domanda, il che ci permette di essere particolarmente selettivi. Nessun inquilino si installa in un appartamento che gestiamo senza forti garanzie di solvibilità."
    contract_title: "Come redigiamo il contratto di locazione e installiamo l'inquilino?"
    contract_text_1: "L'agenzia si occupa di redigere il contratto di locazione per voi. Lo stesso vale per la realizzazione dello stato dei luoghi di ingresso e di uscita dell'inquilino. Possiamo anche, su vostra richiesta, far realizzare gli stati dei luoghi da un ufficiale giudiziario."
    contract_text_2: "In qualità di gestore dei vostri beni, ci occupiamo di tutte le pratiche amministrative, inclusa la registrazione del vostro immobile o qualsiasi altro obbligo legale. Ad esempio, la nostra agenzia immobiliare può essere l'interlocutore privilegiato dei Servizi Fiscali."
    contract_text_3: "In contatto permanente con l'inquilino, i nostri team si occupano dell'apertura dei contatori di acqua ed elettricità. Ci assicuriamo inoltre che l'inquilino abbia effettuato i controlli obbligatori, come il controllo della caldaia, ad esempio."
    contract_text_4: "Verifichiamo che l'appartamento sia assicurato, non solo da voi in qualità di proprietario, ma anche dall'inquilino. La nostra agenzia può occuparsi della sottoscrizione di queste assicurazioni, se necessario."
    life_title: "Come seguiamo tutta la vita del vostro immobile?"
    life_text_1: "Oltre all'espletamento di tutte le formalità relative al possesso di un immobile in affitto a Monaco, partecipiamo più in generale a tutte le attività che riguardano la vita dell'edificio."
    life_text_2: "Uno dei membri del nostro team sarà presente a tutte le assemblee generali del condominio, una nota di sintesi sarà allegata al vostro fascicolo in modo che possiate avere, in qualsiasi momento, una visione d'insieme della situazione del vostro immobile. Allo stesso modo, seguirà gli eventuali lavori di manutenzione e di rimessa in stato che saranno effettuati nel vostro appartamento o nell'edificio."
    life_text_3: "Sarà inoltre lui a gestire qualsiasi sinistro. Si occuperà di informare le assicurazioni e contatterà le società competenti per rimettere in stato il vostro immobile il più rapidamente possibile."
    funds_title: "Come gestiamo i vostri fondi?"
    funds_text_1: "L'Agence de la Gare, in qualità di gestore, si occupa dell'incasso degli affitti. Ci assicuriamo che i fondi siano versati dall'inquilino, senza mancanze né ritardi di pagamento. Che si tratti di richieste di fondi, dell'invio delle quietanze di affitto o della giusta regolarizzazione delle spese, il gestore segue l'insieme dei movimenti finanziari relativi al vostro immobile."
    funds_text_2: "L'Agence de la Gare assicura da diversi decenni la gestione di diversi patrimoni immobiliari a Monaco. Abbiamo un team esperto e tutte le competenze necessarie per gestire con cura e efficacia i vostri beni immobiliari."
    cta_title: "Desiderate usufruire del nostro servizio di gestione immobiliare?"
    cta_text: "Contattateci per parlare con il nostro dipartimento specializzato nella gestione locativa e scoprire di più sui nostri servizi."

  vendre:
    title: "Come vendere il vostro immobile a Monaco?"
    intro: "Il nostro team di esperti vi accompagna in ogni fase della vendita del vostro immobile a Monaco. Dalla stima alla firma dell'atto notarile, mettiamo la nostra competenza al vostro servizio per garantire una transazione di successo."
    estimate_title: "Quanto vale il vostro immobile a Monaco?"
    estimate_text: "Una buona stima è la chiave per una vendita di successo. I nostri esperti analizzano il mercato immobiliare monegasco, confrontano gli immobili simili venduti di recente e tengono conto delle caratteristiche uniche della vostra proprietà per proporvi una stima giusta e realistica. Questo passaggio è essenziale per attrarre acquirenti seri e vendere nelle migliori condizioni."
    admin_title: "Quali documenti sono necessari per vendere a Monaco?"
    admin_text: "Ci occupiamo di tutto per semplificarvi la vita. Il nostro team si occupa di raccogliere tutti i documenti necessari per la messa in vendita del vostro immobile."
    admin_docs_intro: "Raccogliamo da voi i seguenti documenti:"
    admin_doc_1: "Titolo di proprietà"
    admin_doc_2: "Ultimi verbali di assemblea generale"
    admin_doc_3: "Diagnostiche tecniche obbligatorie"
    admin_doc_4: "Rendiconto delle spese condominiali"
    admin_doc_5: "Imposta sulla proprietà"
    admin_doc_6: "Planimetrie dell'immobile"
    admin_doc_7: "Attestazione di superficie (legge Carrez)"
    admin_doc_8: "Ultime ricevute delle spese"
    admin_mandate_intro: "Una volta completato il vostro fascicolo, possiamo stabilire il mandato di vendita che formalizzerà la nostra collaborazione."
    mandate_title: "Tutto quello che c'è da sapere sul mandato di vendita"
    mandate_intro: "Il mandato di vendita può assumere tre forme diverse. Ciascuna offre vantaggi specifici a seconda della vostra situazione e dei vostri obiettivi."
    mandate_simple_title: "Il mandato semplice"
    mandate_simple_text_1: "Il mandato semplice vi permette di affidare la vendita del vostro immobile a più agenzie contemporaneamente. Conservate anche la possibilità di vendere da soli."
    mandate_simple_text_2: "Questa formula offre grande flessibilità ma può comportare un minor coinvolgimento da parte di ciascuna agenzia, poiché l'immobile viene proposto da più intermediari."
    mandate_simple_text_3: "Il mandato semplice è adatto se desiderate massimizzare la visibilità del vostro immobile presso diverse reti di potenziali acquirenti."
    mandate_exclusive_title: "Il mandato esclusivo"
    mandate_exclusive_text_1: "Il mandato esclusivo affida la vendita del vostro immobile a una sola agenzia per un periodo determinato. Questa esclusività ci permette di impiegare tutti i nostri mezzi per vendere il vostro immobile nelle migliori condizioni."
    mandate_exclusive_text_2: "Con un mandato esclusivo, investiamo maggiormente nella promozione del vostro immobile: fotografie professionali, visite virtuali, diffusione mirata presso la nostra rete di acquirenti qualificati."
    mandate_exclusive_text_3: "Questa formula è consigliata per gli immobili di prestigio o quando si desidera discrezione."
    mandate_coexclusive_title: "Il mandato co-esclusivo"
    mandate_coexclusive_text_1: "Il mandato co-esclusivo è un compromesso tra il mandato semplice e quello esclusivo. Affidate la vendita a un numero limitato di agenzie (generalmente due o tre) che lavorano insieme."
    mandate_coexclusive_text_2: "Questa formula permette di beneficiare di una buona copertura del mercato mantenendo un alto livello di impegno da parte delle agenzie mandatarie."
    mandate_choice: "Quando si tratta di scegliere il tipo di mandato, il nostro team vi consiglia in base alla natura del vostro immobile, al mercato attuale e alle vostre priorità. Vi accompagniamo per prendere la decisione migliore."
    selling_title: "Come vendiamo il vostro immobile?"
    selling_text_1: "Una volta firmato il mandato, mettiamo in atto la nostra strategia di commercializzazione. Il vostro immobile viene diffuso su tutti i nostri canali: sito internet, portali immobiliari, social media e la nostra rete di acquirenti qualificati."
    selling_text_2: "Quando un potenziale acquirente si manifesta, organizziamo le visite e negoziamo per vostro conto per ottenere il miglior prezzo. Ogni offerta vi viene presentata con la nostra analisi e le nostre raccomandazioni."
    selling_text_3: "Una volta accettata l'offerta, accompagniamo entrambe le parti fino alla firma del compromesso di vendita davanti al notaio. Questo documento impegna acquirente e venditore e fissa le condizioni della transazione."
    selling_text_4: "La firma dell'atto notarile presso il notaio finalizza la vendita. Restiamo al vostro fianco fino a quest'ultimo passaggio per garantire che tutto si svolga perfettamente."
    funds_title: "Quando e come vengono versati i fondi?"
    funds_text_1: "Dopo la firma dell'atto notarile, il notaio procede al versamento dei fondi. Il prezzo di vendita, al netto delle spese ed eventuali rimborsi di prestiti, vi viene versato nei giorni successivi alla firma."
    funds_text_2: "Il nostro team resta disponibile dopo la vendita per rispondere a tutte le vostre domande e accompagnarvi nei vostri progetti futuri."
    cta_title: "Un progetto di vendita?"
    cta_text: "Desiderate affidarci la vendita del vostro immobile? Compilate il modulo qui sotto e uno dei nostri consulenti in transazioni immobiliari vi ricontatterà al più presto."

