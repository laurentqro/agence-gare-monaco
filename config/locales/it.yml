    intro_html: "Conformemente alla <a href=\"https://legimonaco.mc/tnc/loi/2024/12-03-1.565\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"underline\">Loi n° 1.565 du 3 décembre 2024</a> relative à la protection des données personnelles en Principauté de Monaco, Agence de la Gare vi informa sulle modalità di raccolta, trattamento e utilizzo dei vostri dati personali, nonché sui vostri diritti."
    update_notice: "La presente politica può essere modificata al fine di garantire la conformità a qualsiasi evoluzione legislativa o regolamentare. Vi invitiamo a consultarla regolarmente."
    controller_title: "Titolare del trattamento"
    controller_text: "Il titolare del trattamento dei vostri dati personali è:"
    controller_name: "Agence de la Gare"
    controller_address: "3, rue Langlé, Le Logis, MC 98000 Monaco"
    controller_email: "info@agencegaremonaco.com"
    controller_phone: "(+377) 93 30 22 36"
    contact_form_title: "Trattamento: Modulo di contatto"
    contact_form_purpose: "Questo trattamento ha la finalità di rispondere alle richieste di informazioni inviate dai visitatori del sito tramite il modulo di contatto."
    contact_form_basis: "Questo trattamento è fondato sul consenso della persona interessata (articolo 5 della Loi n° 1.565 du 3 décembre 2024)."
    contact_form_data: "Dati raccolti: nome, indirizzo email, numero di telefono (facoltativo), paese, oggetto e contenuto del messaggio."
    contact_form_retention: "I dati sono conservati per 3 anni a decorrere dall'ultimo contatto."
    contact_form_recipients: "I dati sono accessibili unicamente ai collaboratori dell'Agence de la Gare autorizzati a trattare le richieste."
    property_inquiry_title: "Trattamento: Richiesta di informazioni su un immobile"
    property_inquiry_purpose: "Questo trattamento ha la finalità di rispondere alle richieste di informazioni relative a un immobile specifico, trasmesse tramite il modulo di richiesta o via email."
    property_inquiry_basis: "Questo trattamento è fondato sul consenso della persona interessata."
    property_inquiry_data: "Dati raccolti: nome, indirizzo email, numero di telefono (facoltativo), riferimento dell'immobile interessato e contenuto del messaggio."
    property_inquiry_retention: "I dati sono conservati per 3 anni a decorrere dall'ultimo contatto."
    property_inquiry_recipients: "I dati sono accessibili unicamente ai collaboratori dell'Agence de la Gare."
    analytics_title: "Trattamento: Misurazione dell'audience"
    analytics_purpose: "Questo trattamento ha la finalità di realizzare statistiche anonime di frequentazione del sito (numero di visite, pagine consultate, provenienza geografica)."
    analytics_basis: "Questo trattamento è fondato sull'interesse legittimo del titolare del trattamento (miglioramento del sito)."
    analytics_tool: "Lo strumento utilizzato è Plausible Analytics, ospitato nell'Unione europea. Plausible non deposita alcun cookie, non raccoglie alcun dato personale e anonimizza gli indirizzi IP. Non è richiesto alcun consenso."
    analytics_no_transfer: "Nessun dato viene trasferito al di fuori dell'Unione europea."
    cookies_title: "Cookie"
    cookies_text: "Il sito utilizza unicamente cookie tecnici strettamente necessari al suo funzionamento (gestione della sessione, preferenza di lingua). Questi cookie non raccolgono alcun dato personale. Non viene utilizzato alcun cookie pubblicitario o di tracciamento."
    cookies_plausible: "Lo strumento di misurazione dell'audience (Plausible Analytics) non deposita alcun cookie."
    rights_title: "I vostri diritti"
    rights_intro: "Conformemente alla Loi n° 1.565 du 3 décembre 2024, disponete dei seguenti diritti sui vostri dati personali:"
    right_information: "Diritto all'informazione (articoli 10 e 11): essere informati sull'utilizzo dei vostri dati"
    right_access: "Diritto di accesso (articolo 12): ottenere una copia dei dati che vi riguardano"
    right_rectification: "Diritto di rettifica (articolo 13): correggere dati inesatti o incompleti"
    right_erasure: "Diritto alla cancellazione (articolo 14): richiedere la cancellazione dei vostri dati"
    right_limitation: "Diritto alla limitazione del trattamento (articolo 15): limitare temporaneamente l'utilizzo dei vostri dati"
    right_opposition: "Diritto di opposizione (articolo 17): opporsi al trattamento dei vostri dati"
    right_portability: "Diritto alla portabilità (articolo 18): ricevere i vostri dati in un formato strutturato"
    right_automated: "Diritto di non essere sottoposto a una decisione automatizzata (articolo 19): non essere soggetto a una decisione basata esclusivamente su un trattamento automatizzato"
    rights_exercise: "Per esercitare i vostri diritti, potete contattarci via email a info@agencegaremonaco.com o per posta all'indirizzo dell'agenzia. Ci impegniamo a rispondere alla vostra richiesta entro un mese."
    dpd_title: "Delegato alla protezione dei dati"
    dpd_text: "Il delegato alla protezione dei dati (DPD) dell'Agence de la Gare è:"
    dpd_name: "Adrien Maré"
    dpd_contact: "Per qualsiasi domanda relativa al trattamento dei vostri dati personali, potete contattare il DPD via email a info@agencegaremonaco.com o per posta all'indirizzo dell'agenzia."
    complaint_title: "Diritto di reclamo"
    complaint_text: "Se ritenete che il trattamento dei vostri dati personali costituisca una violazione della Loi n° 1.565 du 3 décembre 2024, avete il diritto di presentare un reclamo presso l'Autorité de Protection des Données Personnelles (APDP):"
    complaint_apdp_address: "APDP — 11, rue du Gabian, Le Concorde 4ème étage, MC 98000 Monaco"
    complaint_apdp_email: "apdp@apdp.mc"
    complaint_apdp_website: "https://apdp.mc"
    security_title: "Sicurezza dei dati"
    security_text: "L'Agence de la Gare adotta le misure tecniche e organizzative appropriate per garantire la sicurezza, la riservatezza e l'integrità dei vostri dati personali, conformemente all'articolo 31 della Loi n° 1.565 du 3 décembre 2024."
    last_updated: "Ultimo aggiornamento: marzo 2026"

  estimate:
    title: "Quanto vale il tuo immobile a Monaco?"
    intro: "Ottieni una stima indicativa basata sul modello di regressione IMSEE (Observatoire de l'Immobilier 2025). Lo strumento considera quartiere, superficie e decennio di costruzione."
    disclaimer: "Questa stima è indicativa. Il modello IMSEE spiega il 51% della variazione dei prezzi osservati; piano, vista e stato generale non sono presi in considerazione. Per una valutazione precisa, contattaci."
