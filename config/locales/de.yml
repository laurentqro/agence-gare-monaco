  gestion:
    title: "Immobilienverwaltung in Monaco"
    intro: "Als Eigentümer einer Immobilie kann es angesichts verschiedener persönlicher oder beruflicher Verpflichtungen und des damit verbundenen alltäglichen Stresses schwierig sein, diese zu verwalten. Die Agence de la Gare stellt Ihnen einen umfassenden Immobilienverwaltungsservice für alle Ihre Objekte zur Verfügung, um den Dialog mit Ihren Mietern zu erleichtern. Als Immobilienexperten stellen wir Ihnen ein Team von Fachleuten zur Seite, das die Verwaltung Ihres gesamten Mietimmobilienbestands übernimmt."
    missions_title: "Welche Aufgaben übernimmt unsere Agentur?"
    missions_text: "Die Agence de la Gare erfüllt eine Vielzahl von Aufgaben, die von der Veröffentlichung der Mietanzeige bis zur Eröffnung der Wasser- und Stromzähler reichen, einschließlich der Unterzeichnung des Mietvertrags."
    publication_title: "Wie veröffentlichen wir Ihre Immobilie und wählen Bewerber aus?"
    publication_text_1: "Wir veröffentlichen Ihre Immobilie auf all unseren Kommunikationskanälen, mit dem Ziel, sie so schnell wie möglich zu vermieten. Dann folgt die Auswahl des Mieters."
    publication_text_2: "Unsere Aufgabe ist es, die finanziellen Fähigkeiten der Bewerber zu bewerten. Dazu bitten wir sie, Folgendes vorzulegen:"
    publication_item_1: "ihre letzten Gehaltsabrechnungen"
    publication_item_2: "ihren Arbeitsvertrag"
    publication_item_3: "Bankbescheinigung"
    publication_text_3: "Eine Nachforschung bei den von den Interessenten angegebenen früheren Vermietern kann ebenfalls durchgeführt werden, um diese beiden wesentlichen Fragen zu beantworten:"
    publication_question_1: "Ist er ein guter Zahler?"
    publication_question_2: "Ist er von guter Moral?"
    publication_text_4: "Unsere besonders strenge Auswahl lässt niemals Raum für Zweifel. Der Mietmarkt hat den Vorteil einer starken Nachfrage, was es uns ermöglicht, besonders selektiv zu sein. Kein Mieter zieht in eine von uns verwaltete Wohnung ein ohne starke Solvenzgarantien."
    contract_title: "Wie erstellen wir den Mietvertrag und richten den Mieter ein?"
    contract_text_1: "Die Agentur übernimmt die Erstellung des Mietvertrags für Sie. Gleiches gilt für die Durchführung der Ein- und Auszugsprotokolle. Auf Ihren Wunsch können wir die Bestandsaufnahmen auch von einem Gerichtsvollzieher durchführen lassen."
    contract_text_2: "Als Verwalter Ihrer Immobilien kümmern wir uns um alle administrativen Verfahren, einschließlich der Registrierung Ihrer Immobilie oder jeder anderen gesetzlichen Verpflichtung. Unsere Immobilienagentur kann beispielsweise der bevorzugte Ansprechpartner der Steuerbehörden sein."
    contract_text_3: "In ständigem Kontakt mit dem Mieter übernehmen unsere Teams die Eröffnung der Wasser- und Stromzähler. Wir stellen auch sicher, dass der Mieter die obligatorischen Kontrollen durchgeführt hat, wie zum Beispiel die Heizungskontrolle."
    contract_text_4: "Wir überprüfen, dass die Wohnung versichert ist, nicht nur von Ihnen als Eigentümer, sondern auch vom Mieter. Unsere Agentur kann den Abschluss dieser Versicherungen bei Bedarf übernehmen."
    life_title: "Wie begleiten wir das gesamte Leben Ihrer Immobilie?"
    life_text_1: "Neben der Erledigung aller Formalitäten im Zusammenhang mit dem Besitz einer Mietimmobilie in Monaco nehmen wir allgemeiner an allen Aktivitäten teil, die das Leben des Gebäudes betreffen."
    life_text_2: "Eines unserer Teammitglieder wird bei allen Eigentümerversammlungen anwesend sein, eine Zusammenfassung wird Ihrer Akte beigefügt, damit Sie jederzeit einen Überblick über die Situation Ihrer Immobilie haben. Ebenso wird er eventuelle Wartungs- und Instandsetzungsarbeiten verfolgen, die in Ihrer Wohnung oder im Gebäude durchgeführt werden."
    life_text_3: "Er wird auch jeden Schadensfall verwalten. Er wird dafür sorgen, dass die Versicherungen informiert werden und wird kompetente Unternehmen kontaktieren, um Ihre Immobilie so schnell wie möglich wiederherzustellen."
    funds_title: "Wie verwalten wir Ihre Gelder?"
    funds_text_1: "Die Agence de la Gare ist als Verwalter für den Einzug der Mieten verantwortlich. Wir stellen sicher, dass die Gelder vom Mieter ohne Ausfälle oder Zahlungsverzögerungen gezahlt werden. Ob es sich um Fondsabrufe, den Versand von Mietquittungen oder die gerechte Regulierung der Nebenkosten handelt, der Verwalter verfolgt alle finanziellen Bewegungen in Bezug auf Ihre Immobilie."
    funds_text_2: "Die Agence de la Gare verwaltet seit mehreren Jahrzehnten mehrere Immobilienbestände in Monaco. Wir verfügen über ein Expertenteam und alle notwendigen Kenntnisse, um Ihre Immobilien effizient und sorgfältig zu verwalten."
    cta_title: "Möchten Sie unseren Immobilienverwaltungsservice nutzen?"
    cta_text: "Kontaktieren Sie uns, um mit unserer spezialisierten Mietverwaltungsabteilung zu sprechen und mehr über unsere Dienstleistungen zu erfahren."

  vendre:
    title: "Wie verkaufen Sie Ihre Immobilie in Monaco?"
    intro: "Unser Expertenteam begleitet Sie bei allen notwendigen Schritten zur Verwirklichung Ihres Verkaufsvorhabens in Monaco."
    estimate_title: "Schätzen Sie den Wert Ihrer Immobilie"
    estimate_text: "Eine gute Bewertung Ihrer Immobilie ermöglicht einen schnellen Verkaufsabschluss, denn der tatsächliche Wert Ihrer Immobilie zieht die richtigen Käufer an. Um den tatsächlichen Wert Ihrer Immobilie einzuschätzen, besichtigt einer der Verhandlungsführer unserer Agentur Ihre Immobilie, um möglichst viele Elemente zu sammeln, die eine Schätzung des fairen Preises ermöglichen. Hier sind die Methoden, auf die wir uns stützen, um Ihre Immobilie zu bewerten."
    admin_title: "Wir kümmern uns um den gesamten administrativen Teil des Verkaufs"
    admin_text: "Wir übernehmen alles, damit Ihre Erfahrung so angenehm wie möglich wird."
    admin_docs_intro: "Wir sammeln bei Ihnen alle für den Verkauf Ihrer Immobilie erforderlichen Dokumente, das heißt:"
    admin_doc_1: "Ihre Eigentumsbescheinigung der zu verkaufenden Immobilie,"
    admin_doc_2: "eine Kopie Ihrer Ausweisdokumente (gültiger Reisepass und Personalausweis und/oder Aufenthaltstitel)"
    admin_doc_3: "eine Kopie eines Wohnsitznachweises"
    admin_doc_4: "die letzten drei Protokolle der Eigentümerversammlung der Wohnungseigentümergemeinschaft,"
    admin_doc_5: "die Teilungserklärung der Wohnungseigentümergemeinschaft,"
    admin_doc_6: "alle Rechtsdokumente bezüglich Ihrer Gesellschaft, falls Sie den Verkauf als juristische Person durchführen,"
    admin_doc_7: "die Mietverwaltungsakte, falls die von Ihnen verkaufte Immobilie Gegenstand eines Mietvertrags ist,"
    admin_doc_8: "die Bauabnahmeakte im Rahmen genehmigungspflichtiger Bauvorhaben."
    admin_mandate_intro: "Sobald Ihre Unterlagen vollständig sind, schlägt Ihnen unser Team den Abschluss eines Verkaufsmandats vor. Es handelt sich um einen Vertrag, der den Verkaufspreis, unsere Vergütung, die Laufzeit sowie die Bedingungen angibt. Es handelt sich um einen zweiseitigen Vertrag, der uns gegenseitig verpflichtet."
    mandate_title: "Alles Wissenswerte über das Verkaufsmandat"
    mandate_intro: "Das Verkaufsmandat kann drei Formen annehmen. Es kann ein einfaches, ein exklusives oder ein ko-exklusives Mandat sein:"
    mandate_simple_title: "Das einfache Verkaufsmandat"
    mandate_simple_text_1: "Diese Art von Mandat ermöglicht es Ihnen, den Verkauf Ihrer Immobilie mehreren Immobilienagenturen (rechtlich korrekt als Mandatare bezeichnet) anzuvertrauen. Es lässt Ihnen außerdem die Möglichkeit, Ihre Immobilie selbst zu verkaufen. Der Mandatar, dem es gelungen ist, Sie mit einem Käufer in Kontakt zu bringen und die Verhandlungen zu führen, ist der Einzige, der für seine Leistung vergütet wird."
    mandate_simple_text_2: "Diese Art von Mandat lässt Ihnen große Handlungsfreiheit, hat jedoch auch negative Aspekte. Der große Wettbewerb zwischen den Dienstleistern verringert entsprechend ihre Chance, vergütet zu werden. Dies führt häufig dazu, dass das Engagement unserer Mitbewerber begrenzt wird. Zudem kommt es häufig vor, dass dieselbe Immobilie mit unterschiedlichen Informationen wie Verkaufspreis, Fläche … inseriert wird, was bei Verhandlungen mit potenziellen Käufern ein ernstes Hindernis darstellt."
    mandate_simple_text_3: "Es ist also ein interessantes Mandat für Sie, wenn Sie die Kontrolle über den Verkauf Ihrer Immobilie behalten möchten, das jedoch auch besonders kontraproduktiv sein kann."
    mandate_exclusive_title: "Das Exklusivmandat"
    mandate_exclusive_text_1: "Das exklusive Verkaufsmandat überträgt den Verkauf der Immobilie einer einzigen Immobilienagentur. Die Kommunikation über die Immobilie ist hier deutlich kohärenter. Zudem wird die Immobilienagentur, die weiß, dass sie als Einzige um den Verkauf der Immobilie bemüht ist, alle notwendigen finanziellen und personellen Ressourcen einsetzen, um den Verkauf in der besten Zeit und unter den besten Bedingungen zu maximieren."
    mandate_exclusive_text_2: "Die Strategien für den Verkauf der Immobilie werden von ein und demselben Team festgelegt, was es den Käufern ermöglicht, ein kohärentes Angebot zu sehen. Das Gefühl der Verlässlichkeit ist in der späteren Verhandlungsphase entscheidend. Tatsächlich ist das Vertrauen zwischen den Parteien während der Verhandlungen die Hauptzutat eines erfolgreichen Verkaufs."
    mandate_exclusive_text_3: "Da dieses Mandat exklusiv ist, müssen Sie Ihren Mandatar sorgfältig auswählen. Sie verlieren nämlich die Freiheit, Ihre Immobilie selbst zu verkaufen oder mehrere Agenturen in Wettbewerb zu setzen. Bei der Zusammenarbeit mit unserer Agentur profitieren Sie jedoch von einem einzigen Ansprechpartner, der alle Anfragen potenzieller Käufer oder anderer Agenturen zentralisiert und Ihre Immobilie sowie die preisgegebenen Informationen perfekt beherrscht."
    mandate_coexclusive_title: "Das Ko-Exklusivmandat"
    mandate_coexclusive_text_1: "Das Ko-Exklusivmandat kann die hybride Lösung sein für den Fall, dass Sie weder die Bedingungen des einfachen noch die des exklusiven Mandats zufriedenstellen. Dieses Mandat beruht auf denselben Grundsätzen wie das soeben vorgestellte Exklusivmandat. Es ermöglicht Ihnen jedoch, den Verkauf Ihrer Immobilie zwei Immobilienagenturen anzuvertrauen."
    mandate_coexclusive_text_2: "Es bietet genau dieselben Vorteile, nämlich eine größere Bereitstellung finanzieller und personeller Ressourcen seitens der Agenturen und eine besser abgestimmte Kommunikationsstrategie als beim einfachen Mandat."
    mandate_choice: "Wenn es darum geht, zwischen diesen verschiedenen Mandatstypen zu wählen, insbesondere wenn Sie zwischen einem exklusiven oder einem ko-exklusiven Mandat schwanken, ist es ratsam, Kontakt mit der von Ihnen bevorzugten Agentur aufzunehmen. So kann sie Sie an einen Mandatar verweisen, mit dem eine gemeinsame Arbeit erfolgen kann, damit eine Synergie entsteht. Sie bündeln so die Kräfte, um bessere Ergebnisse zu erzielen."
    selling_title: "Wie verkaufen wir Ihre Immobilie?"
    selling_text_1: "Unsere Teams erstellen ein Verkaufsargumentarium, das die visuellen Inhalte (HD-Videos und HD-Fotos in 360°) auf allen von uns beherrschten Kanälen (Website, soziale Netzwerke, Pressespiegel usw.) begleitet. Sobald ein Käufer interessiert ist, lassen wir ihn die Immobilie in Begleitung eines unserer Verhandlungsführer besichtigen."
    selling_text_2: "Im Anschluss an diesen Prozess verfassen wir, falls der Kunde an der Immobilie interessiert ist, ein Kaufangebot, das seine Bedingungen aufgreift, begleitet von einem Scheck in Höhe von 10% der angebotenen Summe, ausgestellt auf den Notar, um seinen ernsthaften Willen zum Erwerb der Immobilie zu belegen. Zu beachten ist, dass wir während der gesamten Dauer des Verkaufsprozesses in ständigem Kontakt mit dem Verkäufer und dem Käufer stehen. Falls Einigkeit über Preis und Sache besteht, vereinbaren wir einen Termin bei einem Notar des Fürstentums zur Unterzeichnung des Vorvertrags. Der Scheck wird als Anzahlung eingelöst, die auf den Verkaufspreis der Immobilie angerechnet wird."
    selling_text_3: "Wie wir in unserem Kaufratgeber für die Niederlassung in Monaco betont haben, ist die Unterzeichnung eines Vorvertrags nicht zwingend erforderlich, kann aber notwendig sein, insbesondere im Rahmen des Vorkaufsrechts des monegassischen Staates. Dieses Recht gilt für alle vor 1947 errichteten Gebäude."
    selling_text_4: "Schließlich, nachdem alle aufschiebenden Bedingungen innerhalb der festgelegten Fristen erfüllt sind, ist es an der Zeit, uns erneut beim Notar zur Unterzeichnung der notariellen Urkunde zu treffen. An diesem Tag muss der Erwerber den dem Preis der besagten Immobilie entsprechenden Betrag vollständig begleichen, abzüglich der Anzahlung, sowie die Notargebühren in Höhe von 6% und die Agenturprovision in Höhe von 3% zuzüglich Steuern auf den Preis der Immobilie gemäß dem Gebührensatz der monegassischen Immobilienkammer. Falls eine der aufschiebenden Bedingungen nicht erfüllt wird, wird der Anzahlungsscheck dem Erwerber zurückerstattet und der Verkauf gilt als annulliert."
    funds_title: "Die Auszahlung der Gelder"
    funds_text_1: "Sobald die Dokumente vor dem Notar unterzeichnet sind, werden Ihnen die Gelder vom Notariat innerhalb von 15 Tagen ausgezahlt, abzüglich der Verkäuferhonorare der Agentur, die gemäß dem Gebührensatz der monegassischen Immobilienkammer auf 5% zuzüglich Steuern auf den Verkaufspreis festgelegt sind."
    funds_text_2: "Wir hoffen, dass Sie nun mehr über unseren Prozess für den Verkauf einer Immobilie in Monaco wissen. Für alle Informationen über Kauf, Verkauf, Vermietung, Verwaltung und Bewertung Ihrer Immobilien in Monaco erwartet Sie unser Team mit Freude und steht Ihnen zur Verfügung."
    cta_title: "Ein Verkaufsprojekt?"
    cta_text: "Möchten Sie uns mit dem Verkauf Ihrer Immobilie beauftragen? Füllen Sie das untenstehende Formular aus und einer unserer Immobilienberater wird sich schnellstmöglich bei Ihnen melden."

