  homepage:
    hero_title: "Immobilien in Monaco seit 1942"
    hero_subtitle: "Mitglied der Chambre Immobilière Monégasque"
    about_title: "Agence Immobilière de la Gare"
    about_history: "Die Agence Immobilière de la Gare wurde 1942 gegründet und ist ein unabhängiges Familienunternehmen sowie Mitglied der Chambre Immobilière Monégasque. Im Herzen des lebhaften Viertels La Condamine gelegen, am Fuße des majestätischen Felsens, auf dem der Fürstenpalast thront, wird unsere Agentur von Pierre Maré und seinem Sohn Adrien Maré geleitet. Mit umfangreicher Erfahrung und einem dynamischen Ansatz haben wir vertrauensvolle Beziehungen zu unseren Kunden aufgebaut, von Generation zu Generation."
    about_services: "Wir bieten umfassende Immobiliendienstleistungen in Monaco: Verkauf, Vermietung und Verwaltung. Wir bieten eine personalisierte Verwaltung Ihrer Immobilien, mit sorgfältiger Instandhaltung und strenger Überwachung, für eine optimale Mietrendite. Wir übernehmen alle administrativen Formalitäten: Erstellung von Mietverträgen, Steuerregistrierung, Ein- und Auszugsprotokolle sowie Strom-, Wasser- und Versicherungsverträge."
    about_expertise: "Unsere Expertise ermöglicht die Zusammenarbeit mit monegassischen Notaren und Anwälten bei der Schätzung und Bewertung von Immobilien. In Zusammenarbeit mit dem Büro Tania Innenarchitektur bieten wir Projekte zur Umgestaltung von Wohnungen an. Unser Tätigkeitsbereich erstreckt sich auf das Fürstentum Monaco und die angrenzende französische Region. Kontaktieren Sie uns unter (+377) 93 30 22 36 oder info@agencegaremonaco.com."
    team_title: "Unser Team"
    team:
      email_member: "%{name} eine E-Mail senden"
      pierre_role: "Co-Geschäftsführer"
      adrien_role: "Direktor / Verhandlungsführer"
      josiane_role: "Sekretariat / Verwaltung"
      pierre_bio: "Pierre Maré ist Mitgeschäftsführer der Agence Immobilière de la Gare in Monaco. Mit mehreren Jahrzehnten Erfahrung in der monegassischen Immobilienbranche leitet er die 1942 gegründete Familienagentur. Seine tiefe Kenntnis des Immobilienmarktes des Fürstentums und seine langjährigen Beziehungen zu lokalen Notaren und Anwälten machen ihn zu einem vertrauenswürdigen Berater für Immobilientransaktionen in Monaco."
      adrien_bio: "Adrien Maré ist Direktor und Verhandlungsführer der Agence Immobilière de la Gare. Als Vertreter der neuen Generation dieses 1942 gegründeten Familienunternehmens bringt er einen dynamischen und modernen Ansatz in die monegassische Immobilienbranche. Spezialisiert auf Verkauf und Verhandlung, begleitet Adrien seine Kunden durch alle Phasen ihrer Immobilienprojekte in Monaco."
      josiane_bio: "Josiane Alesi ist Leiterin des Sekretariats und der Mietverwaltung bei der Agence Immobilière de la Gare. Mit umfassender Kenntnis der monegassischen Verwaltungsverfahren kümmert sie sich um die tägliche Verwaltung der Mietobjekte, Mietvertragsgestaltung, Bestandsaufnahmen und Mieterbeziehungen."
    featured_articles_title: "Artikel"
    articles_view_all: "Alle Artikel ansehen"
    read_more: "Weiterlesen"
    contact_title: "Kontaktieren Sie uns"
    carousel_title: "Monaco"
