  gestion:
    title: "Immobilienverwaltung in Monaco"
    intro: "Als Eigentümer einer Immobilie kann es angesichts verschiedener persönlicher oder beruflicher Verpflichtungen und des damit verbundenen alltäglichen Stresses schwierig sein, diese zu verwalten. Die Agence de la Gare stellt Ihnen einen umfassenden Immobilienverwaltungsservice für alle Ihre Objekte zur Verfügung, um den Dialog mit Ihren Mietern zu erleichtern. Als Immobilienexperten stellen wir Ihnen ein Team von Fachleuten zur Seite, das die Verwaltung Ihres gesamten Mietimmobilienbestands übernimmt."
    missions_title: "Welche Aufgaben übernimmt unsere Agentur?"
    missions_text: "Die Agence de la Gare erfüllt eine Vielzahl von Aufgaben, die von der Veröffentlichung der Mietanzeige bis zur Eröffnung der Wasser- und Stromzähler reichen, einschließlich der Unterzeichnung des Mietvertrags."
    publication_title: "Wie veröffentlichen wir Ihre Immobilie und wählen Bewerber aus?"
    publication_text_1: "Wir veröffentlichen Ihre Immobilie auf all unseren Kommunikationskanälen, mit dem Ziel, sie so schnell wie möglich zu vermieten. Dann folgt die Auswahl des Mieters."
    publication_text_2: "Unsere Aufgabe ist es, die finanziellen Fähigkeiten der Bewerber zu bewerten. Dazu bitten wir sie, Folgendes vorzulegen:"
    publication_item_1: "ihre letzten Gehaltsabrechnungen"
    publication_item_2: "ihren Arbeitsvertrag"
    publication_item_3: "Bankbescheinigung"
    publication_text_3: "Eine Nachforschung bei den von den Interessenten angegebenen früheren Vermietern kann ebenfalls durchgeführt werden, um diese beiden wesentlichen Fragen zu beantworten:"
    publication_question_1: "Ist er ein guter Zahler?"
    publication_question_2: "Ist er von guter Moral?"
    publication_text_4: "Unsere besonders strenge Auswahl lässt niemals Raum für Zweifel. Der Mietmarkt hat den Vorteil einer starken Nachfrage, was es uns ermöglicht, besonders selektiv zu sein. Kein Mieter zieht in eine von uns verwaltete Wohnung ein ohne starke Solvenzgarantien."
    contract_title: "Wie erstellen wir den Mietvertrag und richten den Mieter ein?"
    contract_text_1: "Die Agentur übernimmt die Erstellung des Mietvertrags für Sie. Gleiches gilt für die Durchführung der Ein- und Auszugsprotokolle. Auf Ihren Wunsch können wir die Bestandsaufnahmen auch von einem Gerichtsvollzieher durchführen lassen."
    contract_text_2: "Als Verwalter Ihrer Immobilien kümmern wir uns um alle administrativen Verfahren, einschließlich der Registrierung Ihrer Immobilie oder jeder anderen gesetzlichen Verpflichtung. Unsere Immobilienagentur kann beispielsweise der bevorzugte Ansprechpartner der Steuerbehörden sein."
    contract_text_3: "In ständigem Kontakt mit dem Mieter übernehmen unsere Teams die Eröffnung der Wasser- und Stromzähler. Wir stellen auch sicher, dass der Mieter die obligatorischen Kontrollen durchgeführt hat, wie zum Beispiel die Heizungskontrolle."
    contract_text_4: "Wir überprüfen, dass die Wohnung versichert ist, nicht nur von Ihnen als Eigentümer, sondern auch vom Mieter. Unsere Agentur kann den Abschluss dieser Versicherungen bei Bedarf übernehmen."
    life_title: "Wie begleiten wir das gesamte Leben Ihrer Immobilie?"
    life_text_1: "Neben der Erledigung aller Formalitäten im Zusammenhang mit dem Besitz einer Mietimmobilie in Monaco nehmen wir allgemeiner an allen Aktivitäten teil, die das Leben des Gebäudes betreffen."
    life_text_2: "Eines unserer Teammitglieder wird bei allen Eigentümerversammlungen anwesend sein, eine Zusammenfassung wird Ihrer Akte beigefügt, damit Sie jederzeit einen Überblick über die Situation Ihrer Immobilie haben. Ebenso wird er eventuelle Wartungs- und Instandsetzungsarbeiten verfolgen, die in Ihrer Wohnung oder im Gebäude durchgeführt werden."
    life_text_3: "Er wird auch jeden Schadensfall verwalten. Er wird dafür sorgen, dass die Versicherungen informiert werden und wird kompetente Unternehmen kontaktieren, um Ihre Immobilie so schnell wie möglich wiederherzustellen."
    funds_title: "Wie verwalten wir Ihre Gelder?"
    funds_text_1: "Die Agence de la Gare ist als Verwalter für den Einzug der Mieten verantwortlich. Wir stellen sicher, dass die Gelder vom Mieter ohne Ausfälle oder Zahlungsverzögerungen gezahlt werden. Ob es sich um Fondsabrufe, den Versand von Mietquittungen oder die gerechte Regulierung der Nebenkosten handelt, der Verwalter verfolgt alle finanziellen Bewegungen in Bezug auf Ihre Immobilie."
    funds_text_2: "Die Agence de la Gare verwaltet seit mehreren Jahrzehnten mehrere Immobilienbestände in Monaco. Wir verfügen über ein Expertenteam und alle notwendigen Kenntnisse, um Ihre Immobilien effizient und sorgfältig zu verwalten."
    cta_title: "Möchten Sie unseren Immobilienverwaltungsservice nutzen?"
    cta_text: "Kontaktieren Sie uns, um mit unserer spezialisierten Mietverwaltungsabteilung zu sprechen und mehr über unsere Dienstleistungen zu erfahren."

  vendre:
    title: "Wie verkaufen Sie Ihre Immobilie in Monaco?"
    intro: "Unser Expertenteam begleitet Sie durch jeden Schritt des Verkaufs Ihrer Immobilie in Monaco. Von der Bewertung bis zur Unterzeichnung der notariellen Urkunde stellen wir unser Know-how in Ihren Dienst, um eine erfolgreiche Transaktion zu gewährleisten."
    estimate_title: "Wie viel ist Ihre Immobilie in Monaco wert?"
    estimate_text: "Eine gute Bewertung ist der Schlüssel zu einem erfolgreichen Verkauf. Unsere Experten analysieren den monegassischen Immobilienmarkt, vergleichen kürzlich verkaufte ähnliche Objekte und berücksichtigen die einzigartigen Merkmale Ihrer Immobilie, um Ihnen eine faire und realistische Schätzung anzubieten. Dieser Schritt ist wesentlich, um seriöse Käufer anzuziehen und unter den besten Bedingungen zu verkaufen."
    admin_title: "Welche Unterlagen werden für den Verkauf in Monaco benötigt?"
    admin_text: "Wir übernehmen alles, um Ihnen das Leben zu vereinfachen. Unser Team kümmert sich um die Zusammenstellung aller für den Verkauf Ihrer Immobilie erforderlichen Dokumente."
    admin_docs_intro: "Wir sammeln folgende Dokumente von Ihnen:"
    admin_doc_1: "Eigentumstitel"
    admin_doc_2: "Letzte Protokolle der Eigentümerversammlung"
    admin_doc_3: "Pflichtdiagnosen"
    admin_doc_4: "Nebenkostenabrechnung"
    admin_doc_5: "Grundsteuer"
    admin_doc_6: "Grundrisse der Immobilie"
    admin_doc_7: "Flächenbescheinigung (Carrez-Gesetz)"
    admin_doc_8: "Letzte Nebenkostenquittungen"
    admin_mandate_intro: "Sobald Ihre Unterlagen vollständig sind, können wir das Verkaufsmandat erstellen, das unsere Zusammenarbeit formalisiert."
    mandate_title: "Alles Wissenswerte über das Verkaufsmandat"
    mandate_intro: "Das Verkaufsmandat kann drei verschiedene Formen annehmen. Jede bietet spezifische Vorteile je nach Ihrer Situation und Ihren Zielen."
    mandate_simple_title: "Das einfache Mandat"
    mandate_simple_text_1: "Das einfache Mandat ermöglicht es Ihnen, den Verkauf Ihrer Immobilie mehreren Agenturen gleichzeitig anzuvertrauen. Sie behalten auch die Möglichkeit, selbst zu verkaufen."
    mandate_simple_text_2: "Diese Formel bietet große Flexibilität, kann aber zu einem geringeren Engagement jeder Agentur führen, da die Immobilie von mehreren Vermittlern angeboten wird."
    mandate_simple_text_3: "Das einfache Mandat eignet sich, wenn Sie die Sichtbarkeit Ihrer Immobilie bei verschiedenen Netzwerken potenzieller Käufer maximieren möchten."
    mandate_exclusive_title: "Das Exklusivmandat"
    mandate_exclusive_text_1: "Das Exklusivmandat vertraut den Verkauf Ihrer Immobilie einer einzigen Agentur für einen festgelegten Zeitraum an. Diese Exklusivität ermöglicht es uns, alle unsere Mittel einzusetzen, um Ihre Immobilie unter den besten Bedingungen zu verkaufen."
    mandate_exclusive_text_2: "Mit einem Exklusivmandat investieren wir mehr in die Vermarktung Ihrer Immobilie: professionelle Fotografie, virtuelle Besichtigungen, gezielte Verbreitung an unser Netzwerk qualifizierter Käufer."
    mandate_exclusive_text_3: "Diese Formel wird für Prestigeimmobilien oder wenn Diskretion gewünscht wird empfohlen."
    mandate_coexclusive_title: "Das Ko-Exklusivmandat"
    mandate_coexclusive_text_1: "Das Ko-Exklusivmandat ist ein Kompromiss zwischen dem einfachen und dem exklusiven Mandat. Sie vertrauen den Verkauf einer begrenzten Anzahl von Agenturen an (in der Regel zwei oder drei), die zusammenarbeiten."
    mandate_coexclusive_text_2: "Diese Formel ermöglicht es, von einer guten Marktabdeckung zu profitieren und gleichzeitig ein hohes Engagement der beauftragten Agenturen aufrechtzuerhalten."
    mandate_choice: "Bei der Wahl des Mandatstyps berät Sie unser Team basierend auf der Art Ihrer Immobilie, dem aktuellen Markt und Ihren Prioritäten. Wir begleiten Sie bei der besten Entscheidung."
    selling_title: "Wie verkaufen wir Ihre Immobilie?"
    selling_text_1: "Sobald das Mandat unterzeichnet ist, setzen wir unsere Vermarktungsstrategie um. Ihre Immobilie wird über alle unsere Kanäle verbreitet: Website, Immobilienportale, soziale Medien und unser Netzwerk qualifizierter Käufer."
    selling_text_2: "Wenn sich ein potenzieller Käufer meldet, organisieren wir die Besichtigungen und verhandeln in Ihrem Namen, um den besten Preis zu erzielen. Jedes Angebot wird Ihnen mit unserer Analyse und unseren Empfehlungen präsentiert."
    selling_text_3: "Sobald das Angebot angenommen ist, begleiten wir beide Parteien bis zur Unterzeichnung des Vorvertrags vor dem Notar. Dieses Dokument verpflichtet Käufer und Verkäufer und legt die Bedingungen der Transaktion fest."
    selling_text_4: "Die Unterzeichnung der notariellen Urkunde beim Notar schließt den Verkauf ab. Wir bleiben bis zu diesem letzten Schritt an Ihrer Seite, um sicherzustellen, dass alles perfekt verläuft."
    funds_title: "Wann und wie werden die Gelder ausgezahlt?"
    funds_text_1: "Nach der Unterzeichnung der notariellen Urkunde nimmt der Notar die Auszahlung der Mittel vor. Der Verkaufspreis, abzüglich Gebühren und eventueller Darlehensrückzahlungen, wird Ihnen innerhalb weniger Tage nach der Unterzeichnung überwiesen."
    funds_text_2: "Unser Team steht Ihnen auch nach dem Verkauf zur Verfügung, um alle Ihre Fragen zu beantworten und Sie bei Ihren zukünftigen Projekten zu unterstützen."
    cta_title: "Ein Verkaufsprojekt?"
    cta_text: "Möchten Sie uns mit dem Verkauf Ihrer Immobilie beauftragen? Füllen Sie das untenstehende Formular aus und einer unserer Immobilienberater wird sich schnellstmöglich bei Ihnen melden."

