    about_title: "Über uns"
    about_text: "Im Herzen des lebhaften Viertels La Condamine gelegen, am Fuße des majestätischen Felsens, auf dem der Fürstenpalast thront, ist unsere Immobilienagentur, geleitet von Pierre Maré und seinem Sohn Adrien Maré, ein unabhängiges Familienunternehmen. Mit umfangreicher Erfahrung und einem dynamischen Ansatz haben wir vertrauensvolle Beziehungen zu unseren Kunden aufgebaut, von Generation zu Generation.\n\nWir bieten eine personalisierte Verwaltung Ihrer Immobilien, mit sorgfältiger Instandhaltung und strenger Überwachung, um eine optimale Mietrendite und eine kontinuierliche Wertsteigerung Ihres Vermögens im Laufe der Zeit zu gewährleisten.\n\nOb Sie eine Immobilie zum Kauf oder zur Miete suchen, für ein persönliches oder berufliches Projekt — unser Team steht Ihnen zur Verfügung, um Sie bei jedem Schritt Ihres Vorhabens zu begleiten.\n\nWir übernehmen alle administrativen Formalitäten, die für Ihre Niederlassung oder die Ihrer Mieter unerlässlich sind: Erstellung von Mietverträgen, Registrierung bei den Steuerbehörden, Ein- und Auszugsprotokolle sowie Abschluss von Strom-, Wasser- und Versicherungsverträgen.\n\nUnsere Expertise ermöglicht es uns auch, mit monegassischen Notaren und Anwälten bei der Schätzung und Bewertung von Immobilien zusammenzuarbeiten. Darüber hinaus bieten wir in Zusammenarbeit mit dem renommierten Büro Tania Innenarchitektur Projekte zur Umgestaltung und Neuplanung von Wohnungen an.\n\nUnser Tätigkeitsbereich erstreckt sich auf das Fürstentum Monaco und die angrenzende französische Region, dank unserer Partnerschaft mit einem lokalen Korrespondenten."
