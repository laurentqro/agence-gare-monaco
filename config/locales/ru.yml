    admin_doc_7: "Свидетельство о площади (закон Карре)"
    admin_doc_8: "Последние квитанции об оплате"
    admin_mandate_intro: "После формирования полного досье мы можем оформить мандат на продажу, который закрепит наше сотрудничество."
    mandate_title: "Всё о мандате на продажу"
    mandate_intro: "Мандат на продажу может принимать три различные формы. Каждая из них имеет свои преимущества в зависимости от вашей ситуации и целей."
    mandate_simple_title: "Простой мандат"
    mandate_simple_text_1: "Простой мандат позволяет доверить продажу вашей недвижимости нескольким агентствам одновременно. Вы также сохраняете возможность продать самостоятельно."
    mandate_simple_text_2: "Эта формула обеспечивает большую гибкость, но может привести к меньшей вовлечённости каждого агентства, поскольку объект предлагается несколькими посредниками."
    mandate_simple_text_3: "Простой мандат подходит, если вы хотите максимизировать видимость вашего объекта среди различных сетей потенциальных покупателей."
    mandate_exclusive_title: "Эксклюзивный мандат"
    mandate_exclusive_text_1: "Эксклюзивный мандат поручает продажу вашей недвижимости одному агентству на определённый срок. Эта эксклюзивность позволяет нам задействовать все наши ресурсы для продажи на лучших условиях."
    mandate_exclusive_text_2: "С эксклюзивным мандатом мы больше инвестируем в продвижение вашего объекта: профессиональная фотосъёмка, виртуальные туры, целевое распространение среди нашей сети квалифицированных покупателей."
    mandate_exclusive_text_3: "Эта формула рекомендуется для престижной недвижимости или когда желательна конфиденциальность."
    mandate_coexclusive_title: "Со-эксклюзивный мандат"
    mandate_coexclusive_text_1: "Со-эксклюзивный мандат — это компромисс между простым и эксклюзивным мандатами. Вы доверяете продажу ограниченному числу агентств (обычно двум или трём), которые работают совместно."
    mandate_coexclusive_text_2: "Эта формула позволяет получить хорошее покрытие рынка при сохранении высокого уровня вовлечённости агентств-мандатариев."
    mandate_choice: "При выборе типа мандата наша команда консультирует вас с учётом характера вашей недвижимости, текущего состояния рынка и ваших приоритетов. Мы сопровождаем вас в принятии лучшего решения."
    selling_title: "Как мы продаём вашу недвижимость?"
    selling_text_1: "После подписания мандата мы реализуем нашу маркетинговую стратегию. Ваш объект размещается на всех наших каналах: сайт, порталы недвижимости, социальные сети и наша сеть квалифицированных покупателей."
    selling_text_2: "Когда потенциальный покупатель проявляет интерес, мы организуем показы и ведём переговоры от вашего имени для получения лучшей цены. Каждое предложение представляется вам с нашим анализом и рекомендациями."
    selling_text_3: "После принятия предложения мы сопровождаем обе стороны до подписания предварительного договора купли-продажи у нотариуса. Этот документ обязывает покупателя и продавца и устанавливает условия сделки."
    selling_text_4: "Подписание нотариального акта у нотариуса завершает продажу. Мы остаёмся рядом с вами до этого последнего этапа, чтобы гарантировать, что всё пройдёт идеально."
    funds_title: "Когда и как выплачиваются средства?"
    funds_text_1: "После подписания нотариального акта нотариус производит выплату средств. Цена продажи за вычетом сборов и возможных погашений кредитов выплачивается вам в течение нескольких дней после подписания."
    funds_text_2: "Наша команда остаётся в вашем распоряжении после продажи для ответов на все ваши вопросы и сопровождения в будущих проектах."
    cta_title: "Планируете продажу?"
    cta_text: "Хотите доверить нам продажу вашей недвижимости? Заполните форму ниже, и один из наших консультантов по сделкам свяжется с вами в кратчайшие сроки."

