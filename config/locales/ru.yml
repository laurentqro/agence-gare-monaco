  gestion:
    title: "Управление арендой в Монако"
    intro: "Когда вы являетесь владельцем недвижимости, управление ею может быть затруднительным с учётом различных личных и профессиональных обязательств и стресса, который это может вызывать ежедневно. Agence de la Gare предоставляет в ваше распоряжение комплексный сервис по управлению всей вашей недвижимостью, чтобы облегчить взаимодействие с арендаторами. Как эксперты в сфере недвижимости, мы предоставляем команду профессионалов, которая обеспечит управление всем вашим арендным портфелем."
    missions_title: "Каковы задачи нашего агентства?"
    missions_text: "Agence de la Gare выполняет множество задач — от публикации объявления об аренде до открытия счётчиков воды и электричества, включая подписание договора аренды."
    publication_title: "Как мы размещаем вашу недвижимость и отбираем кандидатов?"
    publication_text_1: "Мы размещаем вашу недвижимость на всех наших каналах коммуникации с целью сдать её в аренду как можно скорее. Затем следует выбор арендатора."
    publication_text_2: "Наша роль — оценить финансовые возможности кандидатов. Для этого мы просим их предоставить:"
    publication_item_1: "последние расчётные листки"
    publication_item_2: "трудовой договор"
    publication_item_3: "банковскую справку"
    publication_text_3: "Также может быть проведена проверка у предыдущих арендодателей с целью ответить на два основных вопроса:"
    publication_question_1: "Надёжный ли он плательщик?"
    publication_question_2: "Является ли он порядочным человеком?"
    publication_text_4: "Наш особо тщательный отбор не оставляет места для сомнений. Рынок аренды отличается высоким спросом, что позволяет нам быть особенно избирательными. Ни один арендатор не заселяется в управляемую нами квартиру без надёжных гарантий платёжеспособности."
    contract_title: "Как мы составляем договор аренды и заселяем арендатора?"
    contract_text_1: "Агентство берёт на себя составление договора аренды. То же касается составления актов приёма-передачи при въезде и выезде арендатора. По вашему желанию мы можем организовать составление актов судебным приставом."
    contract_text_2: "Как управляющий вашей недвижимостью, мы занимаемся всеми административными процедурами, включая регистрацию вашей собственности и выполнение любых юридических обязательств. Например, наше агентство может выступать привилегированным представителем перед налоговыми органами."
    contract_text_3: "В постоянном контакте с арендатором, наша команда занимается открытием счётчиков воды и электричества. Мы также следим за тем, чтобы арендатор провёл обязательные проверки, например, проверку котла."
    contract_text_4: "Мы проверяем, что квартира застрахована как вами, собственником, так и арендатором. Наше агентство может организовать оформление этих страховок при необходимости."
    life_title: "Как мы следим за жизнью вашей недвижимости?"
    life_text_1: "Помимо выполнения всех формальностей, связанных с владением арендуемой недвижимостью в Монако, мы более широко участвуем во всех мероприятиях, касающихся жизни здания."
    life_text_2: "Один из членов нашей команды будет присутствовать на всех общих собраниях собственников, к вашему досье будет приложена сводная записка, чтобы вы в любой момент имели полную картину состояния вашей недвижимости. Аналогичным образом, он будет отслеживать возможные ремонтные работы в вашей квартире или в здании."
    life_text_3: "Он также будет управлять любыми страховыми случаями. Он позаботится об уведомлении страховых компаний и свяжется с компетентными организациями для скорейшего восстановления вашей недвижимости."
    funds_title: "Как мы управляем вашими средствами?"
    funds_text_1: "Agence de la Gare, как управляющий, отвечает за сбор арендной платы. Мы следим за тем, чтобы средства были оплачены арендатором без задержек и просрочек. Будь то запросы на оплату, отправка квитанций или справедливая корректировка платежей, управляющий контролирует все финансовые операции, связанные с вашей недвижимостью."
    funds_text_2: "Agence de la Gare уже несколько десятилетий управляет несколькими портфелями недвижимости в Монако. У нас есть экспертная команда и все необходимые знания для эффективного и бережного управления вашей недвижимостью."
    cta_title: "Заинтересованы в наших услугах по управлению недвижимостью?"
    cta_text: "Свяжитесь с нашим специализированным отделом по управлению арендой, чтобы узнать больше о наших услугах."

  vendre:
    title: "Как продать свою недвижимость в Монако?"
    intro: "Наша команда экспертов сопровождает вас на всех этапах, необходимых для реализации вашего проекта продажи в Монако."
    estimate_title: "Оцените стоимость вашей недвижимости"
    estimate_text: "Правильная оценка вашей недвижимости позволит заключить сделку быстро, поскольку реальная стоимость вашего объекта привлечёт подходящих покупателей. Чтобы определить реальную стоимость вашей недвижимости, один из переговорщиков нашего агентства приедет осмотреть ваш объект, чтобы собрать максимум данных, позволяющих оценить справедливую цену. Вот методы, на которые мы опираемся при оценке вашей недвижимости."
    admin_title: "Мы берём на себя всю административную часть продажи"
    admin_text: "Мы берём всё на себя, чтобы ваш опыт был максимально приятным."
    admin_docs_intro: "Мы собираем у вас все документы, необходимые для продажи вашей недвижимости, а именно:"
    admin_doc_1: "ваше свидетельство о праве собственности на продаваемый объект,"
    admin_doc_2: "копию ваших удостоверяющих личность документов (действующий паспорт и удостоверение личности и/или вид на жительство)"
    admin_doc_3: "копию документа, подтверждающего место жительства"
    admin_doc_4: "три последних протокола общего собрания собственников,"
    admin_doc_5: "регламент совместного владения (правила кондоминиума),"
    admin_doc_6: "все юридические документы, относящиеся к вашей компании, если вы осуществляете продажу в качестве юридического лица,"
    admin_doc_7: "досье по управлению арендой, если продаваемый вами объект является предметом договора аренды,"
    admin_doc_8: "досье приёмки работ в рамках строительных работ, подлежащих получению разрешения."
    admin_mandate_intro: "Как только ваше досье будет полным, наша команда предложит вам заключить поручение на продажу. Это договор, в котором указываются цена продажи, наше вознаграждение, его срок, а также условия. Это двусторонний договор, который обязывает нас взаимно."
    mandate_title: "Всё, что нужно знать о поручении на продажу"
    mandate_intro: "Поручение на продажу может принимать три формы. Оно может быть простым, эксклюзивным или со-эксклюзивным:"
    mandate_simple_title: "Простое поручение на продажу"
    mandate_simple_text_1: "Этот тип поручения позволяет вам доверить продажу вашей недвижимости нескольким агентствам недвижимости (юридически называемым поверенными). Он также оставляет вам возможность продать ваш объект самостоятельно. Только тот поверенный, которому удастся свести вас с покупателем и провести переговоры, получит вознаграждение за свои услуги."
    mandate_simple_text_2: "Этот тип поручения оставляет вам большую свободу действий, но имеет, однако, негативные стороны. Высокая конкуренция между исполнителями соответственно снижает их шансы на получение вознаграждения. Это часто склонно ограничивать вовлечённость наших конкурентов. Кроме того, нередко можно увидеть один и тот же объект, рекламируемый с разной информацией, такой как цена продажи, площадь… что является серьёзным препятствием в переговорах с потенциальными покупателями."
    mandate_simple_text_3: "Таким образом, это поручение интересно для вас, если вы хотите сохранить контроль над продажей вашей недвижимости, но оно может, тем не менее, оказаться особенно контрпродуктивным."
    mandate_exclusive_title: "Эксклюзивное поручение"
    mandate_exclusive_text_1: "Эксклюзивное поручение на продажу доверяет продажу объекта одному единственному агентству недвижимости. Коммуникация по объекту здесь гораздо более последовательна. Кроме того, агентство недвижимости, зная, что оно единственное в гонке за продажу объекта, вложит в это все необходимые финансовые и человеческие ресурсы, чтобы максимизировать продажу в кратчайшие сроки и на лучших условиях."
    mandate_exclusive_text_2: "Стратегии, касающиеся продажи объекта, будут определяться одной и той же командой, что позволит покупателям видеть последовательное предложение. Ощущение надёжности является решающим на последующем этапе переговоров. Действительно, доверие между сторонами в ходе переговоров является главным ингредиентом успешной продажи."
    mandate_exclusive_text_3: "Поскольку это поручение является эксклюзивным, вы должны выбирать своего поверенного с должной осмотрительностью. Действительно, вы потеряете свободу продавать вашу недвижимость самостоятельно или ставить в конкуренцию несколько агентств. Тем не менее, работая с нашим агентством, вы получите единственного собеседника для централизации всех запросов от потенциальных покупателей или других агентств и для полного контроля над вашим объектом и раскрываемой информацией."
    mandate_coexclusive_title: "Со-эксклюзивное поручение"
    mandate_coexclusive_text_1: "Со-эксклюзивное поручение может быть гибридным решением в случае, если ни условия простого поручения, ни условия эксклюзивного поручения вас не удовлетворят. Это поручение основывается на тех же принципах, что и эксклюзивное поручение, которое мы только что представили. Тем не менее, оно позволяет вам доверить продажу вашей недвижимости двум агентствам недвижимости."
    mandate_coexclusive_text_2: "Оно обладает точно теми же преимуществами, а именно большим предоставлением финансовых и человеческих ресурсов со стороны агентств и более согласованной коммуникационной стратегией, чем при простом поручении."
    mandate_choice: "Когда дело доходит до выбора между этими различными типами поручений, особенно если вы колеблетесь между эксклюзивным или со-эксклюзивным поручением, предпочтительно связаться с агентством, которому вы отдаёте предпочтение. Таким образом, оно сможет направить вас к поверенному, с которым можно будет работать сообща, чтобы возникла синергия. Так вы умножаете силы для достижения лучших результатов."
    selling_title: "Как мы продаём вашу недвижимость?"
    selling_text_1: "Наши команды составляют аргументацию для продажи, которая будет сопровождать визуальный контент (видео в HD и фотографии в HD в формате 360°) на всех освоенных нами каналах (сайт, социальные сети, обзоры прессы и т. д.). Как только покупатель заинтересован, мы показываем ему объект в сопровождении одного из наших переговорщиков."
    selling_text_2: "По итогам этого процесса, если клиент заинтересован в объекте, мы составляем предложение о покупке, отражающее его условия, в сопровождении чека на сумму 10% от предлагаемой суммы, выписанного на имя нотариуса, чтобы подтвердить его добрую волю приобрести объект. Следует отметить, что мы поддерживаем постоянную связь с продавцом и покупателем на протяжении всего процесса продажи. В случае достижения согласия по цене и объекту мы назначаем встречу у нотариуса княжества для подписания предварительного договора купли-продажи. Чек вносится в качестве задатка в счёт цены продажи объекта."
    selling_text_3: "Как мы подчёркивали в нашем руководстве по покупке для переезда в Монако, подписание предварительного договора купли-продажи не является обязательным, но может быть необходимым, в частности, в рамках преимущественного права покупки монегасского государства. Это право применяется ко всем зданиям, построенным до 1947 года."
    selling_text_4: "Наконец, после того как все отлагательные условия будут сняты в установленные сроки, настанет время вновь встретиться у нотариуса для подписания окончательного нотариального акта, в дату которого покупатель должен будет полностью оплатить сумму, соответствующую цене указанного объекта, за вычетом задатка, а также нотариальные расходы в размере 6% и комиссию агентства в размере 3% без учёта налогов от цены объекта, согласно тарифам Монегасской палаты недвижимости. В случае если одно из отлагательных условий не будет снято, чек задатка будет возвращён покупателю, а продажа будет считаться аннулированной."
    funds_title: "Перечисление средств"
    funds_text_1: "После подписания документов у нотариуса средства будут перечислены вам нотариальной конторой в течение 15 дней, за вычетом гонорара агентства со стороны продавца, установленного согласно тарифам Монегасской палаты недвижимости в размере 5% без учёта налогов от цены продажи."
    funds_text_2: "Мы надеемся, что теперь вы больше знаете о нашем процессе продажи недвижимости в Монако. По любым вопросам о покупке, продаже, аренде, управлении и оценке вашей недвижимости в Монако наша команда с удовольствием ждёт вас и остаётся в вашем распоряжении."
    cta_title: "Планируете продажу?"
    cta_text: "Хотите доверить нам продажу вашей недвижимости? Заполните форму ниже, и один из наших консультантов по сделкам свяжется с вами в кратчайшие сроки."

