      title: "Как мы оцениваем вашу недвижимость"
      intro: "Рынок недвижимости Монако не публикует свои сделки: менее тысячи продаж в год, значительные различия между зданиями и исключительные объекты, не подчиняющиеся общим правилам. Точная оценка требует одновременно надёжных данных и тонкого знания местной специфики."
      method:
        eyebrow: "Методология"
        title: "Три этапа — от модели до визита"
        step1_title: "Гедоническая модель IMSEE"
        step1_body: "Observatoire de l'Immobilier ежегодно публикует регрессионную модель, построенную на всех сделках, зарегистрированных в Княжестве. Модель выделяет влияние трёх переменных — район, площадь, десятилетие постройки — и возвращает справочную стоимость."
        step2_title: "Сопоставимые сделки"
        step2_body: "Этот ориентир мы сверяем с недавними продажами аналогичных квартир в том же здании или на той же улице. Именно они — а не запрашиваемые цены — отражают реальное состояние рынка."
        step3_title: "Экспертиза на месте"
        step3_body: "Наконец, наши агенты посещают вашу недвижимость, чтобы оценить то, что не способна уловить ни одна модель: этаж, вид на море, ориентация, качество отделки, терраса, парковка. Именно этот этап превращает ориентировочную цифру в обоснованное мнение о стоимости."
      factors:
        eyebrow: "Что влияет на цену"
        title: "Что определяет стоимость недвижимости в Монако"
        location_title: "Расположение"
        location_body: "Район во многом задаёт цену за квадратный метр. Carré d'Or, Monte-Carlo и Larvotto находятся на вершине шкалы; Fontvieille и Jardin Exotique предлагают более доступный вход. Даже в пределах одного района близость к набережной или торговым улицам создаёт ощутимую разницу."
        property_title: "Характеристики"
        property_body: "Площадь, год постройки, этаж, ориентация, вид, общее состояние и оснащение (кондиционер, парковка, погреб, терраса) заметно влияют на итоговую цифру. Отремонтированная квартира с видом на море может стоить на 30–40% дороже сопоставимого объекта без вида в том же здании."
        market_title: "Рынок"
        market_body: "Рынок Монако движется циклами. Колебания предложения, решения крупных институциональных собственников, международное налогообложение и зарубежный спрос меняют цены год от года. Корректная оценка учитывает не только сам объект, но и текущий момент рынка."
      expert:
        eyebrow: "Зачем нужен визит"
        title: "Точная оценка требует визита"
        body: "Модель IMSEE объясняет 51% колебаний наблюдаемых цен. Оставшиеся 49% зависят от факторов, которые не способна зафиксировать ни одна база данных: качество ремонта, тишина улицы, свет южной экспозиции, характер здания. Именно это измеряет наш визит — и именно это отличает ориентировочную оценку от реально достижимой цены продажи."
    faq:
      eyebrow: "Часто задаваемые"
      title: "Ваши вопросы об оценке недвижимости в Монако"
      items:
        accuracy:
          q: "Насколько точна онлайн-оценка?"
          a: "Наш инструмент возвращает диапазон ±25% вокруг справочной цены IMSEE. Для типовой квартиры в хорошо представленном районе разброс обычно невелик. Для исключительных объектов — пентхаусов, квартир с видом на море, знаковых зданий — обоснованную цифру даёт только визит на место."
        free:
          q: "Является ли экспертная оценка бесплатной?"
          a: "Да. Наш визит и письменное мнение о стоимости полностью бесплатны и ни к чему вас не обязывают. Мы взимаем вознаграждение только в том случае, если вы доверите нам проведение продажи."
        difference:
          q: "В чём разница между онлайн-оценкой и экспертным визитом?"
          a: "Онлайн-оценка использует три переменные — район, площадь, год постройки — и даёт порядок величины. Экспертный визит учитывает этаж, вид, ориентацию, состояние, отделку и само здание. Именно этот качественный пласт позволяет определить реалистичную цену предложения."
        why:
          q: "Зачем оценивать мою недвижимость в Монако?"
          a: "Чтобы продать по справедливой цене, рефинансировать, спланировать наследство или просто знать стоимость своего актива. В Монако, где сделки не публикуются, профессиональная оценка зачастую остаётся единственным способом получить надёжный ориентир."
        method:
          q: "Как вы рассчитываете цену квартиры в Монако?"
          a: "Мы объединяем три источника: гедоническую регрессионную модель, ежегодно публикуемую IMSEE (Observatoire de l'Immobilier), недавние сопоставимые сделки в том же здании или районе и наше непосредственное прочтение рынка — текущие предложения, сигналы со стороны предложения и спрос международных покупателей."
        factors:
          q: "Какие критерии сильнее всего влияют на цену?"
          a: "В порядке убывания: расположение (район и точный адрес), этаж и вид, полезная площадь и планировка, состояние и качество отделки, год постройки и ориентация. Только два последних параметра учитываются моделью IMSEE — поэтому визит так важен."
        time:
          q: "Сколько времени занимает получение экспертного заключения?"
          a: "Визит — в течение 24–48 часов, письменное мнение о стоимости — в течение недели. Если нужна немедленная ориентировочная цифра, достаточно инструмента выше."

