  gestion:
    title: "Управление арендой в Монако"
    intro: "Когда вы являетесь владельцем недвижимости, управление ею может быть затруднительным с учётом различных личных и профессиональных обязательств и стресса, который это может вызывать ежедневно. Agence de la Gare предоставляет в ваше распоряжение комплексный сервис по управлению всей вашей недвижимостью, чтобы облегчить взаимодействие с арендаторами. Как эксперты в сфере недвижимости, мы предоставляем команду профессионалов, которая обеспечит управление всем вашим арендным портфелем."
    missions_title: "Каковы задачи нашего агентства?"
    missions_text: "Agence de la Gare выполняет множество задач — от публикации объявления об аренде до открытия счётчиков воды и электричества, включая подписание договора аренды."
    publication_title: "Как мы размещаем вашу недвижимость и отбираем кандидатов?"
    publication_text_1: "Мы размещаем вашу недвижимость на всех наших каналах коммуникации с целью сдать её в аренду как можно скорее. Затем следует выбор арендатора."
    publication_text_2: "Наша роль — оценить финансовые возможности кандидатов. Для этого мы просим их предоставить:"
    publication_item_1: "последние расчётные листки"
    publication_item_2: "трудовой договор"
    publication_item_3: "банковскую справку"
    publication_text_3: "Также может быть проведена проверка у предыдущих арендодателей с целью ответить на два основных вопроса:"
    publication_question_1: "Надёжный ли он плательщик?"
    publication_question_2: "Является ли он порядочным человеком?"
    publication_text_4: "Наш особо тщательный отбор не оставляет места для сомнений. Рынок аренды отличается высоким спросом, что позволяет нам быть особенно избирательными. Ни один арендатор не заселяется в управляемую нами квартиру без надёжных гарантий платёжеспособности."
    contract_title: "Как мы составляем договор аренды и заселяем арендатора?"
    contract_text_1: "Агентство берёт на себя составление договора аренды. То же касается составления актов приёма-передачи при въезде и выезде арендатора. По вашему желанию мы можем организовать составление актов судебным приставом."
    contract_text_2: "Как управляющий вашей недвижимостью, мы занимаемся всеми административными процедурами, включая регистрацию вашей собственности и выполнение любых юридических обязательств. Например, наше агентство может выступать привилегированным представителем перед налоговыми органами."
    contract_text_3: "В постоянном контакте с арендатором, наша команда занимается открытием счётчиков воды и электричества. Мы также следим за тем, чтобы арендатор провёл обязательные проверки, например, проверку котла."
    contract_text_4: "Мы проверяем, что квартира застрахована как вами, собственником, так и арендатором. Наше агентство может организовать оформление этих страховок при необходимости."
    life_title: "Как мы следим за жизнью вашей недвижимости?"
    life_text_1: "Помимо выполнения всех формальностей, связанных с владением арендуемой недвижимостью в Монако, мы более широко участвуем во всех мероприятиях, касающихся жизни здания."
    life_text_2: "Один из членов нашей команды будет присутствовать на всех общих собраниях собственников, к вашему досье будет приложена сводная записка, чтобы вы в любой момент имели полную картину состояния вашей недвижимости. Аналогичным образом, он будет отслеживать возможные ремонтные работы в вашей квартире или в здании."
    life_text_3: "Он также будет управлять любыми страховыми случаями. Он позаботится об уведомлении страховых компаний и свяжется с компетентными организациями для скорейшего восстановления вашей недвижимости."
    funds_title: "Как мы управляем вашими средствами?"
    funds_text_1: "Agence de la Gare, как управляющий, отвечает за сбор арендной платы. Мы следим за тем, чтобы средства были оплачены арендатором без задержек и просрочек. Будь то запросы на оплату, отправка квитанций или справедливая корректировка платежей, управляющий контролирует все финансовые операции, связанные с вашей недвижимостью."
    funds_text_2: "Agence de la Gare уже несколько десятилетий управляет несколькими портфелями недвижимости в Монако. У нас есть экспертная команда и все необходимые знания для эффективного и бережного управления вашей недвижимостью."
    cta_title: "Заинтересованы в наших услугах по управлению недвижимостью?"
    cta_text: "Свяжитесь с нашим специализированным отделом по управлению арендой, чтобы узнать больше о наших услугах."

  vendre:
    title: "Как продать недвижимость в Монако?"
    intro: "Наша команда экспертов сопровождает вас на каждом этапе продажи вашей недвижимости в Монако. От оценки до подписания нотариального акта мы используем наш опыт для обеспечения успешной сделки."
    estimate_title: "Сколько стоит ваша недвижимость в Монако?"
    estimate_text: "Правильная оценка — ключ к успешной продаже. Наши эксперты анализируют рынок недвижимости Монако, сравнивают недавно проданные аналогичные объекты и учитывают уникальные характеристики вашей собственности, чтобы предложить справедливую и реалистичную оценку. Этот этап необходим для привлечения серьёзных покупателей и продажи на лучших условиях."
    admin_title: "Какие документы необходимы для продажи недвижимости в Монако?"
    admin_text: "Мы берём на себя всё, чтобы упростить вашу жизнь. Наша команда занимается сбором всех документов, необходимых для выставления вашей недвижимости на продажу."
    admin_docs_intro: "Мы запрашиваем у вас следующие документы:"
    admin_doc_1: "Свидетельство о праве собственности"
    admin_doc_2: "Последние протоколы общего собрания"
    admin_doc_3: "Обязательная техническая диагностика"
    admin_doc_4: "Выписка о расходах на содержание"
    admin_doc_5: "Земельный налог"
    admin_doc_6: "Планы объекта"
    admin_doc_7: "Свидетельство о площади (закон Карре)"
    admin_doc_8: "Последние квитанции об оплате"
