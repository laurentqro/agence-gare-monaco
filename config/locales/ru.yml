  homepage:
    hero_title: "Недвижимость в Монако с 1942 года"
    hero_subtitle: "Член Палаты недвижимости Монако"
    about_title: "Agence Immobilière de la Gare"
    about_history: "Основанное в 1942 году, Agence Immobilière de la Gare — это независимое семейное предприятие, член Палаты недвижимости Монако. Идеально расположенное в самом сердце оживлённого района Кондамин, у подножия величественной Скалы, где возвышается Княжеский дворец, наше агентство управляется Пьером Маре и его сыном Адриеном Маре. Благодаря богатому опыту и динамичному подходу мы выстроили доверительные отношения с нашими клиентами из поколения в поколение."
    about_services: "Мы предлагаем полный спектр услуг по продаже, аренде и управлению недвижимостью в Монако. Мы обеспечиваем персонализированное управление вашей собственностью с тщательным обслуживанием и строгим контролем для гарантии оптимальной доходности от аренды. Мы берём на себя все административные формальности: составление договоров аренды, налоговую регистрацию, акты приёма-передачи и оформление договоров на электричество, воду и страхование."
    about_expertise: "Наш опыт позволяет нам сотрудничать с монакскими нотариусами и адвокатами для оценки недвижимости. В партнёрстве с бюро Tania Architecture d'intérieur мы предлагаем проекты по перепланировке и ремонту квартир. Наша зона деятельности охватывает Княжество Монако и прилегающий регион Франции. Свяжитесь с нами по телефону (+377) 93 30 22 36 или по адресу info@agencegaremonaco.com."
    team_title: "Наша команда"
    team:
      pierre_role: "Со-управляющий"
      adrien_role: "Директор / Переговорщик"
      josiane_role: "Секретариат / Управление"
      pierre_bio: "Пьер Маре — со-управляющий Agence Immobilière de la Gare в Монако. Обладая многолетним опытом работы на рынке недвижимости Монако, он руководит семейным агентством, основанным в 1942 году. Его глубокое знание рынка недвижимости Княжества и давние связи с местными нотариусами и адвокатами делают его надёжным советником по сделкам с недвижимостью в Монако."
      adrien_bio: "Адриен Маре — директор и переговорщик в Agence Immobilière de la Gare. Представляя новое поколение этого семейного бизнеса, основанного в 1942 году, он привносит динамичный и современный подход к рынку недвижимости Монако. Специализируясь на продажах и переговорах, Адриен сопровождает своих клиентов на всех этапах их проектов в сфере недвижимости в Монако."
      josiane_bio: "Жозиана Алези — руководитель административного отдела и отдела управления арендой в Agence Immobilière de la Gare. Обладая глубоким знанием административных процедур Монако, она обеспечивает повседневное управление арендуемой недвижимостью, составление договоров аренды, акты приёма-передачи и взаимодействие с арендаторами."
    featured_articles_title: "Статьи"
    read_more: "Подробнее"
    contact_title: "Свяжитесь с нами"
    carousel_title: "Монако"
    card_buy: "Купить"
    card_rent: "Арендовать"
    card_offmarket: "Off-market"
    card_sell: "Продать"
    card_management: "Управление"
    videos_title: "Видео"
    videos_view_channel: "Смотреть все наши видео"
    faq_title: "Часто задаваемые вопросы"
    faqs:
      - question: "Что такое Agence Immobilière de la Gare?"
        answer: "Agence Immobilière de la Gare — это независимое семейное агентство, основанное в 1942 году в Монако, член Палаты недвижимости Монако. Расположенное по адресу 3, Rue Langlé в районе Кондамин, оно управляется Пьером Маре и его сыном Адриеном Маре."
      - question: "Какие услуги вы предлагаете?"
        answer: "Мы предлагаем полный спектр услуг по продаже, аренде и управлению недвижимостью в Монако и на Лазурном Берегу. Мы также выполняем оценку недвижимости, составление договоров аренды, налоговую регистрацию и акты приёма-передачи."
      - question: "В каких районах Монако вы работаете?"
        answer: "Мы работаем во всех районах Монако: Монте-Карло, Кондамин, Фонвьей, Ларвотто, Монегетти, Сен-Роман и Монако-Виль. Наша деятельность также распространяется на прилегающий регион Франции."
      - question: "Как связаться с агентством?"
        answer: "Вы можете позвонить нам по телефону (+377) 93 30 22 36, написать на info@agencegaremonaco.com или посетить нас по адресу 3, Rue Langlé, MC 98000 Monaco. Мы работаем с понедельника по пятницу с 9:00 до 18:00."
      - question: "Что такое объект off-market?"
        answer: "Объект off-market — это недвижимость, продаваемая конфиденциально, без размещения на публичных порталах. Agence Immobilière de la Gare располагает эксклюзивным портфелем объектов off-market в Монако, доступных по запросу."
      - question: "Предлагаете ли вы услуги по управлению арендой?"
        answer: "Да, с 1942 года мы предлагаем полный спектр услуг по управлению арендой в Монако. Мы берём на себя поиск арендаторов, составление договоров аренды, акты приёма-передачи, сбор арендной платы и все административные формальности."

