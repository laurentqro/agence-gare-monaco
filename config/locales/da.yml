  gestion:
    title: "Ejendomsadministration i Monaco"
    intro: "Når man ejer en ejendom, kan det være svært at administrere den i betragtning af forskellige personlige eller professionelle forpligtelser og den stress, det kan medføre i hverdagen. Agence de la Gare stiller en komplet ejendomsadministrationsservice til rådighed for alle jeres ejendomme, for at lette dialogen med jeres lejere. Som ejendomseksperter stiller vi et team af fagfolk til jeres rådighed, som sikrer administrationen af hele jeres udlejningsejendomsportefølje."
    missions_title: "Hvilke opgaver varetager vores bureau?"
    missions_text: "Agence de la Gare udfører en lang række opgaver, der spænder fra offentliggørelse af lejeannoncer til åbning af vand- og elmålere, herunder underskrivelse af lejekontrakten."
    publication_title: "Hvordan offentliggør vi jeres ejendom og udvælger kandidater?"
    publication_text_1: "Vi offentliggør jeres ejendom på alle vores kommunikationskanaler med det formål at udleje den hurtigst muligt. Derefter følger valget af lejer."
    publication_text_2: "Vores rolle er at vurdere kandidaternes økonomiske kapacitet. For at gøre dette beder vi dem om at fremlægge:"
    publication_item_1: "deres seneste lønsedler"
    publication_item_2: "deres ansættelseskontrakt"
    publication_item_3: "bankattestering"
    publication_text_3: "En undersøgelse hos de tidligere udlejere angivet af de interesserede kan også gennemføres med det formål at besvare disse to væsentlige spørgsmål:"
    publication_question_1: "Er han en god betaler?"
    publication_question_2: "Er han af god moral?"
    publication_text_4: "Vores særligt krævende udvælgelse efterlader aldrig plads til tvivl. Lejemarkedet har fordelen af en stærk efterspørgsel, hvilket gør det muligt for os at være særligt selektive. Ingen lejer flytter ind i en lejlighed, vi administrerer, uden stærke garantier for betalingsevne."
    contract_title: "Hvordan udarbejder vi lejekontrakten og installerer lejeren?"
    contract_text_1: "Bureauet tager sig af at udarbejde lejekontrakten for jer. Det samme gælder for gennemførelse af ind- og udflytningssyn. Vi kan endda, efter jeres ønske, lade synene udføre af en foged."
    contract_text_2: "Som administrator af jeres ejendomme varetager vi alle administrative procedurer, herunder registrering af jeres ejendom eller enhver anden juridisk forpligtelse. Vores ejendomsbureau kan for eksempel være den foretrukne kontaktperson for Skattemyndighederne."
    contract_text_3: "I permanent kontakt med lejeren tager vores team sig af åbning af vand- og elmålere. Vi sikrer også, at lejeren har udført obligatoriske kontroller, som for eksempel kedelsyn."
    contract_text_4: "Vi kontrollerer, at lejligheden er forsikret, ikke kun af jer som ejer, men også af lejeren. Vores bureau kan arrangere tegning af disse forsikringer efter behov."
    life_title: "Hvordan følger vi hele ejendommens liv?"
    life_text_1: "Ud over at udføre alle formaliteter i forbindelse med ejerskab af en udlejningsejendom i Monaco deltager vi mere generelt i alle aktiviteter, der vedrører bygningens liv."
    life_text_2: "Et af vores teammedlemmer vil være til stede ved alle generalforsamlinger i ejerforeningen, et resuménotat vil blive vedlagt jeres mappe, så I til enhver tid kan have et overblik over situationen for jeres ejendom. På samme måde vil vedkommende følge op på eventuelle vedligeholdelses- og istandsættelsesarbejder, der udføres i jeres lejlighed eller i bygningen."
    life_text_3: "Det er også vedkommende, der håndterer alle skader. De vil sørge for, at forsikringsselskaberne informeres og kontakte kompetente firmaer for at gendanne jeres ejendom hurtigst muligt."
    funds_title: "Hvordan administrerer vi jeres midler?"
    funds_text_1: "Agence de la Gare er som administrator ansvarlig for opkrævning af huslejer. Vi sikrer, at midlerne betales af lejeren uden mangler eller forsinkede betalinger. Uanset om det drejer sig om fondsindkaldelser, udsendelse af huslejekvitteringer eller retfærdig regulering af fællesudgifter, følger administratoren alle økonomiske bevægelser vedrørende jeres ejendom."
    funds_text_2: "Agence de la Gare har i flere årtier administreret flere ejendomsporteføljer i Monaco. Vi har et ekspertteam og al nødvendig viden til at administrere jeres ejendomme effektivt og omsorgsfuldt."
    cta_title: "Ønsker du at benytte vores ejendomsadministration?"
    cta_text: "Kontakt os for at tale med vores specialiserede udlejningsafdeling og lære mere om vores tjenester."

  vendre:
    title: "Hvordan sælger du din ejendom i Monaco?"
    intro: "Vores ekspertteam guider dig gennem hvert trin i salget af din ejendom i Monaco. Fra vurdering til underskrift af den notarielle bekræftelse sætter vi vores ekspertise til din rådighed for at sikre en vellykket transaktion."
    estimate_title: "Hvor meget er din ejendom i Monaco værd?"
    estimate_text: "En god vurdering er nøglen til et vellykket salg. Vores eksperter analyserer ejendomsmarkedet i Monaco, sammenligner nyligt solgte lignende ejendomme og tager hensyn til de unikke egenskaber ved din ejendom for at tilbyde dig et retfærdigt og realistisk estimat. Dette trin er afgørende for at tiltrække seriøse købere og sælge under de bedste betingelser."
    admin_title: "Hvilke dokumenter kræves for at sælge i Monaco?"
    admin_text: "Vi tager os af alt for at forenkle dit liv. Vores team samler alle de dokumenter, der kræves for at sætte din ejendom til salg."
    admin_docs_intro: "Vi indsamler følgende dokumenter fra dig:"
    admin_doc_1: "Ejendomsskøde"
    admin_doc_2: "Seneste referater fra generalforsamling"
    admin_doc_3: "Obligatoriske tekniske diagnoser"
    admin_doc_4: "Opgørelse over fællesudgifter"
    admin_doc_5: "Ejendomsskat"
    admin_doc_6: "Plantegninger"
    admin_doc_7: "Arealdokumentation (Carrez-loven)"
    admin_doc_8: "Seneste kvitteringer for fællesudgifter"
    admin_mandate_intro: "Når din dokumentation er komplet, kan vi oprette salgsmandatet, der formaliserer vores samarbejde."
    mandate_title: "Alt du skal vide om salgsmandatet"
    mandate_intro: "Salgsmandatet kan tage tre forskellige former. Hver tilbyder specifikke fordele afhængigt af din situation og dine mål."
    mandate_simple_title: "Det simple mandat"
    mandate_simple_text_1: "Det simple mandat giver dig mulighed for at betro salget af din ejendom til flere bureauer samtidigt. Du beholder også muligheden for at sælge på egen hånd."
    mandate_simple_text_2: "Denne formel tilbyder stor fleksibilitet, men kan resultere i mindre engagement fra hvert bureau, da ejendommen udbydes af flere mellemmænd."
    mandate_simple_text_3: "Det simple mandat er velegnet, hvis du ønsker at maksimere synligheden af din ejendom hos forskellige netværk af potentielle købere."
    mandate_exclusive_title: "Det eksklusive mandat"
    mandate_exclusive_text_1: "Det eksklusive mandat betror salget af din ejendom til et enkelt bureau i en bestemt periode. Denne eksklusivitet gør det muligt for os at bruge alle vores ressourcer til at sælge din ejendom under de bedste betingelser."
    mandate_exclusive_text_2: "Med et eksklusivt mandat investerer vi mere i markedsføringen af din ejendom: professionel fotografering, virtuelle fremvisninger, målrettet distribution til vores netværk af kvalificerede købere."
    mandate_exclusive_text_3: "Denne formel anbefales til prestigeejendomme eller når diskretion ønskes."
    mandate_coexclusive_title: "Det sameksklusive mandat"
    mandate_coexclusive_text_1: "Det sameksklusive mandat er et kompromis mellem det simple og det eksklusive mandat. Du betror salget til et begrænset antal bureauer (normalt to eller tre), der arbejder sammen."
    mandate_coexclusive_text_2: "Denne formel giver dig mulighed for at drage fordel af god markedsdækning og samtidig opretholde et højt engagement fra de mandaterede bureauer."
    mandate_choice: "Når det drejer sig om at vælge type mandat, rådgiver vores team dig baseret på din ejendoms karakter, det aktuelle marked og dine prioriteter. Vi guider dig i at træffe den bedste beslutning."
    selling_title: "Hvordan sælger vi din ejendom?"
    selling_text_1: "Når mandatet er underskrevet, implementerer vi vores markedsføringsstrategi. Din ejendom distribueres via alle vores kanaler: hjemmeside, ejendomsportaler, sociale medier og vores netværk af kvalificerede købere."
    selling_text_2: "Når en potentiel køber melder sig, arrangerer vi fremvisninger og forhandler på dine vegne for at opnå den bedste pris. Hvert tilbud præsenteres for dig med vores analyse og anbefalinger."
    selling_text_3: "Når tilbuddet er accepteret, ledsager vi begge parter til underskriften af den foreløbige salgsaftale hos notaren. Dette dokument forpligter køber og sælger og fastsætter betingelserne for transaktionen."
    selling_text_4: "Underskriften af den notarielle bekræftelse hos notaren afslutter salget. Vi forbliver ved din side til dette sidste trin for at sikre, at alt forløber perfekt."
    funds_title: "Hvornår og hvordan udbetales midlerne?"
    funds_text_1: "Efter underskriften af den notarielle bekræftelse foretager notaren udbetalingen af midler. Salgsprisen, fratrukket gebyrer og eventuelle tilbagebetalinger af lån, udbetales til dig inden for dage efter underskriften."
    funds_text_2: "Vores team forbliver tilgængeligt efter salget for at besvare alle dine spørgsmål og støtte dig i dine fremtidige projekter."
    cta_title: "Planlægger du at sælge?"
    cta_text: "Ønsker du at betro os salget af din ejendom? Udfyld formularen nedenfor, og en af vores ejendomsrådgivere vil kontakte dig hurtigst muligt."

