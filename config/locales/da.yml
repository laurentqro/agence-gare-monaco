  homepage:
    hero_title: "Ejendomme i Monaco siden 1942"
    hero_subtitle: "Medlem af Chambre Immobilière Monégasque"
    about_title: "Agence Immobilière de la Gare"
    about_history: "Agence Immobilière de la Gare blev grundlagt i 1942 og er en uafhængig familievirksomhed samt medlem af Chambre Immobilière Monégasque. Ideelt beliggende i hjertet af det livlige Condamine-kvarter, ved foden af den majestætiske klippe hvor Fyrstepaladset troner, ledes vores bureau af Pierre Maré og hans søn Adrien Maré. Med rig erfaring og en dynamisk tilgang har vi opbygget tillidsfulde relationer med vores kunder, fra generation til generation."
    about_services: "Vi tilbyder omfattende ejendomssalg, udlejning og administration i Monaco. Vi tilbyder personlig forvaltning af jeres ejendomme, med omhyggelig vedligeholdelse og streng opfølgning, for at garantere optimalt lejeafkast. Vi varetager alle administrative formaliteter: udarbejdelse af lejekontrakter, skatteregistrering, ind- og udflytningsbesigtigelser samt el-, vand- og forsikringsaftaler."
    about_expertise: "Vores ekspertise gør det muligt at samarbejde med monegaskiske notarer og advokater om estimering og vurdering af fast ejendom. I samarbejde med firmaet Tania Indretningsarkitektur tilbyder vi projekter til ombygning af lejligheder. Vores virkeområde strækker sig til Fyrstendømmet Monaco og den tilgrænsende franske region. Kontakt os på (+377) 93 30 22 36 eller info@agencegaremonaco.com."
    team_title: "Vores Team"
    team:
      email_member: "Send e-mail til %{name}"
      pierre_role: "Medleder"
      adrien_role: "Direktør / Forhandler"
      josiane_role: "Sekretariat / Forvaltning"
      pierre_bio: "Pierre Maré er medejer af Agence Immobilière de la Gare i Monaco. Med flere årtiers erfaring inden for monegaskisk ejendom leder han familiebureauet grundlagt i 1942. Hans dybe kendskab til Fyrstedømmets ejendomsmarked og mangeårige relationer med lokale notarer og advokater gør ham til en betroet rådgiver for ejendomstransaktioner i Monaco."
      adrien_bio: "Adrien Maré er direktør og forhandler hos Agence Immobilière de la Gare. Som repræsentant for den nye generation af dette familiebureau grundlagt i 1942, tilfører han en dynamisk og moderne tilgang til monegaskisk ejendom. Specialiseret i salg og forhandling, guider Adrien sine kunder gennem alle trin i deres ejendomsprojekter i Monaco."
      josiane_bio: "Josiane Alesi er ansvarlig for sekretariat og ejendomsadministration hos Agence Immobilière de la Gare. Med indgående kendskab til monegaskiske administrative procedurer varetager hun den daglige administration af udlejningsejendomme, lejekontrakter, tilstandsrapporter og lejerrelationer."
    featured_articles_title: "Artikler"
    articles_view_all: "Se alle artikler"
    read_more: "Læs mere"
    contact_title: "Kontakt os"
    carousel_title: "Monaco"
    card_buy: "Købe"
    card_rent: "Leje"
    card_offmarket: "Off-market"
