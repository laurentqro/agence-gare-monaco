  gestion:
    title: "Ejendomsadministration i Monaco"
    intro: "Når man ejer en ejendom, kan det være svært at administrere den i betragtning af forskellige personlige eller professionelle forpligtelser og den stress, det kan medføre i hverdagen. Agence de la Gare stiller en komplet ejendomsadministrationsservice til rådighed for alle jeres ejendomme, for at lette dialogen med jeres lejere. Som ejendomseksperter stiller vi et team af fagfolk til jeres rådighed, som sikrer administrationen af hele jeres udlejningsejendomsportefølje."
    missions_title: "Hvilke opgaver varetager vores bureau?"
    missions_text: "Agence de la Gare udfører en lang række opgaver, der spænder fra offentliggørelse af lejeannoncer til åbning af vand- og elmålere, herunder underskrivelse af lejekontrakten."
    publication_title: "Hvordan offentliggør vi jeres ejendom og udvælger kandidater?"
    publication_text_1: "Vi offentliggør jeres ejendom på alle vores kommunikationskanaler med det formål at udleje den hurtigst muligt. Derefter følger valget af lejer."
    publication_text_2: "Vores rolle er at vurdere kandidaternes økonomiske kapacitet. For at gøre dette beder vi dem om at fremlægge:"
    publication_item_1: "deres seneste lønsedler"
    publication_item_2: "deres ansættelseskontrakt"
    publication_item_3: "bankattestering"
    publication_text_3: "En undersøgelse hos de tidligere udlejere angivet af de interesserede kan også gennemføres med det formål at besvare disse to væsentlige spørgsmål:"
    publication_question_1: "Er han en god betaler?"
    publication_question_2: "Er han af god moral?"
    publication_text_4: "Vores særligt krævende udvælgelse efterlader aldrig plads til tvivl. Lejemarkedet har fordelen af en stærk efterspørgsel, hvilket gør det muligt for os at være særligt selektive. Ingen lejer flytter ind i en lejlighed, vi administrerer, uden stærke garantier for betalingsevne."
    contract_title: "Hvordan udarbejder vi lejekontrakten og installerer lejeren?"
    contract_text_1: "Bureauet tager sig af at udarbejde lejekontrakten for jer. Det samme gælder for gennemførelse af ind- og udflytningssyn. Vi kan endda, efter jeres ønske, lade synene udføre af en foged."
    contract_text_2: "Som administrator af jeres ejendomme varetager vi alle administrative procedurer, herunder registrering af jeres ejendom eller enhver anden juridisk forpligtelse. Vores ejendomsbureau kan for eksempel være den foretrukne kontaktperson for Skattemyndighederne."
    contract_text_3: "I permanent kontakt med lejeren tager vores team sig af åbning af vand- og elmålere. Vi sikrer også, at lejeren har udført obligatoriske kontroller, som for eksempel kedelsyn."
    contract_text_4: "Vi kontrollerer, at lejligheden er forsikret, ikke kun af jer som ejer, men også af lejeren. Vores bureau kan arrangere tegning af disse forsikringer efter behov."
    life_title: "Hvordan følger vi hele ejendommens liv?"
    life_text_1: "Ud over at udføre alle formaliteter i forbindelse med ejerskab af en udlejningsejendom i Monaco deltager vi mere generelt i alle aktiviteter, der vedrører bygningens liv."
    life_text_2: "Et af vores teammedlemmer vil være til stede ved alle generalforsamlinger i ejerforeningen, et resuménotat vil blive vedlagt jeres mappe, så I til enhver tid kan have et overblik over situationen for jeres ejendom. På samme måde vil vedkommende følge op på eventuelle vedligeholdelses- og istandsættelsesarbejder, der udføres i jeres lejlighed eller i bygningen."
    life_text_3: "Det er også vedkommende, der håndterer alle skader. De vil sørge for, at forsikringsselskaberne informeres og kontakte kompetente firmaer for at gendanne jeres ejendom hurtigst muligt."
    funds_title: "Hvordan administrerer vi jeres midler?"
    funds_text_1: "Agence de la Gare er som administrator ansvarlig for opkrævning af huslejer. Vi sikrer, at midlerne betales af lejeren uden mangler eller forsinkede betalinger. Uanset om det drejer sig om fondsindkaldelser, udsendelse af huslejekvitteringer eller retfærdig regulering af fællesudgifter, følger administratoren alle økonomiske bevægelser vedrørende jeres ejendom."
    funds_text_2: "Agence de la Gare har i flere årtier administreret flere ejendomsporteføljer i Monaco. Vi har et ekspertteam og al nødvendig viden til at administrere jeres ejendomme effektivt og omsorgsfuldt."
    cta_title: "Ønsker du at benytte vores ejendomsadministration?"
    cta_text: "Kontakt os for at tale med vores specialiserede udlejningsafdeling og lære mere om vores tjenester."

  vendre:
    title: "Hvordan sælger man sin ejendom i Monaco?"
    intro: "Vores ekspertteam ledsager dig gennem alle de nødvendige trin for at gennemføre dit salgsprojekt i Monaco."
    estimate_title: "Vurdér værdien af din ejendom"
    estimate_text: "En god vurdering af din ejendom gør det muligt at gennemføre et hurtigt salg, for den reelle værdi af din ejendom vil tiltrække de rette købere. For at fastslå den reelle værdi af din ejendom kommer en af vores agenturs mæglere ud og besigtiger din ejendom for at indsamle så mange oplysninger som muligt med henblik på at vurdere den rette pris. Her er de metoder, vi støtter os til, når vi vurderer din ejendom."
    admin_title: "Vi varetager hele den administrative del af salget"
    admin_text: "Vi tager os af alt, så din oplevelse bliver så behagelig som muligt."
    admin_docs_intro: "Vi indhenter hos dig samtlige dokumenter, der er nødvendige for salget af din ejendom, det vil sige:"
    admin_doc_1: "din ejendomsattest på den ejendom, der skal sælges,"
    admin_doc_2: "en kopi af dine identitetspapirer (gyldigt pas og identitetskort og/eller opholdstilladelse)"
    admin_doc_3: "en kopi af en bopælsattest"
    admin_doc_4: "de tre seneste referater fra ejerforeningens generalforsamling,"
    admin_doc_5: "ejerforeningens vedtægter,"
    admin_doc_6: "samtlige juridiske dokumenter vedrørende dit selskab, hvis du gennemfører salget som juridisk person,"
    admin_doc_7: "lejeadministrationssagen, hvis den ejendom, du sælger, er omfattet af en lejekontrakt,"
    admin_doc_8: "afleveringssagen for arbejderne i forbindelse med byggerier, der er underlagt byggetilladelse."
    admin_mandate_intro: "Når din sag er komplet, vil vores team foreslå dig at indgå en salgsfuldmagt. Det er en kontrakt, der angiver salgsprisen, vores honorar, dens varighed samt dens betingelser. Det er en bilateral kontrakt, der forpligter os gensidigt."
    mandate_title: "Alt om salgsfuldmagten"
    mandate_intro: "Salgsfuldmagten kan antage tre former. Den kan være simpel, eksklusiv eller co-eksklusiv:"
    mandate_simple_title: "Den simple salgsfuldmagt"
    mandate_simple_text_1: "Denne type fuldmagt giver dig mulighed for at betro salget af din ejendom til flere ejendomsmæglere (juridisk korrekt kaldet fuldmægtige). Den giver dig også mulighed for selv at sælge din ejendom. Den fuldmægtige, der er lykkedes med at sætte dig i forbindelse med en køber og med at føre forhandlingerne, vil være den eneste, der bliver honoreret for sin ydelse."
    mandate_simple_text_2: "Denne type fuldmagt giver dig stor handlefrihed, men har dog negative sider. Den store konkurrence mellem udbyderne mindsker tilsvarende deres chance for at blive honoreret. Det har ofte en tendens til at begrænse vores konkurrenters engagement. Desuden er det almindeligt at se den samme ejendom annonceret med forskellige oplysninger såsom salgsprisen, arealet… hvilket er en alvorlig ulempe i forhandlingerne med de potentielle købere."
    mandate_simple_text_3: "Det er derfor en interessant fuldmagt for dig, hvis du ønsker at bevare kontrollen over salget af din ejendom, men som dog kan være særligt kontraproduktiv."
    mandate_exclusive_title: "Den eksklusive fuldmagt"
    mandate_exclusive_text_1: "Den eksklusive salgsfuldmagt betror salget af ejendommen til en enkelt ejendomsmægler. Kommunikationen om ejendommen er her langt mere sammenhængende. Desuden vil ejendomsmægleren, der ved sig alene om at sælge ejendommen, lægge alle de nødvendige finansielle og menneskelige ressourcer i det for at maksimere salget på de bedste vilkår og inden for de bedste frister."
    mandate_exclusive_text_2: "Strategierne vedrørende salget af ejendommen vil blive besluttet af ét og samme team, hvilket vil gøre det muligt for køberne at se et sammenhængende udbud. Følelsen af pålidelighed er afgørende i den efterfølgende forhandlingsfase. Tilliden mellem parterne under forhandlingerne er nemlig hovedingrediensen i et vellykket salg."
    mandate_exclusive_text_3: "Da denne fuldmagt er eksklusiv, skal du vælge din fuldmægtige med omhu. Du mister nemlig friheden til selv at sælge din ejendom eller til at sætte flere agenturer i konkurrence. Når du arbejder med vores agentur, får du dog én enkelt kontaktperson til at samle alle henvendelser fra potentielle købere eller andre agenturer og til at have fuldstændig styr på din ejendom og de oplysninger, der videregives."
    mandate_coexclusive_title: "Den co-eksklusive fuldmagt"
    mandate_coexclusive_text_1: "Den co-eksklusive fuldmagt kan være den hybride løsning i det tilfælde, hvor hverken vilkårene i den simple fuldmagt eller vilkårene i den eksklusive fuldmagt tilfredsstiller dig. Denne fuldmagt hviler på de samme principper som dem, der regulerer den eksklusive fuldmagt, vi netop har præsenteret. Den giver dig dog mulighed for at betro salget af din ejendom til to ejendomsmæglere."
    mandate_coexclusive_text_2: "Den frembyder nøjagtig de samme fordele, nemlig en større tilrådighedsstillelse af finansielle og menneskelige ressourcer fra agenturernes side og en bedre harmoniseret kommunikationsstrategi end i den simple fuldmagt."
    mandate_choice: "Når det drejer sig om at vælge mellem disse forskellige typer fuldmagter, særligt hvis du er i tvivl mellem en eksklusiv eller en co-eksklusiv fuldmagt, er det at foretrække at tage kontakt til det agentur, du foretrækker. På den måde kan det henvise dig til en fuldmægtig, som der kan udføres et fælles arbejde med, så der opstår en synergi. Du forøger således kræfterne for at nå frem til bedre resultater."
    selling_title: "Hvordan sælger vi din ejendom?"
    selling_text_1: "Vores team udarbejder en salgsargumentation, der ledsager det visuelle indhold (HD-videoer og HD-fotos i 360°) på alle de netværk, vi behersker (hjemmeside, sociale medier, presseomtaler osv.). Når en køber er interesseret, viser vi vedkommende ejendommen i selskab med en af vores mæglere."
    selling_text_2: "Efter denne proces, hvis kunden er interesseret i ejendommen, udarbejder vi et købstilbud, der gengiver vedkommendes betingelser, ledsaget af en check på et beløb svarende til 10% af det tilbudte beløb, udstedt til notaren, for at bevise sin oprigtige vilje til at erhverve ejendommen. Bemærk, at vi er i konstant kontakt med sælger og køber under hele salgsprocessen. I tilfælde af enighed om prisen og genstanden aftaler vi tid hos en notar i fyrstendømmet til underskrift af den foreløbige købsaftale. Checken indløses som et depositum, der modregnes i ejendommens salgspris."
    selling_text_3: "Som vi understregede i vores købsguide til at bosætte sig i Monaco, er underskrift af en foreløbig købsaftale ikke obligatorisk, men kan være nødvendig, navnlig i forbindelse med den monegaskiske stats forkøbsret. Denne ret gælder for alle ejendomme opført før 1947."
    selling_text_4: "Endelig, efter at alle de opsættende betingelser er opfyldt inden for de fastsatte frister, vil det være tid til at mødes igen hos notaren til underskrift af det endelige skøde, på hvilken dato køberen skal betale hele det beløb, der svarer til nævnte ejendoms pris, med fradrag af depositummet, samt notarhonoraret på 6% og agenturkommissionen på 3% eksklusive afgifter af ejendommens pris, ifølge det monegaskiske ejendomskammers takst. I tilfælde af at en af de opsættende betingelser ikke opfyldes, vil depositumchecken blive tilbagebetalt til køberen, og salget vil blive anset for annulleret."
    funds_title: "Udbetalingen af midlerne"
    funds_text_1: "Når dokumenterne er underskrevet hos notaren, vil midlerne blive udbetalt til dig af notarkontoret inden for 15 dage, med fradrag af sælgers agenturhonorar, der ifølge det monegaskiske ejendomskammers takst er fastsat til 5% eksklusive afgifter af salgsprisen."
    funds_text_2: "Vi håber, at du nu ved mere om vores proces for salg af en ejendom i Monaco. For enhver oplysning om køb, salg, udlejning, administration og vurdering af dine ejendomme i Monaco venter vores team med glæde på dig og står til din rådighed."
    cta_title: "Planlægger du at sælge?"
    cta_text: "Ønsker du at betro os salget af din ejendom? Udfyld formularen nedenfor, og en af vores ejendomsrådgivere vil kontakte dig hurtigst muligt."

