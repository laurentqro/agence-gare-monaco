    about_title: "Om os"
    about_text: "Ideelt beliggende i hjertet af det livlige Condamine-kvarter, ved foden af den majestætiske klippe hvor Fyrstepaladset troner, er vores ejendomsmæglerfirma, ledet af Pierre Maré og hans søn Adrien Maré, en uafhængig familievirksomhed. Med rig erfaring og en dynamisk tilgang har vi opbygget tillidsfulde relationer med vores kunder, fra generation til generation.\n\nVi tilbyder personlig forvaltning af jeres ejendomme, med omhyggelig vedligeholdelse og streng opfølgning, for at garantere optimalt lejeafkast og kontinuerlig værdistigning af jeres formue over tid.\n\nUanset om I søger en ejendom at købe eller leje, til et personligt eller professionelt projekt, står vores team til rådighed for at hjælpe jer i hvert trin.\n\nVi varetager alle administrative formaliteter, der er nødvendige for jeres etablering eller jeres lejeres: udarbejdelse af lejekontrakter, registrering hos skattemyndighederne, ind- og udflytningsbesigtigelser samt tegning af el-, vand- og forsikringsaftaler.\n\nVores ekspertise gør det også muligt at samarbejde med monegaskiske notarer og advokater om estimering og vurdering af fast ejendom. Desuden tilbyder vi, i samarbejde med det anerkendte firma « Tania Indretningsarkitektur », projekter til ombygning og renovering af lejligheder.\n\nVores virkeområde strækker sig til Fyrstendømmet Monaco og den tilgrænsende franske region, takket være vores partnerskab med en lokal korrespondent."
