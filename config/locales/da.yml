    homepage_title: "Agence Immobilière de la Gare | Ejendomme i Monaco siden 1942"
    homepage_description: "Medlem af Chambre Immobilière Monégasque, Agence Immobilière de la Gare blev grundlagt i 1942. Salg, udlejning og ejendomsforvaltning i Monaco."
    articles_description: "Artikler og nyheder om ejendomme i Monaco."
    contact_description: "Kontakt Agence Immobilière de la Gare i Monaco. 3, Rue Langlé, MC 98000 Monaco."
