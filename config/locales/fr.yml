  homepage:
    hero_title: "Votre partenaire immobilier à Monaco"
    hero_subtitle: "Depuis 1942"
    about_title: "À propos de nous"
    about_text: "Idéalement située au cœur du quartier animé de la Condamine, au pied du majestueux Rocher où se dresse le Palais Princier, notre agence immobilière, dirigée par Pierre Maré et son fils Adrien Maré, est une entreprise familiale indépendante. Forts d'une riche expérience et d'une approche dynamique, nous avons su bâtir des relations de confiance avec nos clients, de génération en génération.\n\nNous offrons une gestion personnalisée de vos biens immobiliers, en nous assurant d'un entretien soigné et d'un suivi rigoureux, pour garantir un rendement locatif optimal et une valorisation continue de votre patrimoine au fil du temps.\n\nQue vous soyez à la recherche d'un bien à acheter ou à louer, pour un projet personnel ou professionnel, notre équipe se tient à votre disposition pour vous accompagner à chaque étape de votre démarche.\n\nNous prenons en charge toutes les formalités administratives indispensables à votre installation ou à celle de vos locataires : rédaction de baux, enregistrement auprès des services fiscaux, états des lieux d'entrée et de sortie, souscription à des contrats d'électricité, d'eau et d'assurance.\n\nNotre expertise nous permet également de collaborer avec des notaires et avocats monégasques pour l'estimation et l'évaluation de biens immobiliers. De plus, en partenariat avec le réputé cabinet Tania Architecture d'intérieur, nous proposons des projets de réaménagement et de réagencement d'appartements.\n\nNotre domaine d'intervention s'étend à la Principauté de Monaco et à la région française limitrophe, grâce à notre partenariat avec un correspondant local."
    team_title: "Notre Équipe"
    team:
