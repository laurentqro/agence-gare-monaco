  gestion:
    title: "Gestion locative à Monaco"
    intro: "Lorsqu'on est propriétaire d'un bien immobilier, il peut s'avérer difficile de le gérer au vu des différentes occupations personnelles ou professionnelles et le stress que cela peut engendrer au quotidien. L'Agence de la Gare met à votre disposition un service de gestion immobilière pour tous vos biens, afin de faciliter le dialogue avec vos locataires. En tant qu'experts de l'immobilier, nous mettons à votre service une équipe de professionnels, qui assurera la gestion de l'ensemble de votre parc immobilier locatif."
    missions_title: "Quelles sont les missions de notre agence ?"
    missions_text: "L'Agence de la Gare remplit une multitude de missions qui vont de la publication de l'annonce de location jusqu'à l'ouverture des compteurs d'eau et d'électricité, en passant par la signature du contrat de bail."
    publication_title: "Comment publions-nous votre bien et sélectionnons-nous les candidats ?"
    publication_text_1: "Nous publions votre bien sur l'ensemble de nos supports de communication, dans le but de le mettre en location le plus tôt possible. S'ensuit alors le choix du locataire."
    publication_text_2: "Notre rôle est d'évaluer les capacités financières des candidats. Pour ce faire, nous leur demandons de fournir :"
    publication_item_1: "leurs derniers bulletins de salaire"
    publication_item_2: "leur contrat de travail"
    publication_item_3: "attestation bancaire"
    publication_text_3: "Une investigation auprès des précédents bailleurs déclarés par les intéressés peut également être réalisée avec pour objectif de répondre à ces deux questions essentielles :"
    publication_question_1: "Est-il un bon payeur ?"
    publication_question_2: "Est-il de bonne moralité ?"
    publication_text_4: "Notre sélection, particulièrement exigeante, ne laisse jamais la place au doute. Le marché locatif a l'avantage de connaître une forte demande, ce qui nous permet d'être particulièrement sélectif. Aucun locataire ne s'installe dans un appartement que nous gérons sans de fortes garanties de solvabilité."
    contract_title: "Comment rédigeons-nous le contrat de location ?"
    contract_text_1: "L'agence se charge de rédiger le contrat de location pour vous. Il en va de même pour la réalisation de l'état des lieux d'entrée et de sortie du locataire. Nous pouvons même, à votre demande, faire réaliser les états des lieux par un huissier de justice."
    contract_text_2: "En tant que gestionnaire de vos biens, nous nous chargeons de toutes les démarches administratives. Incluant l'enregistrement de votre bien ou toute autre obligation légale. Par exemple, notre agence immobilière peut être l'interlocuteur privilégié des Services Fiscaux."
    contract_text_3: "En contact permanent avec le locataire, ce sont nos équipes qui se chargent de l'ouverture des compteurs d'eau et d'électricité. Nous nous assurons également que le locataire a effectué les contrôles obligatoires, comme le contrôle de la chaudière, par exemple."
    contract_text_4: "Nous vérifions que l'appartement est assuré, non seulement par vous, en qualité de propriétaire, mais également par le locataire. Notre agence peut assurer la souscription à ces assurances, si nécessaire."
    life_title: "Comment suivons-nous la vie de votre bien ?"
    life_text_1: "Outre l'accomplissement de toutes les formalités afférentes à la possession d'un bien locatif à Monaco, nous participons plus généralement à toutes les activités qui concernent la vie de l'immeuble."
    life_text_2: "L'un des membres de notre équipe sera présent à toutes les assemblées générales de la copropriété, une note de synthèse sera annexée à votre dossier de sorte qu'il puisse avoir, à tout moment, une vue d'ensemble de la situation de votre bien. De la même manière, il suivra les éventuels travaux d'entretien et de remise en état qui seront effectués dans votre appartement ou dans l'immeuble."
    life_text_3: "C'est également lui qui gérera tout sinistre. Il veillera à en donner connaissance aux assurances et contactera les sociétés compétentes pour remettre votre bien en état le plus rapidement possible."
    funds_title: "Comment gérons-nous vos fonds ?"
    funds_text_1: "L'Agence de la Gare, en qualité de gestionnaire, se charge de l'encaissement des loyers. Nous assurons que les fonds sont versés par le locataire, sans manquements ni retard de paiement. Qu'il s'agisse des appels de fonds, de l'envoi des quittances de loyer ou encore de la juste régularisation des charges, le gestionnaire suit l'ensemble des mouvements financiers se rapportant à votre bien."
    funds_text_2: "L'Agence de La Gare assure depuis plusieurs décennies la gestion de plusieurs parcs immobiliers à Monaco. Nous avons une équipe experte et toutes les connaissances nécessaires pour gérer en bon père de famille vos biens immobiliers avec efficacité."
    cta_title: "Vous souhaitez profiter de notre service de gestion immobilière ?"
    cta_text: "Contactez-nous pour échanger avec notre département spécialisé en gestion locative et en savoir plus sur nos services."

  vendre:
    title: "Comment vendre son bien immobilier à Monaco ?"
    intro: "Notre équipe experte vous accompagne dans toutes les étapes de la vente de votre bien immobilier à Monaco. De l'estimation à la signature de l'acte authentique, nous mettons notre savoir-faire à votre service pour garantir une transaction réussie."
    estimate_title: "Comment estimer la valeur de votre bien à Monaco ?"
    estimate_text: "Une bonne estimation est la clé d'une vente réussie. Nos experts analysent le marché immobilier monégasque, comparent les biens similaires récemment vendus et prennent en compte les caractéristiques uniques de votre propriété pour vous proposer une estimation juste et réaliste. Cette étape est essentielle pour attirer des acquéreurs sérieux et vendre dans les meilleures conditions."
    admin_title: "Quels documents sont nécessaires pour vendre à Monaco ?"
    admin_text: "Nous prenons tout en charge pour vous simplifier la vie. Notre équipe s'occupe de rassembler l'ensemble des documents nécessaires à la mise en vente de votre bien."
    admin_docs_intro: "Nous recueillons auprès de vous les documents suivants :"
    admin_doc_1: "Titre de propriété"
    admin_doc_2: "Derniers procès-verbaux d'assemblée générale"
    admin_doc_3: "Diagnostics techniques obligatoires"
    admin_doc_4: "Relevé de charges de copropriété"
    admin_doc_5: "Taxe foncière"
    admin_doc_6: "Plans du bien"
    admin_doc_7: "Attestation de superficie (loi Carrez)"
    admin_doc_8: "Dernières quittances de charges"
    admin_mandate_intro: "Une fois votre dossier complet, nous pouvons établir le mandat de vente qui formalisera notre collaboration."
    mandate_title: "Tout savoir sur le mandat de vente"
    mandate_intro: "Le mandat de vente peut prendre trois formes différentes. Chacune présente des avantages spécifiques selon votre situation et vos objectifs."
    mandate_simple_title: "Le mandat simple"
    mandate_simple_text_1: "Le mandat simple vous permet de confier la vente de votre bien à plusieurs agences simultanément. Vous conservez également la possibilité de vendre par vous-même."
    mandate_simple_text_2: "Cette formule offre une grande flexibilité mais peut entraîner une moindre implication de chaque agence, le bien étant proposé par plusieurs intermédiaires."
    mandate_simple_text_3: "Le mandat simple est adapté si vous souhaitez maximiser la visibilité de votre bien auprès de différents réseaux d'acquéreurs potentiels."
    mandate_exclusive_title: "Le mandat exclusif"
    mandate_exclusive_text_1: "Le mandat exclusif confie la vente de votre bien à une seule agence pour une durée déterminée. Cette exclusivité nous permet de déployer tous nos moyens pour vendre votre bien dans les meilleures conditions."
    mandate_exclusive_text_2: "Avec un mandat exclusif, nous investissons davantage dans la promotion de votre bien : photographies professionnelles, visites virtuelles, diffusion ciblée auprès de notre réseau d'acquéreurs qualifiés."
    mandate_exclusive_text_3: "Cette formule est recommandée pour les biens de prestige ou lorsque la discrétion est souhaitée."
    mandate_coexclusive_title: "Le mandat co-exclusif"
    mandate_coexclusive_text_1: "Le mandat co-exclusif est un compromis entre le mandat simple et le mandat exclusif. Vous confiez la vente à un nombre limité d'agences (généralement deux ou trois) qui travaillent ensemble."
    mandate_coexclusive_text_2: "Cette formule permet de bénéficier d'une bonne couverture du marché tout en maintenant un niveau d'engagement élevé de la part des agences mandatées."
    mandate_choice: "Lorsqu'il s'agit de choisir le type de mandat, notre équipe vous conseille en fonction de la nature de votre bien, du marché actuel et de vos priorités. Nous vous accompagnons pour prendre la meilleure décision."
    selling_title: "Comment vendons-nous votre bien ?"
    selling_text_1: "Une fois le mandat signé, nous mettons en œuvre notre stratégie de commercialisation. Votre bien est diffusé sur l'ensemble de nos supports : site internet, portails immobiliers, réseaux sociaux et notre réseau d'acquéreurs qualifiés."
    selling_text_2: "Lorsqu'un acquéreur potentiel se manifeste, nous organisons les visites et négocions en votre nom pour obtenir le meilleur prix. Chaque offre vous est présentée avec notre analyse et nos recommandations."
    selling_text_3: "Une fois l'offre acceptée, nous accompagnons les deux parties jusqu'à la signature du compromis de vente devant notaire. Ce document engage l'acquéreur et le vendeur et fixe les conditions de la transaction."
    selling_text_4: "La signature de l'acte authentique chez le notaire finalise la vente. Nous restons à vos côtés jusqu'à cette dernière étape pour garantir que tout se déroule parfaitement."
    funds_title: "Quand et comment les fonds sont-ils versés ?"
    funds_text_1: "Après la signature de l'acte authentique, le notaire procède au versement des fonds. Le prix de vente, déduction faite des frais et éventuels remboursements d'emprunts, vous est versé dans les jours qui suivent la signature."
    funds_text_2: "Notre équipe reste disponible après la vente pour répondre à toutes vos questions et vous accompagner dans vos projets futurs."
    cta_title: "Un projet de vente ?"
    cta_text: "Vous souhaitez nous confier la vente de votre bien ? Remplissez le formulaire ci-dessous et l'un de nos conseillers en transaction immobilière vous recontactera dans les meilleurs délais."

