  homepage:
    hero_title: "Votre partenaire immobilier à Monaco"
    hero_subtitle: "Depuis 1942"
    about_title: "L'Agence Immobilière de la Gare"
    about_history: "Fondée en 1942, l'Agence Immobilière de la Gare est une entreprise familiale indépendante, membre de la Chambre Immobilière Monégasque. Idéalement située au cœur du quartier animé de la Condamine, au pied du majestueux Rocher où se dresse le Palais Princier, notre agence est dirigée par Pierre Maré et son fils Adrien Maré. Forts d'une riche expérience et d'une approche dynamique, nous avons su bâtir des relations de confiance avec nos clients, de génération en génération."
    about_services: "Nous proposons des services complets de vente, location et gestion immobilière à Monaco. Nous offrons une gestion personnalisée de vos biens, avec un entretien soigné et un suivi rigoureux, pour garantir un rendement locatif optimal. Nous prenons en charge toutes les formalités administratives : rédaction de baux, enregistrement fiscal, états des lieux et souscription aux contrats d'électricité, d'eau et d'assurance."
    about_expertise: "Notre expertise nous permet de collaborer avec des notaires et avocats monégasques pour l'estimation et l'évaluation de biens immobiliers. En partenariat avec le cabinet Tania Architecture d'intérieur, nous proposons des projets de réaménagement d'appartements. Notre domaine d'intervention s'étend à la Principauté de Monaco et à la région française limitrophe. Contactez-nous au (+377) 93 30 22 36 ou à info@agencegaremonaco.com."
    team_title: "Notre Équipe"
    team:
      pierre_role: "Co-Gérant"
      adrien_role: "Directeur / Négociateur"
      josiane_role: "Secrétariat / Gestion"
      pierre_bio: "Pierre Maré est co-gérant de l'Agence Immobilière de la Gare à Monaco. Fort de plusieurs décennies d'expérience dans l'immobilier monégasque, il dirige l'agence familiale fondée en 1942. Son expertise approfondie du marché immobilier de la Principauté et ses relations de longue date avec les notaires et avocats locaux font de lui un conseiller de confiance pour les transactions immobilières à Monaco."
      adrien_bio: "Adrien Maré est directeur et négociateur de l'Agence Immobilière de la Gare. Représentant la nouvelle génération de cette entreprise familiale fondée en 1942, il apporte une approche dynamique et moderne à l'immobilier monégasque. Spécialisé dans la vente et la négociation, Adrien accompagne ses clients dans toutes les étapes de leurs projets immobiliers à Monaco."
      josiane_bio: "Josiane Alesi est responsable du secrétariat et de la gestion locative à l'Agence Immobilière de la Gare. Avec une connaissance approfondie des procédures administratives monégasques, elle assure la gestion quotidienne des biens locatifs, la rédaction des baux, les états des lieux et le suivi des relations avec les locataires."
    featured_articles_title: "Articles"
    read_more: "Lire la suite"
    contact_title: "Contactez-nous"
    carousel_title: "Monaco"
    card_buy: "Acheter"
    card_rent: "Louer"
    card_offmarket: "Off-market"
    card_sell: "Vendre"
    card_management: "Gestion"
    videos_title: "Vidéos"
    videos_view_channel: "Voir toutes nos vidéos"
    faq_title: "Questions fréquentes"
    faqs:
      - question: "Qu'est-ce que l'Agence Immobilière de la Gare ?"
        answer: "L'Agence Immobilière de la Gare est une agence familiale indépendante fondée en 1942 à Monaco, membre de la Chambre Immobilière Monégasque. Située au 3, Rue Langlé dans le quartier de la Condamine, elle est dirigée par Pierre Maré et son fils Adrien Maré."
      - question: "Quels services proposez-vous ?"
        answer: "Nous proposons des services complets de vente, location et gestion immobilière à Monaco et sur la Côte d'Azur. Nous assurons également l'estimation de biens, la rédaction de baux, l'enregistrement fiscal et les états des lieux."
      - question: "Dans quels quartiers de Monaco intervenez-vous ?"
        answer: "Nous intervenons dans tous les quartiers de Monaco : Monte-Carlo, la Condamine, Fontvieille, le Larvotto, Moneghetti, Saint-Roman et Monaco-Ville. Notre domaine s'étend également à la région française limitrophe."
      - question: "Comment contacter l'agence ?"
        answer: "Vous pouvez nous joindre par téléphone au (+377) 93 30 22 36, par email à info@agencegaremonaco.com ou en vous rendant directement au 3, Rue Langlé, MC 98000 Monaco. Nous sommes ouverts du lundi au vendredi de 9h à 18h."
      - question: "Qu'est-ce qu'un bien off-market ?"
        answer: "Un bien off-market est une propriété vendue de manière confidentielle, sans publication sur les portails immobiliers. L'Agence Immobilière de la Gare dispose d'un portefeuille exclusif de biens off-market à Monaco, accessibles sur demande."
      - question: "Proposez-vous un service de gestion locative ?"
        answer: "Oui, depuis 1942, nous proposons un service complet de gestion locative à Monaco. Nous prenons en charge la recherche de locataires, la rédaction des baux, les états des lieux, l'encaissement des loyers et toutes les formalités administratives."

