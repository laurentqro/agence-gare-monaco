  privacy:
    title: "Politique de protection des données personnelles"
    intro_html: "Conformément à la <a href=\"https://legimonaco.mc/tnc/loi/2024/12-03-1.565\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"underline\">Loi n° 1.565 du 3 décembre 2024</a> relative à la protection des données personnelles en Principauté de Monaco, Agence de la Gare vous informe des modalités de collecte, de traitement et d'utilisation de vos données à caractère personnel, ainsi que de vos droits."
