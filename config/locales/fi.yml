  homepage:
    hero_title: "Kiinteistöt Monacossa vuodesta 1942"
    hero_subtitle: "Chambre Immobilière Monégasquen jäsen"
    about_title: "Agence Immobilière de la Gare"
    about_history: "Vuonna 1942 perustettu Agence Immobilière de la Gare on itsenäinen perheyritys ja Chambre Immobilière Monégasquen jäsen. Ihanteellisesti vilkkaan Condamine-kaupunginosan sydämessä, majesteettisen kallion juurella, jossa Ruhtinaan palatsi kohoaa, toimistoamme johtavat Pierre Maré ja hänen poikansa Adrien Maré. Rikkaan kokemuksen ja dynaamisen lähestymistavan ansiosta olemme rakentaneet luottamuksellisia suhteita asiakkaisiimme sukupolvesta toiseen."
    about_services: "Tarjoamme kattavia kiinteistöjen myynti-, vuokraus- ja hallintapalveluita Monacossa. Tarjoamme kiinteistöjenne yksilöllistä hallintaa huolellisella kunnossapidolla ja tarkalla seurannalla optimaalisen vuokratuoton takaamiseksi. Hoidamme kaikki hallinnolliset muodollisuudet: vuokrasopimusten laatiminen, verorekisteröinti, sisään- ja ulosmuuttotarkastukset sekä sähkö-, vesi- ja vakuutussopimukset."
    about_expertise: "Asiantuntemuksemme mahdollistaa yhteistyön monacalaisten notaarien ja asianajajien kanssa kiinteistöjen arvioinnissa ja arvonmäärityksessä. Yhteistyössä Tania Sisustusarkkitehtuuri -toimiston kanssa tarjoamme asuntojen uudelleensuunnitteluprojekteja. Toiminta-alueemme ulottuu Monacon ruhtinaskuntaan ja viereiselle Ranskan alueelle. Ota yhteyttä numeroon (+377) 93 30 22 36 tai osoitteeseen info@agencegaremonaco.com."
    team_title: "Tiimimme"
    team:
      pierre_role: "Osaomistaja"
      adrien_role: "Johtaja / Neuvottelija"
      josiane_role: "Sihteeristö / Hallinto"
      pierre_bio: "Pierre Maré on Agence Immobilière de la Garen toinen johtaja Monacossa. Useiden vuosikymmenten kokemuksella monacosaisella kiinteistöalalla hän johtaa vuonna 1942 perustettua perhetoimistoa. Hänen syvällinen tuntemuksensa Ruhtinaskunnan kiinteistömarkkinoista ja pitkäaikaiset suhteet paikallisiin notaareihin ja asianajajiin tekevät hänestä luotettavan neuvonantajan kiinteistökaupoissa Monacossa."
      adrien_bio: "Adrien Maré on Agence Immobilière de la Garen johtaja ja neuvottelija. Vuonna 1942 perustetun perheyrityksen uuden sukupolven edustajana hän tuo dynaamisen ja modernin lähestymistavan monacolaiseen kiinteistöalaan. Myyntiin ja neuvotteluun erikoistuneena Adrien opastaa asiakkaitaan heidän kiinteistöprojektiensa jokaisessa vaiheessa Monacossa."
      josiane_bio: "Josiane Alesi vastaa sihteeristöstä ja kiinteistöhallinnasta Agence Immobilière de la Garessa. Monacon hallinnollisten menettelyjen perusteellisella tuntemuksella hän hoitaa vuokrakiinteistöjen päivittäistä hallintaa, vuokrasopimusten laadintaa, kuntotarkastuksia ja vuokralaissuhteiden ylläpitoa."
    featured_articles_title: "Artikkelit"
    articles_view_all: "Katso kaikki artikkelit"
    read_more: "Lue lisää"
    contact_title: "Ota yhteyttä"
    carousel_title: "Monaco"
    card_buy: "Ostaa"
    card_rent: "Vuokrata"
    card_offmarket: "Off-market"
    card_sell: "Myydä"
    card_management: "Hallinto"
    videos_title: "Videot"
    videos_view_channel: "Katso kaikki videomme"
    faq_title: "Usein kysytyt kysymykset"
    faqs:
      - question: "Mikä on Agence Immobilière de la Gare?"
        answer: "Agence Immobilière de la Gare on itsenäinen perhetoimisto, joka perustettiin vuonna 1942 Monacossa. Se on Chambre Immobilière Monégasquen jäsen. Toimisto sijaitsee osoitteessa 3, Rue Langlé Condaminen kaupunginosassa, ja sitä johtavat Pierre Maré ja hänen poikansa Adrien Maré."
      - question: "Mitä palveluja tarjoatte?"
        answer: "Tarjoamme kattavat kiinteistöjen myynti-, vuokraus- ja hallintapalvelut Monacossa ja Ranskan Rivieralla. Tarjoamme myös kiinteistöarvioita, vuokrasopimusten laadintaa, verorekisteröintiä ja kuntotarkastuksia."
      - question: "Missä Monacon kaupunginosissa toimitte?"
        answer: "Toimimme kaikissa Monacon kaupunginosissa: Monte-Carlo, Condamine, Fontvieille, Larvotto, Moneghetti, Saint-Roman ja Monaco-Ville. Toimialueemme ulottuu myös viereiselle Ranskan alueelle."
      - question: "Miten otan yhteyttä toimistoon?"
        answer: "Voit tavoittaa meidät puhelimitse numerosta (+377) 93 30 22 36, sähköpostilla osoitteeseen info@agencegaremonaco.com tai vierailemalla osoitteessa 3, Rue Langlé, MC 98000 Monaco. Olemme avoinna maanantaista perjantaihin klo 9:00-18:00."
      - question: "Mikä on off-market-kiinteistö?"
        answer: "Off-market-kiinteistö myydään luottamuksellisesti ilman julkista listaamista kiinteistöportaaleissa. Agence Immobilière de la Garella on eksklusiivinen off-market-kiinteistöportfolio Monacossa, saatavilla pyynnöstä."
      - question: "Tarjoatteko kiinteistöhallintapalveluja?"
        answer: "Kyllä, vuodesta 1942 olemme tarjonneet kattavaa kiinteistöhallintapalvelua Monacossa. Huolehdimme vuokralaisten hankinnasta, vuokrasopimusten laadinnasta, kuntotarkastuksista, vuokrankeruusta ja kaikista hallinnollisista muodollisuuksista."

