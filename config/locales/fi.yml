  gestion:
    title: "Kiinteistöhallinta Monacossa"
    intro: "Kiinteistön omistajana sen hallinta voi olla vaikeaa erilaisten henkilökohtaisten tai ammatillisten kiireiden ja niiden aiheuttaman päivittäisen stressin vuoksi. Agence de la Gare tarjoaa käyttöönne kattavan kiinteistöhallintapalvelun kaikille kiinteistöillenne, helpottaakseen vuoropuhelua vuokralaistenne kanssa. Kiinteistöalan asiantuntijoina asetamme palvelukseenne ammattilaistiimin, joka huolehtii koko vuokrakiinteistöportfolionne hallinnasta."
    missions_title: "Mitkä ovat toimistomme tehtävät?"
    missions_text: "Agence de la Gare hoitaa lukuisia tehtäviä vuokrailmoituksen julkaisemisesta vesi- ja sähkömittareiden avaamiseen, mukaan lukien vuokrasopimuksen allekirjoittaminen."
    publication_title: "Miten julkaisemme kiinteistönne ja valitsemme hakijat?"
    publication_text_1: "Julkaisemme kiinteistönne kaikissa viestintäkanavissamme tavoitteena vuokrata se mahdollisimman pian. Tämän jälkeen seuraa vuokralaisen valinta."
    publication_text_2: "Tehtävämme on arvioida hakijoiden taloudellista suorituskykyä. Tätä varten pyydämme heitä toimittamaan:"
    publication_item_1: "viimeisimmät palkkatodistukset"
    publication_item_2: "työsopimus"
    publication_item_3: "pankkitodistus"
    publication_text_3: "Tutkimus hakijoiden ilmoittamien aiempien vuokranantajien luona voidaan myös suorittaa tavoitteena vastata näihin kahteen olennaiseen kysymykseen:"
    publication_question_1: "Onko hän hyvä maksaja?"
    publication_question_2: "Onko hän hyvätapainen?"
    publication_text_4: "Erityisen vaativa valintamme ei koskaan jätä tilaa epäilykselle. Vuokramarkkinoilla on vahva kysyntä, mikä mahdollistaa erityisen valikoivan otteen. Yksikään vuokralainen ei muuta hallinnoimaamme asuntoon ilman vahvoja maksukyvyn takeita."
    contract_title: "Miten laadimme vuokrasopimuksen ja asennnamme vuokralaisen?"
    contract_text_1: "Toimisto huolehtii vuokrasopimuksen laatimisesta puolestanne. Sama koskee sisään- ja ulosmuuttotarkastusten suorittamista. Voimme myös pyynnöstänne teettää tarkastukset ulosottomiehellä."
    contract_text_2: "Kiinteistöjenne hallinnoijana hoidamme kaikki hallinnolliset menettelyt, mukaan lukien kiinteistönne rekisteröinnin tai muut lakisääteiset velvoitteet. Esimerkiksi kiinteistötoimistomme voi olla verottajan ensisijainen yhteyshenkilö."
    contract_text_3: "Jatkuvassa yhteydessä vuokralaiseen tiimimme huolehtii vesi- ja sähkömittareiden avaamisesta. Varmistamme myös, että vuokralainen on suorittanut pakolliset tarkastukset, kuten esimerkiksi kattilantarkastuksen."
    contract_text_4: "Tarkistamme, että asunto on vakuutettu, ei vain teidän omistajana, vaan myös vuokralaisen toimesta. Toimistomme voi tarvittaessa hoitaa näiden vakuutusten hankkimisen."
    life_title: "Miten seuraamme kiinteistönne koko elinkaarta?"
    life_text_1: "Kaikkien vuokrakiinteistön omistamiseen liittyvien muodollisuuksien hoitamisen lisäksi osallistumme yleisemmin kaikkiin rakennuksen elämää koskeviin toimintoihin."
    life_text_2: "Yksi tiimimme jäsenistä on läsnä kaikissa taloyhtiön yhtiökokouksissa, yhteenvetomuistio liitetään tiedostoonne, jotta voitte milloin tahansa saada yleiskuvan kiinteistönne tilanteesta. Samoin hän seuraa mahdollisia huolto- ja kunnostustöitä, joita suoritetaan asunnossanne tai rakennuksessa."
    life_text_3: "Hän hoitaa myös kaikki vahingot. Hän huolehtii vakuutusyhtiöiden informoinnista ja ottaa yhteyttä päteviin yrityksiin kiinteistönne kunnostamiseksi mahdollisimman nopeasti."
    funds_title: "Miten hallinnoimme varojanne?"
    funds_text_1: "Agence de la Gare vastaa hallinnoijana vuokrien perinnästä. Varmistamme, että vuokralainen maksaa varat ilman laiminlyöntejä tai myöhästymisiä. Olipa kyse varojen pyynnöistä, vuokrakuittien lähettämisestä tai vastikkeiden oikeudenmukaisesta tasauksesta, hallinnoija seuraa kaikkia kiinteistöönne liittyviä taloudellisia liikkeitä."
    funds_text_2: "Agence de la Gare on hallinnoinut useiden vuosikymmenten ajan useita kiinteistöportfolioita Monacossa. Meillä on asiantuntijatiimi ja kaikki tarvittava osaaminen kiinteistöjenne tehokkaaseen ja huolelliseen hallintaan."
    cta_title: "Haluatko hyödyntää kiinteistönhallintapalveluamme?"
    cta_text: "Ota meihin yhteyttä keskustellaksesi erikoistuneen vuokrahallintaosastomme kanssa ja saadaksesi lisätietoja palveluistamme."

  vendre:
    title: "Kuinka myydä kiinteistösi Monacossa?"
    intro: "Asiantuntijatiimimme opastaa sinua kaikissa vaiheissa, joita tarvitaan myyntihankkeesi toteuttamiseksi Monacossa."
    estimate_title: "Arvioi kiinteistösi arvo"
    estimate_text: "Hyvä kiinteistösi arviointi mahdollistaa nopean kaupan, sillä kiinteistösi todellinen arvo houkuttelee oikeat ostajat. Kiinteistösi todellisen arvon määrittämiseksi yksi toimistomme neuvottelijoista tulee tutustumaan kiinteistöösi kerätäkseen mahdollisimman paljon tietoa oikean hinnan arvioimiseksi. Tässä ovat menetelmät, joihin nojaamme kiinteistösi arvioinnissa."
    admin_title: "Hoidamme kaiken myynnin hallinnollisen osuuden"
    admin_text: "Otamme kaiken hoitaaksemme, jotta kokemuksesi olisi mahdollisimman miellyttävä."
    admin_docs_intro: "Keräämme sinulta kaikki kiinteistösi myyntiin tarvittavat asiakirjat, eli:"
    admin_doc_1: "myytävän kiinteistön omistustodistuksesi,"
    admin_doc_2: "kopion henkilöllisyysasiakirjoistasi (passi ja voimassa oleva henkilökortti ja/tai oleskelulupa)"
    admin_doc_3: "kopion asuinpaikkatodistuksesta"
    admin_doc_4: "kolme viimeisintä yhtiökokouksen pöytäkirjaa,"
    admin_doc_5: "yhtiöjärjestyksen,"
    admin_doc_6: "kaikki yhtiötäsi koskevat oikeudelliset asiakirjat, jos teet myynnin oikeushenkilönä,"
    admin_doc_7: "vuokranhallinta-asiakirjat, jos myymäsi kiinteistö on vuokrasopimuksen alainen,"
    admin_doc_8: "töiden tarkastusasiakirjat luvanvaraisten työmaiden osalta."
    admin_mandate_intro: "Kun asiakirjasi ovat valmiit, tiimimme ehdottaa sinulle myyntitoimeksiannon solmimista. Kyseessä on sopimus, jossa ilmoitetaan myyntihinta, palkkiomme, sopimuksen kesto sekä sen ehdot. Se on kahdenvälinen sopimus, joka sitoo meitä molemminpuolisesti."
    mandate_title: "Kaikki myyntitoimeksiannosta"
    mandate_intro: "Myyntitoimeksianto voi olla kolmessa eri muodossa. Se voi olla yksinkertainen, yksinoikeustoimeksianto tai yhteisyksinoikeustoimeksianto:"
    mandate_simple_title: "Yksinkertainen myyntitoimeksianto"
    mandate_simple_text_1: "Tämäntyyppinen toimeksianto mahdollistaa kiinteistösi myynnin uskomisen useille kiinteistötoimistoille (joita oikeudellisemmin kutsutaan toimeksisaajiksi). Se jättää sinulle myös mahdollisuuden myydä kiinteistösi itse. Vain se toimeksisaaja, joka on onnistunut saattamaan sinut yhteyteen ostajan kanssa ja johtamaan neuvotteluja, saa palkkion palvelustaan."
    mandate_simple_text_2: "Tämäntyyppinen toimeksianto jättää sinulle suuren toimintavapauden, mutta sillä on kuitenkin kielteisiä puolia. Palveluntarjoajien välinen kova kilpailu vähentää vastaavasti niiden mahdollisuuksia saada palkkio. Tällä on usein taipumus rajoittaa kilpailijoidemme sitoutumista. Lisäksi on yleistä nähdä sama kiinteistö ilmoitettuna eri tiedoilla, kuten myyntihinta, pinta-ala… mikä on vakava haitta neuvotteluissa potentiaalisten ostajien kanssa."
    mandate_simple_text_3: "Se on siis sinulle kiinnostava toimeksianto, jos haluat säilyttää otteen kiinteistösi myynnistä, mutta se voi kuitenkin olla erityisen tuottamaton."
    mandate_exclusive_title: "Yksinoikeustoimeksianto"
    mandate_exclusive_text_1: "Yksinoikeudellinen myyntitoimeksianto uskoo kiinteistön myynnin yhdelle ainoalle kiinteistötoimistolle. Kiinteistöstä tehtävä viestintä on tässä paljon johdonmukaisempaa. Lisäksi kiinteistötoimisto, tietäen olevansa yksin kilpasilla kiinteistön myymisessä, panostaa siihen kaikki tarvittavat taloudelliset ja henkilöresurssit maksimoidakseen myynnin parhaassa aikataulussa ja parhain ehdoin."
    mandate_exclusive_text_2: "Kiinteistön myyntiin liittyvät strategiat päättää yksi ja sama tiimi, mikä mahdollistaa sen, että ostajat näkevät johdonmukaisen tarjouksen. Luotettavuuden tunne on ratkaiseva neuvottelujen myöhemmässä vaiheessa. Osapuolten välinen luottamus neuvottelujen aikana on nimittäin onnistuneen kaupan pääainesosa."
    mandate_exclusive_text_3: "Koska tämä toimeksianto on yksinomainen, sinun on valittava toimeksisaajasi huolellisesti. Menetät nimittäin vapauden myydä kiinteistösi itse tai kilpailuttaa useita toimistoja. Toimistomme kanssa työskennellessäsi hyödyt kuitenkin yhdestä ainoasta yhteyshenkilöstä, joka keskittää kaikki potentiaalisten ostajien tai muiden toimistojen tiedustelut, sekä hallitset täydellisesti kiinteistösi ja luovutetut tiedot."
    mandate_coexclusive_title: "Yhteisyksinoikeustoimeksianto"
    mandate_coexclusive_text_1: "Yhteisyksinoikeustoimeksianto voi olla hybridiratkaisu tapauksessa, jossa sinua eivät tyydytä yksinkertaisen toimeksiannon eivätkä yksinoikeustoimeksiannon ehdot. Tämä toimeksianto perustuu samoihin periaatteisiin kuin juuri esittelemämme yksinoikeustoimeksianto. Se mahdollistaa kuitenkin kiinteistösi myynnin uskomisen kahdelle kiinteistötoimistolle."
    mandate_coexclusive_text_2: "Sillä on täsmälleen samat edut, eli toimistojen suurempi taloudellisten ja henkilöresurssien käyttöönasettaminen sekä paremmin yhdenmukaistettu viestintästrategia kuin yksinkertaisessa toimeksiannossa."
    mandate_choice: "Kun on kyse valinnasta näiden eri toimeksiantotyyppien välillä, erityisesti jos epäröit yksinoikeustoimeksiannon ja yhteisyksinoikeustoimeksiannon välillä, on suositeltavaa ottaa yhteyttä suosimaasi toimistoon. Tällä tavoin se voi ohjata sinut toimeksisaajalle, jonka kanssa voidaan tehdä yhteistyötä siten, että syntyy synergia. Näin moninkertaistat voimat parempien tulosten saavuttamiseksi."
    selling_title: "Kuinka myymme kiinteistösi?"
    selling_text_1: "Tiimimme laatii myyntiargumentit, jotka täydentävät visuaalista sisältöä (HD-videot ja HD-valokuvat 360°) kaikissa hallitsemissamme kanavissa (verkkosivusto, sosiaalinen media, lehdistökatsaukset jne.). Kun ostaja on kiinnostunut, esittelemme hänelle kiinteistön yhden neuvottelijamme seurassa."
    selling_text_2: "Tämän prosessin jälkeen, jos asiakas on kiinnostunut kiinteistöstä, laadimme ostotarjouksen, jossa esitetään hänen ehtonsa, ja siihen liitetään shekki, jonka suuruus on 10% tarjotusta summasta, notaarin nimiin, todistaakseen hyvän tahtonsa hankkia kiinteistö. On huomattava, että olemme jatkuvasti yhteydessä myyjään ja ostajaan myyntiprosessin keston ajan. Tapauksessa, jossa hinnasta ja kohteesta on yksimielisyys, varaamme ajan ruhtinaskunnan notaarille esisopimuksen allekirjoittamista varten. Shekki lunastetaan ennakkomaksuna, joka vähennetään kiinteistön myyntihinnasta."
    selling_text_3: "Kuten korostimme Monacoon asettumista koskevassa ostooppaassamme, esisopimuksen allekirjoittaminen ei ole pakollista, mutta se voi olla tarpeen, erityisesti Monacon valtion etuosto-oikeuden yhteydessä. Tämä oikeus koskee kaikkia ennen vuotta 1947 rakennettuja rakennuksia."
    selling_text_4: "Lopulta, sen jälkeen kun kaikki lykkäävät ehdot on täytetty määräajoissa, on aika tavata jälleen notaarin luona lopullisen kauppakirjan allekirjoittamista varten, jolloin ostajan on maksettava kokonaisuudessaan kyseisen kiinteistön hintaa vastaava summa, ennakkomaksu vähennettynä, sekä notaarikulut, joiden suuruus on 6%, ja toimistopalkkio, jonka suuruus on 3% verottomana kiinteistön hinnasta, Monacon kiinteistökamarin taksan mukaisesti. Tapauksessa, jossa jokin lykkäävistä ehdoista ei täyty, ennakkomaksushekki palautetaan ostajalle ja kaupan sanotaan peruuntuvan."
    funds_title: "Varojen maksaminen"
    funds_text_1: "Kun asiakirjat on allekirjoitettu notaarin edessä, notaaritoimisto maksaa varat sinulle 15 päivän kuluessa, vähennettynä myyjän toimistopalkkioilla, jotka on Monacon kiinteistökamarin taksan mukaisesti vahvistettu 5%:iin verottomana myyntihinnasta."
    funds_text_2: "Toivomme, että tiedät nyt enemmän kiinteistön myyntiprosessistamme Monacossa. Kaikissa kiinteistöjesi ostoa, myyntiä, vuokrausta, hallintaa ja arviointia koskevissa tiedoissa Monacossa tiimimme odottaa sinua mielellään ja on käytettävissäsi."
    cta_title: "Suunnitteletko myyntiä?"
    cta_text: "Haluatko antaa kiinteistösi myynnin meille? Täytä alla oleva lomake, niin yksi kiinteistöneuvojistamme ottaa sinuun yhteyttä mahdollisimman pian."

