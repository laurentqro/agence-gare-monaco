  gestion:
    title: "Kiinteistöhallinta Monacossa"
    intro: "Kiinteistön omistajana sen hallinta voi olla vaikeaa erilaisten henkilökohtaisten tai ammatillisten kiireiden ja niiden aiheuttaman päivittäisen stressin vuoksi. Agence de la Gare tarjoaa käyttöönne kattavan kiinteistöhallintapalvelun kaikille kiinteistöillenne, helpottaakseen vuoropuhelua vuokralaistenne kanssa. Kiinteistöalan asiantuntijoina asetamme palvelukseenne ammattilaistiimin, joka huolehtii koko vuokrakiinteistöportfolionne hallinnasta."
    missions_title: "Mitkä ovat toimistomme tehtävät?"
    missions_text: "Agence de la Gare hoitaa lukuisia tehtäviä vuokrailmoituksen julkaisemisesta vesi- ja sähkömittareiden avaamiseen, mukaan lukien vuokrasopimuksen allekirjoittaminen."
    publication_title: "Miten julkaisemme kiinteistönne ja valitsemme hakijat?"
    publication_text_1: "Julkaisemme kiinteistönne kaikissa viestintäkanavissamme tavoitteena vuokrata se mahdollisimman pian. Tämän jälkeen seuraa vuokralaisen valinta."
    publication_text_2: "Tehtävämme on arvioida hakijoiden taloudellista suorituskykyä. Tätä varten pyydämme heitä toimittamaan:"
    publication_item_1: "viimeisimmät palkkatodistukset"
    publication_item_2: "työsopimus"
    publication_item_3: "pankkitodistus"
    publication_text_3: "Tutkimus hakijoiden ilmoittamien aiempien vuokranantajien luona voidaan myös suorittaa tavoitteena vastata näihin kahteen olennaiseen kysymykseen:"
    publication_question_1: "Onko hän hyvä maksaja?"
    publication_question_2: "Onko hän hyvätapainen?"
    publication_text_4: "Erityisen vaativa valintamme ei koskaan jätä tilaa epäilykselle. Vuokramarkkinoilla on vahva kysyntä, mikä mahdollistaa erityisen valikoivan otteen. Yksikään vuokralainen ei muuta hallinnoimaamme asuntoon ilman vahvoja maksukyvyn takeita."
    contract_title: "Miten laadimme vuokrasopimuksen ja asennnamme vuokralaisen?"
    contract_text_1: "Toimisto huolehtii vuokrasopimuksen laatimisesta puolestanne. Sama koskee sisään- ja ulosmuuttotarkastusten suorittamista. Voimme myös pyynnöstänne teettää tarkastukset ulosottomiehellä."
    contract_text_2: "Kiinteistöjenne hallinnoijana hoidamme kaikki hallinnolliset menettelyt, mukaan lukien kiinteistönne rekisteröinnin tai muut lakisääteiset velvoitteet. Esimerkiksi kiinteistötoimistomme voi olla verottajan ensisijainen yhteyshenkilö."
    contract_text_3: "Jatkuvassa yhteydessä vuokralaiseen tiimimme huolehtii vesi- ja sähkömittareiden avaamisesta. Varmistamme myös, että vuokralainen on suorittanut pakolliset tarkastukset, kuten esimerkiksi kattilantarkastuksen."
    contract_text_4: "Tarkistamme, että asunto on vakuutettu, ei vain teidän omistajana, vaan myös vuokralaisen toimesta. Toimistomme voi tarvittaessa hoitaa näiden vakuutusten hankkimisen."
    life_title: "Miten seuraamme kiinteistönne koko elinkaarta?"
    life_text_1: "Kaikkien vuokrakiinteistön omistamiseen liittyvien muodollisuuksien hoitamisen lisäksi osallistumme yleisemmin kaikkiin rakennuksen elämää koskeviin toimintoihin."
    life_text_2: "Yksi tiimimme jäsenistä on läsnä kaikissa taloyhtiön yhtiökokouksissa, yhteenvetomuistio liitetään tiedostoonne, jotta voitte milloin tahansa saada yleiskuvan kiinteistönne tilanteesta. Samoin hän seuraa mahdollisia huolto- ja kunnostustöitä, joita suoritetaan asunnossanne tai rakennuksessa."
    life_text_3: "Hän hoitaa myös kaikki vahingot. Hän huolehtii vakuutusyhtiöiden informoinnista ja ottaa yhteyttä päteviin yrityksiin kiinteistönne kunnostamiseksi mahdollisimman nopeasti."
    funds_title: "Miten hallinnoimme varojanne?"
    funds_text_1: "Agence de la Gare vastaa hallinnoijana vuokrien perinnästä. Varmistamme, että vuokralainen maksaa varat ilman laiminlyöntejä tai myöhästymisiä. Olipa kyse varojen pyynnöistä, vuokrakuittien lähettämisestä tai vastikkeiden oikeudenmukaisesta tasauksesta, hallinnoija seuraa kaikkia kiinteistöönne liittyviä taloudellisia liikkeitä."
    funds_text_2: "Agence de la Gare on hallinnoinut useiden vuosikymmenten ajan useita kiinteistöportfolioita Monacossa. Meillä on asiantuntijatiimi ja kaikki tarvittava osaaminen kiinteistöjenne tehokkaaseen ja huolelliseen hallintaan."
    cta_title: "Haluatko hyödyntää kiinteistönhallintapalveluamme?"
    cta_text: "Ota meihin yhteyttä keskustellaksesi erikoistuneen vuokrahallintaosastomme kanssa ja saadaksesi lisätietoja palveluistamme."

  vendre:
    title: "Kuinka myydä kiinteistösi Monacossa?"
    intro: "Asiantuntijatiimimme opastaa sinua kiinteistösi myynnin jokaisessa vaiheessa Monacossa. Arvioinnista notaarin vahvistaman kauppakirjan allekirjoitukseen asetamme osaamisemme palvelukseesi onnistuneen kaupan takaamiseksi."
    estimate_title: "Kuinka paljon kiinteistösi Monacossa on arvoinen?"
    estimate_text: "Hyvä arviointi on onnistuneen myynnin avain. Asiantuntijamme analysoivat Monacon kiinteistömarkkinoita, vertaavat äskettäin myytyjä vastaavia kiinteistöjä ja ottavat huomioon kiinteistösi ainutlaatuiset ominaisuudet tarjotakseen sinulle oikeudenmukaisen ja realistisen arvion. Tämä vaihe on olennainen vakavien ostajien houkuttelemiseksi ja parhaisiin ehtoihin myymiseksi."
    admin_title: "Mitä asiakirjoja tarvitaan myyntiin Monacossa?"
    admin_text: "Hoidamme kaiken helpottaaksemme elämääsi. Tiimimme kerää kaikki kiinteistösi myyntiin tarvittavat asiakirjat."
    admin_docs_intro: "Keräämme sinulta seuraavat asiakirjat:"
    admin_doc_1: "Omistuskirja"
    admin_doc_2: "Viimeisimmät yhtiökokouspöytäkirjat"
    admin_doc_3: "Pakolliset tekniset diagnoosit"
    admin_doc_4: "Yhtiövastikkeiden selvitys"
    admin_doc_5: "Kiinteistövero"
    admin_doc_6: "Pohjapiirustukset"
    admin_doc_7: "Pinta-alatodistus (Carrez-laki)"
    admin_doc_8: "Viimeisimmät vastikekuitit"
    admin_mandate_intro: "Kun asiakirjasi ovat valmiit, voimme laatia myyntitoimeksiannon, joka virallistaa yhteistyömme."
    mandate_title: "Kaikki mitä sinun tarvitsee tietää myyntitoimeksiannosta"
    mandate_intro: "Myyntitoimeksianto voi olla kolmessa eri muodossa. Jokainen tarjoaa erityisiä etuja tilanteestasi ja tavoitteistasi riippuen."
    mandate_simple_title: "Yksinkertainen toimeksianto"
    mandate_simple_text_1: "Yksinkertainen toimeksianto mahdollistaa kiinteistösi myynnin uskomisen useille toimistoille samanaikaisesti. Säilytät myös mahdollisuuden myydä itse."
    mandate_simple_text_2: "Tämä kaava tarjoaa suurta joustavuutta, mutta voi johtaa vähäisempään sitoutumiseen jokaiselta toimistolta, koska kiinteistöä tarjotaan useiden välittäjien kautta."
    mandate_simple_text_3: "Yksinkertainen toimeksianto sopii, jos haluat maksimoida kiinteistösi näkyvyyden eri potentiaalisten ostajien verkostoissa."
    mandate_exclusive_title: "Yksinoikeustoimeksianto"
    mandate_exclusive_text_1: "Yksinoikeustoimeksianto uskoo kiinteistösi myynnin yhdelle toimistolle määräajaksi. Tämä yksinoikeus mahdollistaa kaikkien resurssien käytön kiinteistösi myymiseksi parhailla ehdoilla."
    mandate_exclusive_text_2: "Yksinoikeustoimeksiannolla investoimme enemmän kiinteistösi markkinointiin: ammattivalokuvaus, virtuaalikierrokset, kohdennettu jakelu kvalifioitujen ostajien verkostollemme."
    mandate_exclusive_text_3: "Tätä kaavaa suositellaan arvokiinteistöille tai kun toivotaan hienotunteisuutta."
    mandate_coexclusive_title: "Yhteisyksinoikeustoimeksianto"
    mandate_coexclusive_text_1: "Yhteisyksinoikeustoimeksianto on kompromissi yksinkertaisen ja yksinoikeustoimeksiannon välillä. Uskot myynnin rajoitetulle määrälle toimistoja (yleensä kahdelle tai kolmelle), jotka työskentelevät yhdessä."
    mandate_coexclusive_text_2: "Tämä kaava mahdollistaa hyvän markkinakattavuuden hyödyntämisen samalla kun ylläpidetään korkeaa sitoutumista valtuutetuilta toimistoilta."
    mandate_choice: "Toimeksiantotyypin valinnassa tiimimme neuvoo sinua kiinteistösi luonteen, nykyisen markkinan ja prioriteettiesi perusteella. Opastamme sinua parhaan päätöksen tekemisessä."
    selling_title: "Kuinka myymme kiinteistösi?"
    selling_text_1: "Kun toimeksianto on allekirjoitettu, toteutamme markkinointistrategiamme. Kiinteistösi jaetaan kaikissa kanavissamme: verkkosivusto, kiinteistöportaalit, sosiaalinen media ja kvalifioitujen ostajien verkostomme."
    selling_text_2: "Kun potentiaalinen ostaja ilmoittautuu, järjestämme näytöt ja neuvottelemme puolestasi parhaan hinnan saamiseksi. Jokainen tarjous esitetään sinulle analyysimme ja suositustemme kera."
    selling_text_3: "Kun tarjous hyväksytään, seuraamme molempia osapuolia esisopimuksen allekirjoitukseen notaarin luona. Tämä asiakirja sitoo ostajan ja myyjän ja määrittelee kaupan ehdot."
    selling_text_4: "Notaarin vahvistaman kauppakirjan allekirjoitus viimeistelee myynnin. Pysymme rinnallasi tähän viimeiseen vaiheeseen asti varmistaaksemme, että kaikki sujuu täydellisesti."
    funds_title: "Milloin ja miten varat maksetaan?"
    funds_text_1: "Notaarin vahvistaman kauppakirjan allekirjoituksen jälkeen notaari suorittaa varojen maksun. Myyntihinta, vähennettynä palkkioilla ja mahdollisilla lainan takaisinmaksuilla, maksetaan sinulle päivien kuluessa allekirjoituksesta."
    funds_text_2: "Tiimimme pysyy käytettävissäsi myynnin jälkeen vastatakseen kaikkiin kysymyksiisi ja tukeakseen sinua tulevissa projekteissasi."
    cta_title: "Suunnitteletko myyntiä?"
    cta_text: "Haluatko antaa kiinteistösi myynnin meille? Täytä alla oleva lomake, niin yksi kiinteistöneuvojistamme ottaa sinuun yhteyttä mahdollisimman pian."

