    about_title: "Tietoa meistä"
    about_text: "Ihanteellisesti vilkkaan Condamine-kaupunginosan sydämessä, majesteettisen kallion juurella, jossa Ruhtinaan palatsi kohoaa, kiinteistötoimistomme, jota johtavat Pierre Maré ja hänen poikansa Adrien Maré, on itsenäinen perheyritys. Rikkaan kokemuksen ja dynaamisen lähestymistavan ansiosta olemme rakentaneet luottamuksellisia suhteita asiakkaisiimme sukupolvesta toiseen.\n\nTarjoamme kiinteistöjenne yksilöllistä hallintaa huolellisella kunnossapidolla ja tarkalla seurannalla, taataksemme optimaalisen vuokratuoton ja omaisuutenne jatkuvan arvonnousun ajan myötä.\n\nOlipa kyseessä ostettavan tai vuokrattavan kiinteistön etsiminen henkilökohtaiseen tai ammatilliseen projektiin, tiimimme on käytettävissänne tukemaan teitä prosessin jokaisessa vaiheessa.\n\nHoidamme kaikki asettumiseenne tai vuokralaistenne asettumiseen tarvittavat hallinnolliset muodollisuudet: vuokrasopimusten laatiminen, rekisteröinti veroviranomaisille, sisään- ja ulosmuuttotarkastukset sekä sähkö-, vesi- ja vakuutussopimusten solmiminen.\n\nAsiantuntemuksemme mahdollistaa myös yhteistyön monacalaisten notaarien ja asianajajien kanssa kiinteistöjen arvioinnissa ja arvonmäärityksessä. Lisäksi tarjoamme yhteistyössä arvostetun Tania Sisustusarkkitehtuuri -toimiston kanssa asuntojen uudelleensuunnittelu- ja saneerausprojekteja.\n\nToiminta-alueemme ulottuu Monacon ruhtinaskuntaan ja viereiselle Ranskan alueelle paikallisen yhteistyökumppanimme ansiosta."
