  seo:
    homepage_title: "Agence Immobilière de la Gare | Kiinteistöt Monacossa vuodesta 1942"
    homepage_description: "Itsenäinen perhetoimisto perustettu vuonna 1942, Chambre Immobilière Monégasquen jäsen. Myynti, vuokraus ja kiinteistöhallinta Monacossa. 3, Rue Langlé."
    articles_description: "Artikkeleita ja markkina-analyyseja Monacon kiinteistöistä Agence Immobilière de la Garelta, itsenäinen toimisto vuodesta 1942."
    contact_description: "Ota yhteyttä Agence Immobilière de la Gareen: (+377) 93 30 22 36, info@agencegaremonaco.com. 3, Rue Langlé, MC 98000 Monaco. Ma-Pe 9:00-18:00."
    privacy_description: "Agence Immobilière de la Garen tietosuojakäytäntö, itsenäinen kiinteistötoimisto Monacossa vuodesta 1942."
    listings_sales_monaco_description: "Myytävät kiinteistöt Monacossa Agence Immobilière de la Garelta. Studiot, asunnot, kattoasunnot, toimistot ja pysäköintipaikat kaikissa kaupunginosissa vuodesta 1942."
    listings_rentals_monaco_description: "Vuokrakiinteistöt Monacossa Agence Immobilière de la Garelta. Studiot, asunnot ja toimistot kaikissa kaupunginosissa. Toimisto perustettu 1942."
