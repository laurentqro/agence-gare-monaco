  gestion:
    title: "Eiendomsforvaltning i Monaco"
    intro: "Når man eier en eiendom, kan det være vanskelig å forvalte den med tanke på ulike personlige eller profesjonelle forpliktelser og stresset dette kan medføre i hverdagen. Agence de la Gare tilbyr deg en komplett eiendomsforvaltningstjeneste for alle dine eiendommer, for å lette dialogen med dine leietakere. Som eiendomseksperter stiller vi et team av fagfolk til din disposisjon som sikrer forvaltningen av hele din utleieeiendomsportefølje."
    missions_title: "Hvilke oppdrag har vårt byrå?"
    missions_text: "Agence de la Gare utfører en rekke oppdrag som spenner fra publisering av utleieannonsen til åpning av vann- og strømmålere, inkludert signering av leieavtalen."
    publication_title: "Hvordan publiserer vi eiendommen din og velger kandidater?"
    publication_text_1: "Vi publiserer din eiendom på alle våre kommunikasjonskanaler, med mål om å leie den ut så raskt som mulig. Deretter følger valget av leietaker."
    publication_text_2: "Vår rolle er å vurdere kandidatenes økonomiske kapasitet. For å gjøre dette ber vi dem om å fremlegge:"
    publication_item_1: "deres siste lønnslipper"
    publication_item_2: "deres arbeidskontrakt"
    publication_item_3: "bankattestasjon"
    publication_text_3: "En undersøkelse hos de tidligere utleierne oppgitt av de interesserte kan også gjennomføres med mål om å svare på disse to vesentlige spørsmålene:"
    publication_question_1: "Er han en god betaler?"
    publication_question_2: "Er han av god moral?"
    publication_text_4: "Vår særlig krevende utvelgelse etterlater aldri rom for tvil. Leiemarkedet har fordelen av sterk etterspørsel, noe som gjør at vi kan være særlig selektive. Ingen leietaker flytter inn i en leilighet vi forvalter uten sterke garantier for betalingsevne."
    contract_title: "Hvordan utarbeider vi leieavtalen og installerer leietakeren?"
    contract_text_1: "Byrået tar seg av å utarbeide leieavtalen for deg. Det samme gjelder gjennomføring av inn- og utflyttingsbefaring. Vi kan til og med, på din forespørsel, la befaringene utføres av en namsmann."
    contract_text_2: "Som forvalter av dine eiendommer håndterer vi alle administrative prosedyrer, inkludert registrering av din eiendom eller enhver annen juridisk forpliktelse. Vårt eiendomsbyrå kan for eksempel være den foretrukne kontaktpersonen for Skatteetaten."
    contract_text_3: "I permanent kontakt med leietakeren tar våre team seg av åpning av vann- og strømmålere. Vi sørger også for at leietakeren har utført obligatoriske kontroller, som for eksempel fyringsanleggets kontroll."
    contract_text_4: "Vi verifiserer at leiligheten er forsikret, ikke bare av deg som eier, men også av leietakeren. Vårt byrå kan ordne tegning av disse forsikringene ved behov."
    life_title: "Hvordan følger vi hele eiendommens liv?"
    life_text_1: "I tillegg til å gjennomføre alle formaliteter knyttet til å eie en utleieeiendom i Monaco, deltar vi mer generelt i alle aktiviteter som angår bygningens liv."
    life_text_2: "Et av våre teammedlemmer vil være til stede på alle generalforsamlinger i sameiet, et sammendragsnotat vil bli vedlagt din mappe slik at du når som helst kan ha oversikt over situasjonen til din eiendom. På samme måte vil vedkommende følge opp eventuelle vedlikeholds- og oppussingsarbeider som utføres i din leilighet eller i bygningen."
    life_text_3: "Det er også vedkommende som håndterer alle skader. De vil sørge for at forsikringsselskapene informeres og kontakte kompetente selskaper for å gjenopprette din eiendom så raskt som mulig."
    funds_title: "Hvordan forvalter vi midlene deres?"
    funds_text_1: "Agence de la Gare er som forvalter ansvarlig for innkreving av husleie. Vi sørger for at midlene betales av leietakeren uten mangler eller forsinkede betalinger. Enten det gjelder fondsinnkallelser, utsendelse av husleiekvitteringer eller rettferdig regulering av avgifter, følger forvalteren alle økonomiske bevegelser knyttet til din eiendom."
    funds_text_2: "Agence de la Gare har i flere tiår forvaltet flere eiendomsporteføljer i Monaco. Vi har et ekspertteam og all nødvendig kunnskap for å forvalte dine eiendommer effektivt og omsorgsfullt."
    cta_title: "Ønsker du å benytte vår eiendomsforvaltningstjeneste?"
    cta_text: "Kontakt oss for å snakke med vår spesialiserte utleieavdeling og lære mer om våre tjenester."

  vendre:
    title: "Hvordan selge eiendommen din i Monaco?"
    intro: "Vårt ekspertteam veileder deg gjennom hvert trinn i salget av eiendommen din i Monaco. Fra verdivurdering til signering av notarialbekreftelsen setter vi vår ekspertise til din tjeneste for å sikre en vellykket transaksjon."
    estimate_title: "Hvor mye er eiendommen din i Monaco verdt?"
    estimate_text: "En god verdivurdering er nøkkelen til et vellykket salg. Våre eksperter analyserer eiendomsmarkedet i Monaco, sammenligner nylig solgte lignende eiendommer og tar hensyn til de unike egenskapene ved din eiendom for å gi deg et rettferdig og realistisk estimat. Dette trinnet er avgjørende for å tiltrekke seriøse kjøpere og selge under de beste forholdene."
    admin_title: "Hvilke dokumenter trengs for å selge i Monaco?"
    admin_text: "Vi tar oss av alt for å forenkle livet ditt. Teamet vårt samler inn alle dokumenter som kreves for å legge eiendommen din ut for salg."
    admin_docs_intro: "Vi samler inn følgende dokumenter fra deg:"
    admin_doc_1: "Eiendomsskjøte"
    admin_doc_2: "Siste protokoller fra generalforsamling"
    admin_doc_3: "Obligatoriske tekniske diagnoser"
    admin_doc_4: "Oversikt over felleskostnader"
    admin_doc_5: "Eiendomsskatt"
    admin_doc_6: "Plantegninger"
    admin_doc_7: "Arealbekreftelse (Carrez-loven)"
    admin_doc_8: "Siste kvitteringer for felleskostnader"
    admin_mandate_intro: "Når dokumentasjonen din er komplett, kan vi opprette salgsmandatet som formaliserer vårt samarbeid."
    mandate_title: "Alt du trenger å vite om salgsmandatet"
    mandate_intro: "Salgsmandatet kan ta tre forskjellige former. Hver tilbyr spesifikke fordeler avhengig av din situasjon og dine mål."
    mandate_simple_title: "Det enkle mandatet"
    mandate_simple_text_1: "Det enkle mandatet lar deg betro salget av eiendommen din til flere byråer samtidig. Du beholder også muligheten til å selge på egen hånd."
    mandate_simple_text_2: "Denne formelen tilbyr stor fleksibilitet, men kan resultere i mindre engasjement fra hvert byrå, ettersom eiendommen tilbys av flere mellommenn."
    mandate_simple_text_3: "Det enkle mandatet passer hvis du ønsker å maksimere synligheten til eiendommen din hos ulike nettverk av potensielle kjøpere."
    mandate_exclusive_title: "Det eksklusive mandatet"
    mandate_exclusive_text_1: "Det eksklusive mandatet betror salget av eiendommen din til et enkelt byrå for en bestemt periode. Denne eksklusiviteten gjør det mulig for oss å bruke alle våre ressurser for å selge eiendommen din under de beste forholdene."
    mandate_exclusive_text_2: "Med et eksklusivt mandat investerer vi mer i markedsføringen av eiendommen din: profesjonell fotografering, virtuelle visninger, målrettet distribusjon til vårt nettverk av kvalifiserte kjøpere."
    mandate_exclusive_text_3: "Denne formelen anbefales for prestisjeeiendommer eller når diskresjon er ønsket."
    mandate_coexclusive_title: "Det sameksklusive mandatet"
    mandate_coexclusive_text_1: "Det sameksklusive mandatet er et kompromiss mellom det enkle og det eksklusive mandatet. Du betror salget til et begrenset antall byråer (vanligvis to eller tre) som jobber sammen."
    mandate_coexclusive_text_2: "Denne formelen lar deg dra nytte av god markedsdekning samtidig som et høyt engasjement fra de mandaterte byråene opprettholdes."
    mandate_choice: "Når det gjelder å velge type mandat, gir teamet vårt deg råd basert på eiendommens karakter, det nåværende markedet og dine prioriteringer. Vi veileder deg i å ta den beste beslutningen."
    selling_title: "Hvordan selger vi eiendommen din?"
    selling_text_1: "Når mandatet er signert, implementerer vi vår markedsføringsstrategi. Eiendommen din distribueres via alle våre kanaler: nettsted, eiendomsportaler, sosiale medier og vårt nettverk av kvalifiserte kjøpere."
    selling_text_2: "Når en potensiell kjøper melder seg, organiserer vi visninger og forhandler på dine vegne for å oppnå best mulig pris. Hvert tilbud presenteres for deg med vår analyse og våre anbefalinger."
    selling_text_3: "Når tilbudet er akseptert, følger vi begge parter til signeringen av den foreløpige salgskontrakten foran notaren. Dette dokumentet forplikter kjøper og selger og fastsetter vilkårene for transaksjonen."
    selling_text_4: "Signeringen av notarialbekreftelsen hos notaren fullfører salget. Vi forblir ved din side til dette siste trinnet for å sikre at alt går perfekt."
    funds_title: "Når og hvordan utbetales midlene?"
    funds_text_1: "Etter signeringen av notarialbekreftelsen gjennomfører notaren utbetalingen av midler. Salgsprisen, fratrukket gebyrer og eventuelle tilbakebetalinger av lån, utbetales til deg innen dager etter signeringen."
    funds_text_2: "Teamet vårt forblir tilgjengelig etter salget for å svare på alle spørsmålene dine og støtte deg i dine fremtidige prosjekter."
    cta_title: "Planlegger du å selge?"
    cta_text: "Ønsker du å overlate salget av eiendommen din til oss? Fyll ut skjemaet nedenfor, så vil en av våre eiendomsrådgivere kontakte deg så snart som mulig."

