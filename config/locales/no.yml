  homepage:
    hero_title: "Eiendom i Monaco siden 1942"
    hero_subtitle: "Medlem av Chambre Immobilière Monégasque"
    about_title: "Agence Immobilière de la Gare"
    about_history: "Agence Immobilière de la Gare ble grunnlagt i 1942 og er et uavhengig familieforetak samt medlem av Chambre Immobilière Monégasque. Ideelt beliggende i hjertet av det livlige Condamine-kvarteret, ved foten av den majestetiske klippen der Fyrstepalasset troner, ledes vårt byrå av Pierre Maré og hans sønn Adrien Maré. Med rik erfaring og en dynamisk tilnærming har vi bygget tillitsfulle relasjoner med våre kunder, fra generasjon til generasjon."
    about_services: "Vi tilbyr omfattende eiendomssalg, utleie og forvaltningstjenester i Monaco. Vi tilbyr personlig forvaltning av eiendommene deres, med nøye vedlikehold og streng oppfølging, for å garantere optimal leieavkastning. Vi tar hånd om alle administrative formaliteter: utarbeidelse av leiekontrakter, skatteregistrering, inn- og utflyttingsbefaring samt strøm-, vann- og forsikringsavtaler."
    about_expertise: "Vår ekspertise gjør det mulig å samarbeide med monegaskiske notarer og advokater for estimering og verdivurdering av eiendommer. I samarbeid med firmaet Tania Interiørarkitektur tilbyr vi prosjekter for ominnredning av leiligheter. Vårt virkeområde strekker seg til Fyrstedømmet Monaco og den tilgrensende franske regionen. Kontakt oss på (+377) 93 30 22 36 eller info@agencegaremonaco.com."
    team_title: "Vårt Team"
    team:
      pierre_role: "Medleder"
      adrien_role: "Direktør / Forhandler"
      josiane_role: "Sekretariat / Forvaltning"
      pierre_bio: "Pierre Maré er medeier av Agence Immobilière de la Gare i Monaco. Med flere tiårs erfaring i monegaskisk eiendom leder han familiebyrået grunnlagt i 1942. Hans dype kunnskap om Fyrstedømmets eiendomsmarked og langvarige relasjoner med lokale notarer og advokater gjør ham til en betrodd rådgiver for eiendomstransaksjoner i Monaco."
      adrien_bio: "Adrien Maré er direktør og forhandler hos Agence Immobilière de la Gare. Som representant for den nye generasjonen av dette familiebyrået grunnlagt i 1942, tilfører han en dynamisk og moderne tilnærming til monegaskisk eiendom. Spesialisert i salg og forhandling, veileder Adrien sine kunder gjennom alle trinn i deres eiendomsprosjekter i Monaco."
      josiane_bio: "Josiane Alesi er ansvarlig for sekretariat og eiendomsforvaltning hos Agence Immobilière de la Gare. Med inngående kjennskap til monegaskiske administrative prosedyrer håndterer hun daglig forvaltning av utleieeiendommer, leieavtaler, tilstandsrapporter og leietakerrelasjoner."
    featured_articles_title: "Artikler"
    read_more: "Les mer"
    contact_title: "Kontakt oss"
    carousel_title: "Monaco"
    card_buy: "Kjøpe"
    card_rent: "Leie"
    card_offmarket: "Off-market"
    card_sell: "Selge"
    card_management: "Forvaltning"
    videos_title: "Videoer"
    videos_view_channel: "Se alle våre videoer"
    faq_title: "Ofte stilte spørsmål"
    faqs:
      - question: "Hva er Agence Immobilière de la Gare?"
        answer: "Agence Immobilière de la Gare er et uavhengig familiebyrå grunnlagt i 1942 i Monaco, medlem av Chambre Immobilière Monégasque. Beliggende i 3, Rue Langlé i Condamine-bydelen, ledes det av Pierre Maré og hans sønn Adrien Maré."
      - question: "Hvilke tjenester tilbyr dere?"
        answer: "Vi tilbyr komplette tjenester innen eiendomssalg, utleie og forvaltning i Monaco og på den franske rivieraen. Vi tilbyr også eiendomsvurderinger, leieavtaler, skatteregistrering og tilstandsrapporter."
      - question: "I hvilke bydeler i Monaco opererer dere?"
        answer: "Vi opererer i alle bydeler i Monaco: Monte-Carlo, Condamine, Fontvieille, Larvotto, Moneghetti, Saint-Roman og Monaco-Ville. Vårt område strekker seg også til den nærliggende franske regionen."
      - question: "Hvordan kontakte byrået?"
        answer: "Du kan nå oss per telefon på (+377) 93 30 22 36, via e-post på info@agencegaremonaco.com eller besøke oss på 3, Rue Langlé, MC 98000 Monaco. Vi har åpent mandag til fredag 9:00-18:00."
      - question: "Hva er en off-market-eiendom?"
        answer: "En off-market-eiendom selges konfidensielt, uten å bli listet på offentlige eiendomsportaler. Agence Immobilière de la Gare har en eksklusiv portefølje av off-market-eiendommer i Monaco, tilgjengelig på forespørsel."
      - question: "Tilbyr dere eiendomsforvaltning?"
        answer: "Ja, siden 1942 tilbyr vi en komplett eiendomsforvaltningstjeneste i Monaco. Vi håndterer leietakersøk, leieavtaler, tilstandsrapporter, husleieinnkreving og alle administrative formaliteter."

