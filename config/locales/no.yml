  homepage:
    hero_title: "Eiendom i Monaco siden 1942"
    hero_subtitle: "Medlem av Chambre Immobilière Monégasque"
    about_title: "Om oss"
    about_text: "Ideelt beliggende i hjertet av det livlige Condamine-kvarteret, ved foten av den majestetiske klippen der Fyrstepalasset troner, er vårt eiendomsbyrå, ledet av Pierre Maré og hans sønn Adrien Maré, et uavhengig familieforetak. Med rik erfaring og en dynamisk tilnærming har vi bygget tillitsfulle relasjoner med våre kunder, fra generasjon til generasjon.\n\nVi tilbyr personlig forvaltning av eiendommene deres, med nøye vedlikehold og streng oppfølging, for å garantere optimal leieavkastning og kontinuerlig verdistigning av formuen over tid.\n\nEnten du er på utkikk etter en eiendom å kjøpe eller leie, for et personlig eller profesjonelt prosjekt, står teamet vårt til disposisjon for å bistå deg i hvert trinn.\n\nVi tar hånd om alle administrative formaliteter som er nødvendige for din etablering eller dine leietakeres: utarbeidelse av leiekontrakter, registrering hos skattemyndighetene, inn- og utflyttingsbefaring samt tegning av strøm-, vann- og forsikringsavtaler.\n\nVår ekspertise gjør det også mulig å samarbeide med monegaskiske notarer og advokater for estimering og verdivurdering av eiendommer. I tillegg tilbyr vi, i samarbeid med det anerkjente firmaet Tania Interiørarkitektur, prosjekter for ominnredning og renovering av leiligheter.\n\nVårt virkeområde strekker seg til Fyrstedømmet Monaco og den tilgrensende franske regionen, takket være vårt partnerskap med en lokal korrespondent."
    team_title: "Vårt Team"
