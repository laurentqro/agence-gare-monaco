  gestion:
    title: "Property Management in Monaco"
    intro: "When you own real estate, it can be difficult to manage it given your various personal or professional commitments and the stress it can cause on a daily basis. Agence de la Gare provides you with a comprehensive property management service for all your assets, to facilitate communication with your tenants. As real estate experts, we provide you with a team of professionals who will ensure the management of your entire rental property portfolio."
    missions_title: "What are the missions of our agency?"
    missions_text: "Agence de la Gare fulfils a multitude of missions ranging from the publication of the rental advertisement to the opening of water and electricity meters, including the signing of the lease agreement."
    publication_title: "How do we list your property and select candidates?"
    publication_text_1: "We list your property on all our communication channels, with the aim of renting it out as soon as possible. The choice of tenant then follows."
    publication_text_2: "Our role is to assess the financial capabilities of candidates. To do this, we ask them to provide:"
    publication_item_1: "their latest pay slips"
    publication_item_2: "their employment contract"
    publication_item_3: "bank certificate"
    publication_text_3: "An investigation with the previous landlords declared by the applicants can also be carried out with the objective of answering these two essential questions:"
    publication_question_1: "Is he a good payer?"
    publication_question_2: "Is he of good character?"
    publication_text_4: "Our particularly demanding selection never leaves room for doubt. The rental market has the advantage of strong demand, which allows us to be particularly selective. No tenant moves into an apartment we manage without strong guarantees of solvency."
    contract_title: "How do we draft the lease and install the tenant?"
    contract_text_1: "The agency takes care of drafting the lease for you. The same applies to carrying out the entry and exit inventory. We can even, at your request, have the inventories carried out by a bailiff."
    contract_text_2: "As manager of your properties, we handle all administrative procedures, including the registration of your property or any other legal obligation. For example, our real estate agency can be the preferred point of contact with the Tax Authorities."
    contract_text_3: "In permanent contact with the tenant, our teams take care of opening water and electricity meters. We also ensure that the tenant has carried out mandatory inspections, such as the boiler inspection, for example."
    contract_text_4: "We verify that the apartment is insured, not only by you as the owner, but also by the tenant. Our agency can arrange the subscription to these insurance policies if necessary."
    life_title: "How do we follow the entire life of your property?"
    life_text_1: "In addition to completing all formalities related to owning a rental property in Monaco, we more generally participate in all activities concerning the life of the building."
    life_text_2: "One of our team members will be present at all general meetings of the co-ownership, a summary note will be appended to your file so that you can have, at any time, an overview of the situation of your property. Similarly, they will follow up on any maintenance and renovation work carried out in your apartment or in the building."
    life_text_3: "They will also manage any claims. They will ensure that insurance companies are notified and will contact competent companies to restore your property as quickly as possible."
    funds_title: "How do we manage your funds?"
    funds_text_1: "Agence de la Gare, as manager, is responsible for collecting rents. We ensure that funds are paid by the tenant, without defaults or late payments. Whether it involves calls for funds, sending rent receipts or the fair regularisation of charges, the manager monitors all financial movements relating to your property."
    funds_text_2: "Agence de la Gare has been managing several real estate portfolios in Monaco for several decades. We have an expert team and all the necessary knowledge to manage your real estate efficiently and with care."
    cta_title: "Interested in our property management services?"
    cta_text: "Get in touch with our dedicated rental management department to learn more about our services."

  vendre:
    title: "How to sell your property in Monaco?"
    intro: "Our expert team guides you through every step required to carry out your sale project in Monaco."
    estimate_title: "Estimate the value of your property"
    estimate_text: "A good valuation of your property will help secure a quick sale because the true value of your property will attract the right buyers. To assess the true value of your property, one of our negotiators will come to visit it in order to gather as much information as possible to estimate the fair price. Here are the methods we rely on to value your property."
    admin_title: "We handle the entire administrative side of the sale"
    admin_text: "We take care of everything so that your experience is as pleasant as possible."
    admin_docs_intro: "We gather from you all the documents needed to sell your property, that is to say:"
    admin_doc_1: "your title deed for the property to be sold,"
    admin_doc_2: "a copy of your identity documents (valid passport and identity card and/or residence permit)"
    admin_doc_3: "a copy of a proof of address"
    admin_doc_4: "the last three minutes of the co-ownership general assembly,"
    admin_doc_5: "the co-ownership regulations,"
    admin_doc_6: "all the legal documents relating to your company, if you are carrying out the sale as a legal entity,"
    admin_doc_7: "the rental management file if the property you are selling is subject to a rental lease,"
    admin_doc_8: "the works completion file in the case of projects subject to a permit."
    admin_mandate_intro: "Once your file is complete, our team will propose entering into a sales mandate. This is a contract setting out the sale price, our remuneration, its duration and its conditions. It is a bilateral contract that binds us mutually."
    mandate_title: "Everything you need to know about the sales mandate"
    mandate_intro: "The sales mandate can take three forms. It can be simple, exclusive or co-exclusive:"
    mandate_simple_title: "The simple sales mandate"
    mandate_simple_text_1: "This type of mandate allows you to entrust the sale of your property to several real estate agencies (more legally referred to as mandataries). It also leaves you the opportunity to sell your property yourself. The mandatary who has managed to put you in touch with a buyer and to lead the negotiations will be the only one to be remunerated for its service."
    mandate_simple_text_2: "This type of mandate leaves you a great deal of freedom of action, but nevertheless has negative aspects. The strong competition between providers correspondingly reduces their chance of being remunerated. This often tends to limit the involvement of our competitors. Moreover, it is common to see the same property advertised with differing information such as the sale price, the surface area… which is a serious handicap in negotiations with potential buyers."
    mandate_simple_text_3: "It is therefore an interesting mandate for you if you wish to keep control over the sale of your property, but one that can nevertheless be particularly counterproductive."
    mandate_exclusive_title: "The exclusive mandate"
    mandate_exclusive_text_1: "The exclusive sales mandate entrusts the sale of the property to a single real estate agency. The communication carried out on the property is much more consistent here. In addition, the real estate agency, knowing it is the only one in the running to sell the property, will devote all the necessary financial and human resources to maximise the sale within the best timeframes and conditions."
    mandate_exclusive_text_2: "The strategies relating to the sale of the property will be decided by one and the same team, which will allow buyers to see a coherent offer. The sense of reliability is decisive in the later stage of negotiations. Indeed, trust between the parties during negotiations is the main ingredient of a successful sale."
    mandate_exclusive_text_3: "As this mandate is exclusive, you must choose your mandatary with care. Indeed, you will lose the freedom to sell your property yourself or to put several agencies in competition. However, by working with our agency, you will benefit from a single point of contact to centralise all requests from potential buyers or other agencies and to maintain perfect control over your property and the information disclosed."
    mandate_coexclusive_title: "The co-exclusive mandate"
    mandate_coexclusive_text_1: "The co-exclusive mandate can be the hybrid solution in the case where neither the conditions of the simple mandate nor those of the exclusive mandate satisfy you. This mandate is based on the same principles as those governing the exclusive mandate we have just presented. However, it allows you to entrust the sale of your property to two real estate agencies."
    mandate_coexclusive_text_2: "It offers exactly the same advantages, which are a greater allocation of financial and human resources on the part of the agencies and a better harmonised communication strategy than in the simple mandate."
    mandate_choice: "When it comes to choosing between these different types of mandates, particularly if you are hesitating between an exclusive or co-exclusive mandate, it is best to get in touch with the agency you favour. In this way, it will be able to direct you towards a mandatary with whom joint work can be carried out so that a synergy takes place. You thus multiply the forces to achieve better results."
    selling_title: "How do we sell your property?"
    selling_text_1: "Our teams produce a sales pitch that will accompany the visual content (HD videos and 360° HD photos) across all the channels we master (website, social media, press reviews, etc.). Once a buyer is interested, we have them visit the property accompanied by one of our negotiators."
    selling_text_2: "Following this process, if the client is interested in the property, we draw up a purchase offer setting out their conditions, accompanied by a cheque for an amount of 10% of the sum proposed, payable to the notary, to prove their genuine willingness to acquire the property. Note that we are in constant communication with the seller and the buyer throughout the duration of the sale process. In the event that there is agreement on the price and the property, we make an appointment with a Notary of the principality for the signing of the preliminary sales agreement. The cheque is cashed as a deposit to be credited against the sale price of the property."
    selling_text_3: "As we highlighted in our buying guide for settling in Monaco, the signing of a preliminary sales agreement is not mandatory, but may be necessary, in particular in the context of the Monegasque State's right of pre-emption. This right applies to all buildings constructed before 1947."
    selling_text_4: "Finally, after all the conditions precedent have been satisfied within the allotted timeframes, it will then be time to meet again at the Notary's office for the signing of the final deed of sale, the date on which the buyer must pay in full the amount corresponding to the price of the said property, less the deposit, as well as the notary fees amounting to 6% and the agency commission amounting to 3% excluding tax on the price of the property, according to the scale of the Monegasque real estate chamber. In the event that one of the conditions precedent is not satisfied, the deposit cheque will be refunded to the buyer and the sale will be deemed cancelled."
    funds_title: "The disbursement of funds"
    funds_text_1: "Once the documents are signed before the notary, the funds will be paid to you by the notarial office within 15 days, less the seller's agency fees, set according to the scale of the Monegasque real estate chamber at 5% excluding tax on the sale price."
    funds_text_2: "We hope you now know more about our process for selling a property in Monaco. For any information on the purchase, sale, rental, management and valuation of your properties in Monaco, our team awaits you with pleasure and remains at your disposal."
    cta_title: "Thinking of selling?"
    cta_text: "Would you like to entrust us with the sale of your property? Fill in the form below and one of our property transaction advisors will get back to you as soon as possible."

