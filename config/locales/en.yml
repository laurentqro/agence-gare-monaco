  homepage:
    hero_title: "Real Estate in Monaco since 1942"
    hero_subtitle: "Member of the Chambre Immobilière Monégasque"
    about_title: "Agence Immobilière de la Gare"
    about_history: "Founded in 1942, Agence Immobilière de la Gare is an independent family business and member of the Chambre Immobilière Monégasque. Ideally located in the heart of the lively Condamine district, at the foot of the majestic Rock where the Prince's Palace stands, our agency is managed by Pierre Maré and his son Adrien Maré. With extensive experience and a dynamic approach, we have built trusted relationships with our clients, from generation to generation."
    about_services: "We offer comprehensive property sales, rentals and management services in Monaco. We provide personalised management of your properties, with careful maintenance and rigorous monitoring, to guarantee optimal rental yields. We handle all administrative formalities: drafting leases, tax registration, entry and exit inventories, and subscription to electricity, water and insurance contracts."
    about_expertise: "Our expertise allows us to collaborate with Monegasque notaries and lawyers for property estimation and valuation. In partnership with the firm Tania Interior Architecture, we offer apartment redesign and renovation projects. Our area of operation extends to the Principality of Monaco and the neighbouring French region. Contact us at (+377) 93 30 22 36 or info@agencegaremonaco.com."
    team_title: "Our Team"
    team:
      pierre_role: "Co-Manager"
      adrien_role: "Director / Negotiator"
      josiane_role: "Secretariat / Management"
      pierre_bio: "Pierre Maré is co-manager of Agence Immobilière de la Gare in Monaco. With several decades of experience in Monegasque real estate, he manages the family agency founded in 1942. His deep expertise of the Principality's property market and long-standing relationships with local notaries and lawyers make him a trusted advisor for real estate transactions in Monaco."
      adrien_bio: "Adrien Maré is director and negotiator at Agence Immobilière de la Gare. Representing the new generation of this family business founded in 1942, he brings a dynamic and modern approach to Monegasque real estate. Specialising in sales and negotiation, Adrien guides his clients through every stage of their property projects in Monaco."
      josiane_bio: "Josiane Alesi is head of administration and property management at Agence Immobilière de la Gare. With thorough knowledge of Monegasque administrative procedures, she handles the day-to-day management of rental properties, lease drafting, inventories and tenant relations."
    featured_articles_title: "Articles"
    read_more: "Read more"
    contact_title: "Contact Us"
    carousel_title: "Monaco"
    card_buy: "Buy"
    card_rent: "Rent"
    card_offmarket: "Off-market"
    card_sell: "Sell"
    card_management: "Management"
    videos_title: "Videos"
    videos_view_channel: "View all our videos"
    faq_title: "Frequently Asked Questions"
    faqs:
      - question: "What is Agence Immobilière de la Gare?"
        answer: "Agence Immobilière de la Gare is an independent family agency founded in 1942 in Monaco, member of the Chambre Immobilière Monégasque. Located at 3, Rue Langlé in the Condamine district, it is managed by Pierre Maré and his son Adrien Maré."
      - question: "What services do you offer?"
        answer: "We offer comprehensive property sales, rental and management services in Monaco and on the French Riviera. We also provide property valuations, lease drafting, tax registration and inventory inspections."
      - question: "In which districts of Monaco do you operate?"
        answer: "We operate in all districts of Monaco: Monte-Carlo, Condamine, Fontvieille, Larvotto, Moneghetti, Saint-Roman and Monaco-Ville. Our area also extends to the neighbouring French region."
      - question: "How can I contact the agency?"
        answer: "You can reach us by phone at (+377) 93 30 22 36, by email at info@agencegaremonaco.com or by visiting us at 3, Rue Langlé, MC 98000 Monaco. We are open Monday to Friday from 9am to 6pm."
      - question: "What is an off-market property?"
        answer: "An off-market property is sold confidentially, without being listed on public real estate portals. Agence Immobilière de la Gare has an exclusive portfolio of off-market properties in Monaco, available upon request."
      - question: "Do you offer property management services?"
        answer: "Yes, since 1942, we offer a comprehensive property management service in Monaco. We handle tenant sourcing, lease drafting, inventory inspections, rent collection and all administrative formalities."

