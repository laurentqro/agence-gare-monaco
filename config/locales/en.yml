  privacy:
    title: "Personal Data Protection Policy"
    intro_html: "In accordance with <a href=\"https://legimonaco.mc/tnc/loi/2024/12-03-1.565\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"underline\">Loi n° 1.565 du 3 décembre 2024</a> on the protection of personal data in the Principality of Monaco, Agence de la Gare informs you of the methods of collection, processing and use of your personal data, as well as your rights."
    update_notice: "This policy may be amended to ensure compliance with any legislative or regulatory changes. We invite you to consult it regularly."
    controller_title: "Data Controller"
    controller_text: "The data controller for your personal data is:"
    controller_name: "Agence de la Gare"
    controller_address: "3, rue Langlé, Le Logis, MC 98000 Monaco"
    controller_email: "info@agencegaremonaco.com"
    controller_phone: "(+377) 93 30 22 36"
    contact_form_title: "Processing: Contact Form"
    contact_form_purpose: "The purpose of this processing is to respond to information requests sent by website visitors via the contact form."
    contact_form_basis: "This processing is based on the consent of the data subject (article 5 of Loi n° 1.565 du 3 décembre 2024)."
    contact_form_data: "Data collected: name, email address, phone number (optional), country, subject and message content."
    contact_form_retention: "Data is retained for 3 years from the last contact."
    contact_form_recipients: "Data is accessible only by authorised staff of Agence de la Gare responsible for handling requests."
    property_inquiry_title: "Processing: Property Information Request"
    property_inquiry_purpose: "The purpose of this processing is to respond to information requests relating to a specific property, submitted via the enquiry form or by email."
    property_inquiry_basis: "This processing is based on the consent of the data subject."
    property_inquiry_data: "Data collected: name, email address, phone number (optional), property reference and message content."
    property_inquiry_retention: "Data is retained for 3 years from the last contact."
    property_inquiry_recipients: "Data is accessible only by authorised staff of Agence de la Gare."
    analytics_title: "Processing: Audience Measurement"
    analytics_purpose: "The purpose of this processing is to produce anonymous website traffic statistics (number of visits, pages viewed, geographic origin)."
    analytics_basis: "This processing is based on the legitimate interest of the data controller (website improvement)."
    analytics_tool: "The tool used is Plausible Analytics, hosted in the European Union. Plausible does not set any cookies, does not collect any personal data and anonymises IP addresses. No consent is required."
    analytics_no_transfer: "No data is transferred outside the European Union."
    cookies_title: "Cookies"
    cookies_text: "The website uses only strictly necessary technical cookies for its operation (session management, language preference). These cookies do not collect any personal data. No advertising or tracking cookies are used."
    cookies_plausible: "The audience measurement tool (Plausible Analytics) does not set any cookies."
    rights_title: "Your Rights"
    rights_intro: "In accordance with Loi n° 1.565 du 3 décembre 2024, you have the following rights over your personal data:"
    right_information: "Right to information (articles 10 and 11): to be informed about the use of your data"
    right_access: "Right of access (article 12): to obtain a copy of your data"
    right_rectification: "Right to rectification (article 13): to correct inaccurate or incomplete data"
    right_erasure: "Right to erasure (article 14): to request the deletion of your data"
    right_limitation: "Right to restriction of processing (article 15): to temporarily restrict the use of your data"
    right_opposition: "Right to object (article 17): to object to the processing of your data"
    right_portability: "Right to data portability (article 18): to receive your data in a structured format"
    right_automated: "Right not to be subject to automated decision-making (article 19): not to be subject to a decision based solely on automated processing"
    rights_exercise: "To exercise your rights, you can contact us by email at info@agencegaremonaco.com or by post at the agency address. We undertake to respond to your request within one month."
    dpd_title: "Data Protection Officer"
    dpd_text: "The Data Protection Officer (DPO) of Agence de la Gare is:"
    dpd_name: "Adrien Maré"
    dpd_contact: "For any questions regarding the processing of your personal data, you can contact the DPO by email at info@agencegaremonaco.com or by post at the agency address."
