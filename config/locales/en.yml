    about_title: "About Us"
    about_text: "Ideally located in the heart of the lively Condamine district, at the foot of the majestic Rock where the Prince's Palace stands, our real estate agency, managed by Pierre Maré and his son Adrien Maré, is an independent family business. With extensive experience and a dynamic approach, we have built trusted relationships with our clients, from generation to generation.\n\nWe offer personalised management of your properties, ensuring careful maintenance and rigorous monitoring, to guarantee optimal rental yields and continuous appreciation of your assets over time.\n\nWhether you are looking for a property to buy or rent, for a personal or professional project, our team is at your disposal to support you at every stage of your process.\n\nWe handle all the administrative formalities essential to your settlement or that of your tenants: drafting leases, registration with tax authorities, entry and exit inventories, and subscription to electricity, water and insurance contracts.\n\nOur expertise also allows us to collaborate with Monegasque notaries and lawyers for the estimation and valuation of real estate properties. Furthermore, in partnership with the renowned firm Tania Interior Architecture, we offer apartment redesign and renovation projects.\n\nOur area of operation extends to the Principality of Monaco and the neighbouring French region, thanks to our partnership with a local correspondent."
